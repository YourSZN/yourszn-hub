<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YourSZN True Spring Club</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app. Phones: slim top bar + 5-tab bottom bar. Desktop (>=900px): left sidebar, wide content.
   Season dashboard: warm cream ground, white cards with fine warm borders, YourSZN blue for the "next step". */
:root{
  --ground:#EEE6DB; --card:#FFFFFF; --line:#D9CCBC; --soft:#F6F1EA; --ink:#1C1712; --muted:#5E5248; --muted2:#6B6058;
  --blue:#7A5C48; --blue-deep:#5F4636; --blue-ink:#5F4636; --blue-tint:#F3ECE6; --blue-line:#E8DDD3;
  --pink:#F8E9EE; --pink-ink:#8A3E5A; --rose:#B04A6A; --eyebrow:#8A5A4A;
  --good:#3F6B4E; --good-bg:#E2EFE6; --bad:#B4505F; --bad-bg:#F8E6EA;
  --display:"Playfair Display",Georgia,serif; --body:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --r:22px; --shadow:0 8px 20px rgba(28,23,18,.08); --shadow-lg:0 10px 30px rgba(28,23,18,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.12;text-wrap:balance;margin:0;color:var(--ink)}
h1{font-size:34px} h2{font-size:26px} h3{font-size:21px}
p{margin:0;max-width:68ch}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--blue-deep);outline-offset:2px;border-radius:8px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--eyebrow)}
.muted{color:var(--muted)} .small{font-size:13px}
.stack{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.head{display:grid;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card>*{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid2>*{min-width:0}
ul.clean{margin:0;padding-left:18px;display:grid;gap:4px}
.note{font-size:14px;line-height:1.6;background:var(--soft);border-radius:12px;padding:12px 14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border:0;border-radius:999px;padding:12px 20px;font-size:13.5px;font-weight:600;text-decoration:none;background:var(--ink);color:#FFFFFF;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.blue{background:var(--blue);color:#FFFFFF;font-weight:700}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn svg{width:18px;height:18px}
.toggle{display:inline-flex;align-items:center;gap:8px;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 16px;font-size:13px;font-weight:600}
.toggle[aria-pressed="true"]{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}
.toggle svg{width:18px;height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}

/* shell */
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));background:rgba(238,230,219,.94);backdrop-filter:blur(8px)}
.logo{display:block;height:26px;width:auto}
.avatar{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-family:var(--display);font-size:17px}
.main{padding-block:8px 110px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.inner{max-width:1080px;margin:0 auto}
section.view{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;animation:fade .25s ease}
section.view>*{min-width:0}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:8px max(4px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;font-size:11px;font-weight:600;color:var(--muted2);padding:2px 0}
.tab .ic{display:grid;place-items:center;width:54px;height:30px;border-radius:999px;transition:background .2s}
.tab svg{width:19px;height:19px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ic{background:var(--ink);color:#FFFFFF}
@media (min-width:900px){
  .top,.tabbar{display:none}
  .side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:240px;background:#F7F2EB;border-right:1px solid var(--line);padding:28px 16px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));gap:6px;z-index:20}
  .side .logo{height:30px;margin:0 10px 22px}
  .side .who{margin:0 10px 18px;font-size:12px;color:var(--muted)} .side .who b{display:block;color:var(--ink);font-size:14px;font-weight:600}
  .navi{display:flex;align-items:center;gap:12px;min-height:46px;border:0;background:none;border-radius:14px;padding:0 14px;font-size:14px;font-weight:600;color:var(--muted2);text-align:left}
  .navi svg{width:19px;height:19px}
  .navi:hover{background:#EDE4D8;color:var(--ink)}
  .navi[aria-current="page"]{background:var(--ink);color:#FFFFFF}
  .main{margin-left:240px;padding:34px 48px 60px}
  h1{font-size:40px}
}

/* home */
.hello{font-size:14px;color:var(--muted)}
.hero{background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow-lg);display:grid}
.hero img{display:block;width:100%;height:230px;object-fit:cover}
.hero .in{padding:22px 22px 24px;display:grid;gap:12px}
.hero h1{font-size:42px;margin-top:-4px}
.sig{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.sig span{height:44px;border-radius:12px}
@media (min-width:900px){.hero{grid-template-columns:1.1fr 1fr}.hero img{height:360px}.hero .in{padding:34px;align-content:center}.hero h1{font-size:52px}}
.next{background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 10px 26px rgba(70,48,34,.16);display:grid}
.next .band{background:var(--blue);padding:22px 22px 18px;display:grid;gap:10px;color:#FFFFFF}
.next .band .top-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.next .band .eyebrow{color:#FFFFFF}
.next .band .count{font-size:13px;font-weight:600}
.next .band h2{color:#FFFFFF;font-weight:500;font-size:28px}
.next .body{padding:18px 22px 22px;display:grid;gap:14px;justify-items:start}
.bars{display:flex;gap:6px;width:100%}
.bars span{flex:1;height:5px;border-radius:3px;background:var(--blue-line)}
.bars span.on{background:var(--blue)}
.next .body p{font-size:15px;font-weight:500}
.steps{display:grid;gap:6px;width:100%;margin-top:4px}
.steps button{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;width:100%;min-height:44px;text-align:left;border:0;border-top:1px solid #EFE7DC;background:none;padding:8px 0;font-size:14px}
.steps .tick{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:#FFFFFF}
.steps .done .tick{background:var(--blue);border-color:var(--blue)}
.steps .done .t{color:var(--muted);text-decoration:line-through}
.steps .n{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:900px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);text-align:left;padding:0;color:var(--ink);transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile .pic{height:124px;position:relative;overflow:hidden;background:var(--soft)}
.tile .pic img{width:100%;height:100%;object-fit:cover;display:block}
.tile .lbl{padding:12px 14px 14px}
.tile .lbl b{display:block;font-size:14.5px}
.tile .lbl span{font-size:12.5px;color:var(--muted)}
.mosaic{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:10px;height:100%}
.mosaic span{border-radius:8px}
.splitpic{display:flex;height:100%}
.splitpic span{flex:1}
.splitpic svg{position:absolute;left:50%;bottom:0;width:110px;height:100px;transform:translateX(-50%)}
.fan img{position:absolute;width:70px;height:99px;object-fit:cover;border-radius:6px;box-shadow:0 4px 12px rgba(28,23,18,.18)}
.profile{display:grid;grid-template-columns:96px 1fr 72px;gap:12px 10px;align-items:center;font-size:13.5px}
.meter{display:flex;gap:4px}
.meter span{flex:1;height:8px;border-radius:4px;background:#E8E0D5}
.meter span.on{background:var(--ink)}
.scales{display:grid;gap:18px}
.scale .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.scale .top span{font-size:13.5px;color:var(--muted)} .scale .top b{font-size:13.5px}
.scale .bar{position:relative;height:16px;border-radius:999px}
.scale .fade{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.62)}
.scale .fade.l{left:0;border-radius:999px 0 0 999px}.scale .fade.r{right:0;border-radius:0 999px 999px 0}
.scale .range{position:absolute;top:-4px;bottom:-4px;border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 2px 6px rgba(28,23,18,.2)}
.scale .ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:12.5px;padding:6px 12px;border-radius:999px;background:var(--soft)}
.looks{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-right:-18px;padding-right:18px}
.looks::-webkit-scrollbar{display:none}
.looks img{flex:0 0 170px;height:208px;border-radius:16px;object-fit:cover;background:#F1EEEA;border:1px solid var(--line)}
details.acc>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .plus{font-size:22px;color:var(--muted);transition:transform .2s}
details.acc[open]>summary .plus{transform:rotate(45deg)}
ol.found{list-style:none;margin:14px 0 0;padding:0;display:grid}
ol.found li{display:grid;grid-template-columns:30px 1fr auto;gap:12px;padding:12px 0;border-top:1px solid #EFE7DC;align-items:start}
ol.found .n{width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:700}
ol.found .res{font-weight:600;font-size:13px;text-align:right}
@media (max-width:520px){ol.found li{grid-template-columns:30px 1fr}ol.found .res{grid-column:2;text-align:left;color:var(--blue-ink)}}

/* app card */
.app{display:grid;grid-template-columns:1fr 96px;gap:14px;align-items:center;padding:20px;border-radius:var(--r);background:var(--pink);border:1px solid #EED3DC}
.app .eyebrow{color:var(--pink-ink)}
.app h3{font-size:21px}
.app p{font-size:13.5px;color:var(--muted)}
.app img{width:96px;height:128px;border-radius:14px;object-fit:cover}

section[id],.card[id]{scroll-margin-top:72px}
/* app showcase */
.show{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center;padding:22px;border-radius:var(--r);background:var(--pink);border:1px solid #EED3DC}
.show .eyebrow{color:var(--pink-ink)}
.phone{position:relative;width:150px;height:300px;border-radius:28px;border:6px solid var(--ink);background:#FFFFFF;overflow:hidden;box-shadow:0 12px 28px rgba(28,23,18,.22)}
.phone::before{content:"";position:absolute;top:6px;left:50%;width:44px;height:12px;margin-left:-22px;border-radius:8px;background:var(--ink);z-index:2}
.phone video{width:100%;height:100%;object-fit:cover;display:block}
.phone .roll{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:24px 4px 4px;animation:roll 18s linear infinite}
.phone .roll img{width:100%;height:96px;object-fit:cover;border-radius:8px;display:block}
@keyframes roll{to{transform:translateY(-50%)}}
.facts{display:grid;gap:10px;margin:4px 0 6px}
.facts div{display:flex;align-items:baseline;gap:10px;font-size:13.5px;color:var(--muted)}
.facts b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--ink);min-width:78px}
@media (max-width:420px){.show{grid-template-columns:120px 1fr;gap:16px;padding:18px}.phone{width:120px;height:240px;border-radius:24px;border-width:5px}.phone .roll img{height:76px}.facts{gap:8px}.facts div{flex-direction:column;align-items:flex-start;gap:0;font-size:12.5px;line-height:1.3}.facts b{font-size:22px;min-width:0}}

/* palette */
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:900px){.tools{display:flex}}
.saved{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}
.saved::-webkit-scrollbar{display:none}
.saved button{flex:0 0 76px;display:grid;justify-items:center;gap:6px;border:0;background:none;padding:0;font-size:11.5px;font-weight:600;text-align:center;line-height:1.25}
.saved .dot{width:60px;height:60px;border-radius:50%}
.saved .add{border:1.5px dashed #CFC3B4;display:grid;place-items:center;color:#8A7E73}
.fam-head{display:grid;gap:4px}
.fam-head .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fam-head p{font-size:13.5px;color:var(--muted)}
.chipgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:600px){.chipgrid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}}
.pchip{position:relative;display:grid;gap:8px;padding:6px 6px 10px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:left;box-shadow:0 4px 12px rgba(28,23,18,.06);transition:transform .15s}
.pchip:active{transform:scale(.97)}
.pchip .pc{display:block;height:76px;border-radius:12px}
.pchip .nm{padding:0 4px;font-size:12.5px;font-weight:600;line-height:1.2}
.pchip .ht{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:#FFFFFF;display:grid;place-items:center;box-shadow:0 2px 6px rgba(28,23,18,.18)}
.pchip .ht svg{width:14px;height:14px;fill:var(--rose);stroke:var(--rose)}
.pchip.avoid .pc{position:relative}
.pchip.avoid .pc::after{content:"";position:absolute;inset:47% -2px auto;height:2px;background:#FFFFFF;transform:rotate(-30deg)}
.pchip.avoid .nm{color:var(--muted)}
.swap{display:grid;grid-template-columns:40px 20px 40px 1fr;gap:10px;align-items:center;padding:6px 0}
.dot{width:40px;height:40px;border-radius:50%;border:1px solid rgba(28,23,18,.12)}
.screen-note{font-size:12.5px;color:var(--muted)}

/* colour sheet */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(28,23,18,.45);display:flex;align-items:flex-end;justify-content:center;animation:fadebg .2s ease}
@keyframes fadebg{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:520px;background:#FFFFFF;border-radius:28px 28px 0 0;padding:10px 22px calc(26px + env(safe-area-inset-bottom,0px));display:grid;gap:18px;box-shadow:0 -12px 40px rgba(28,23,18,.18);animation:up .25s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:900px){.sheet-bg{align-items:center}.sheet{border-radius:28px;padding-bottom:26px}}
.grab{justify-self:center;width:40px;height:4px;border-radius:2px;background:var(--line)}
.sheet .top-row{display:grid;grid-template-columns:112px 1fr auto;gap:18px;align-items:center}
.sheet .big{width:112px;height:112px;border-radius:24px}
.sheet h2{font-size:30px}
.sheet .x{width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);font-size:20px;align-self:start}
.sheet .acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sheet .acts .btn{border-radius:14px;min-height:50px}
.heart-btn[aria-pressed="true"]{background:#FFF4F7;border:1px solid #EBC9D4;color:var(--ink)}
.heart-btn svg{fill:none;stroke:var(--rose);stroke-width:2}
.heart-btn[aria-pressed="true"] svg{fill:var(--rose);animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.35)}}
.pairs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pairs div{display:grid;gap:6px;font-size:11.5px;color:var(--muted)}
.pairs .duo{display:flex;height:44px;border-radius:12px;overflow:hidden}
.pairs .duo span{flex:1}
.ramp{display:flex;gap:8px}
.ramp button{flex:1;height:38px;border-radius:10px;border:0;padding:0}
.ramp button[aria-current="true"]{outline:2px solid var(--ink);outline-offset:2px}

/* try on */
.modes{display:inline-flex;background:#E8DFD3;border-radius:999px;padding:4px}
.modes button{border:0;background:none;border-radius:999px;min-height:38px;padding:0 16px;font-size:12.5px;font-weight:700;color:var(--muted)}
.modes button[aria-pressed="true"]{background:#FFFFFF;color:var(--ink);box-shadow:var(--shadow)}
.stage{display:grid;max-width:420px}
.drape{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:4/5;background:var(--soft);border:0;padding:0;max-width:100%;box-shadow:var(--shadow-lg)}
.drape canvas{width:100%;height:100%;display:block}
.drape .tag{position:absolute;left:10px;bottom:10px;font-size:11px;font-weight:700;background:rgba(255,255,255,.92);color:var(--ink);border-radius:999px;padding:5px 11px}
.drape .ph-empty{position:absolute;inset:0;display:grid;justify-items:center;align-content:start;text-align:center;padding:16px;pointer-events:none}
.drape .ph-empty .ex{font-size:12px;font-weight:700;background:rgba(28,23,18,.78);color:#FFFFFF;border-radius:999px;padding:7px 14px}
.drape .half{position:absolute;top:0;bottom:0;width:50%;border:0;background:none;padding:0;cursor:pointer}
.drape .half.l{left:0}.drape .half.r{right:0}
.drape .half[aria-pressed="true"] .tag{background:var(--ink);color:#FFFFFF}
.drape .half.l[aria-pressed="true"]{border-radius:20px 0 0 20px}.drape .half.r[aria-pressed="true"]{border-radius:0 20px 20px 0}
.drape .half.r .tag{left:auto;right:10px}
.picker{display:grid;gap:12px}
.picker .sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:8px}
.sw{aspect-ratio:1;border-radius:50%;border:0;padding:0;position:relative;max-width:100%;box-shadow:inset 0 0 0 1px rgba(28,23,18,.08)}
.sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.sw.avoid::after{content:"";position:absolute;inset:46% -3px auto;height:2px;background:#fff;transform:rotate(-45deg)}
.filebtn{position:relative;cursor:pointer}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.status-line{font-size:13px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:5px;accent-color:var(--blue-deep);width:18px;height:18px}
.mobile-only{display:none}
@media (max-width:899px),(pointer:coarse){.mobile-only{display:inline-flex}.card.mobile-only{display:grid}.desktop-only{display:none}}

/* learn */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#E8DFD3;border-radius:16px;padding:4px;gap:4px;max-width:520px}
.seg button{border:0;background:none;border-radius:12px;min-height:42px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#FFFFFF;color:var(--ink);box-shadow:var(--shadow)}
.chgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:700px){.chgrid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
.chcard{display:grid;grid-template-rows:auto 1fr;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);text-align:left;padding:0}
.chcard .thumb{height:110px;background:var(--soft);overflow:hidden}
.chcard .thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.chcard .t{padding:10px 12px 12px;display:grid;gap:2px}
.chcard .t b{font-size:13.5px;line-height:1.25}
.chcard .t span{font-size:11.5px;color:var(--muted)}
.chcard .lock{font-size:11px;font-weight:700;color:var(--pink-ink)}
.chapter{display:grid;gap:18px}
.chapter .band{background:var(--blue);color:#FFFFFF;border-radius:22px 22px 0 0;margin:-20px -20px 0;padding:22px 20px}
.chapter .band .eyebrow{color:#FFFFFF}
.chapter .band h2{color:#FFFFFF;font-weight:500}
.ch-body{display:grid;gap:16px}
.ch-body h4{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:18px}
.back{justify-self:start;display:inline-flex;align-items:center;gap:6px;border:0;background:none;font-weight:600;font-size:13.5px;min-height:44px;padding:0}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.pg{border:0;padding:0;background:var(--soft);border-radius:10px;overflow:hidden;cursor:zoom-in;box-shadow:var(--shadow);aspect-ratio:874/1241}
.pg img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:640px){.pages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding-bottom:6px}.pg{flex:0 0 62%;scroll-snap-align:start}}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{text-align:left;padding:9px 10px;border-bottom:1px solid #EFE7DC;vertical-align:top}
th{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.locked{display:grid;gap:10px;padding:20px;border-radius:18px;border:1px dashed var(--eyebrow);background:var(--soft)}
.strokes{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.strokes span{height:22px;border-radius:12px 4px 12px 4px}
.hair{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.hair div{padding:10px 12px;border-radius:12px;background:var(--soft);font-size:13px}
.hair b{display:block;font-size:15px}
.combos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px}
.combo{display:grid;gap:8px;justify-items:center;text-align:center;font-size:13px}
.circles{display:flex}
.circles span{width:50px;height:50px;border-radius:50%;margin-left:-14px}
.circles span:first-child{margin-left:0}
.ratio{display:flex;height:44px;border-radius:12px;overflow:hidden}
.ratio div{display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink)}
.quizzes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.qcard{display:grid;align-content:start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:0 0 16px;overflow:hidden;box-shadow:var(--shadow);gap:8px;transition:transform .15s}
.qcard:hover{transform:translateY(-2px)}
.qcard .meta{display:flex;justify-content:space-between;align-items:center;background:var(--blue);padding:12px 16px}
.qcard .meta .eyebrow{color:#FFFFFF}
.qcard h3,.qcard p{padding:0 16px}
.qcard h3{margin-top:6px}
.status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.9);color:var(--blue-ink)}
.status.pass{background:var(--good-bg);color:var(--good)}
.progress{height:6px;border-radius:999px;background:var(--blue-line);overflow:hidden}
.progress div{height:100%;background:var(--blue);transition:width .3s}
.qstage{display:grid;gap:18px}
.qprompt{font-family:var(--display);font-size:24px;line-height:1.25}
.qvisual{display:flex;justify-content:center}
.qvisual .big{width:min(160px,40vw);aspect-ratio:1;border-radius:24px}
.opts{display:grid;gap:10px}
.opts.swatches{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{border:1px solid var(--line);background:#FFFFFF;border-radius:14px;padding:14px 16px;text-align:left;font-weight:500;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.sw-opt{padding:8px;display:grid;justify-items:center}
.opt.sw-opt span.c{width:100%;aspect-ratio:1;border-radius:10px}
.opt.sw-opt .circles span{width:clamp(24px,7vw,48px);height:clamp(24px,7vw,48px);margin-left:-8px}
.opt.sw-opt .circles span:first-child{margin-left:0}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.feedback{padding:12px 14px;border-radius:12px;background:var(--blue-tint);font-size:14px}
.feedback b{display:block;margin-bottom:2px}
.score{font-family:var(--display);font-size:56px;line-height:1}
.confident{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.badge{width:56px;height:56px;border-radius:16px;background:var(--blue);display:grid;place-items:center}
.badge.off{background:#E8E0D5}
.badge{color:#FFFFFF}.badge.off{color:#9C8F84}.badge svg{width:40px;height:40px}
.wvideo{width:100%;aspect-ratio:16/9;border-radius:16px;background:#F3ECE6;border:0;display:grid;place-items:center;gap:8px;align-content:center;color:var(--blue-ink)}
.wvideo .play{width:56px;height:56px;border-radius:50%;background:var(--blue);display:grid;place-items:center}.wvideo .play svg{width:22px;height:22px;fill:#FFFFFF}

/* wardrobe */
.counter{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.counter>div{display:grid;gap:6px;justify-items:center;padding:14px 8px;border-radius:14px;background:var(--soft);text-align:center}
.counter .num{font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.counter .ctl{display:flex;gap:6px}
.counter .ctl button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#FFFFFF;font-size:18px}
textarea,input[type=text]{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
textarea{min-height:70px;resize:vertical}
.todo{display:flex;gap:8px}
.todo-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.todo-list li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--soft);font-size:14px}
.todo-list button{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;min-width:32px;min-height:32px}
.wshop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wshop img{width:100%;height:150px;object-fit:cover;border-radius:14px}

/* colour camera + page viewer */
.cam{position:fixed;inset:0;z-index:2000;background:#000;display:flex;flex-direction:column}
.cam video,.cam img.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-top{position:relative;z-index:2;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:rgba(0,0,0,.45);overflow-x:auto;scrollbar-width:none}
.cam-top button{flex:0 0 auto;border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.25);color:#fff;border-radius:20px;padding:7px 13px;font-size:12px;font-weight:700}
.cam-top button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.cam-top .x{font-size:20px;line-height:1;padding:4px 12px}
.cam-grid{position:relative;z-index:1;flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--d,44px),1fr));gap:var(--g,14px);align-content:start;padding:14px max(14px,env(safe-area-inset-right,0px)) calc(90px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.cam-grid span{aspect-ratio:1;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.cam-bottom{position:absolute;z-index:2;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;align-items:center;padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.45);color:#fff;font-size:12px}
.cam-bottom input[type=range]{width:140px;accent-color:#fff}
.cam-msg{position:absolute;inset:0;display:grid;place-items:center;z-index:3;background:rgba(0,0,0,.55);color:#fff;text-align:center;padding:24px}
.cam-msg .stack{max-width:300px;justify-items:center}
.rv{position:fixed;inset:0;z-index:1000;background:rgba(20,16,12,.94);display:flex;flex-direction:column}
.rv-top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));color:#F9F5F0}
.rv-count{font-size:12px;letter-spacing:1.5px}
.rv-close{background:none;border:0;color:#F9F5F0;font-size:30px;line-height:1;padding:4px 8px}
.rv-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.rv-track::-webkit-scrollbar{display:none}
.rv-slide{flex:0 0 100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;padding:0 12px calc(16px + env(safe-area-inset-bottom,0px))}
.rv-slide img{max-width:100%;max-height:calc(100vh - 90px);object-fit:contain;border-radius:6px}
.rv-arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--ink);font-size:22px;display:flex;align-items:center;justify-content:center}
.rv-arrow.l{left:16px}.rv-arrow.r{right:16px}
@media (max-width:640px){.rv-arrow{display:none}.rv-slide{padding:0 0 16px}}
.footer{font-size:12px;color:var(--muted);padding-top:28px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  chapters:function(h){const S=h.S;return [
  ["Welcome","Start here",`<p>Welcome to the True Spring Club. Your guide is your step-by-step companion for making the most of your season. Wearing your right colours can even out your skin tone, brighten your eyes and help you look polished and confident with less effort.</p><p class="small muted">Tip: lighting changes everything. Check colours in natural daylight, near a window, before you buy.</p>`],
  ["About True Spring","Your season",`<p>Spring is the warm season, with three sub-seasons: Light, True and Bright Spring. True Springs have vibrant, clear complexions with warm, golden undertones, bright eyes and contrasting hair, sometimes with peachy cheeks or a sprinkling of freckles. Even when you tan to a golden bronze, your colouring stays bright and warm.</p><p>High-energy colours like vivid pinks, coral oranges, sunny yellows and bright greens are your most flattering. Your sister seasons are Light Spring and Bright Spring.</p>`],
  ["Your colours","Your palette",`<p>Over 100 True Spring colours, family by family, with the colours to avoid beside each one so you can see the difference.</p><div class="row"><button class="btn ghost" data-go="palette">Open my palette</button><button class="btn ghost" data-go="tryon">Try them on my face</button></div>`],
  ["Contrast","Why bold beats soft for you",`
    <p>Picture an outfit in black and white. The difference between its lightest and darkest parts is its contrast. True Springs look best in <b>medium to high contrast</b>, and the same goes for your makeup.</p>
    <div class="table-wrap"><table><tr><th>Level</th><th>Shade difference</th><th>For you</th></tr><tr><td>Low</td><td>1 to 3</td><td>Can look flat on you</td></tr><tr><td>Medium</td><td>4 to 6</td><td>Works well</td></tr><tr><td>High</td><td>7 to 9</td><td>Your sweet spot, in clear warm colours</td></tr></table></div>`],
  ["Patterns, prints &amp; fabric","Playful prints, shiny finishes",`
    <div><h4>Patterns</h4><p>You shine in vibrant, lively patterns with playful, quirky shapes: classic stripes and spots, boho prints, butterflies, even teacup motifs. Bright, warm shades like coral, turquoise and sunny yellow bring out your natural radiance.</p></div>
    <div><h4>The 80% rule</h4><p>A print works for you when at least 80% of its colours come from your palette.</p></div>
    <div><h4>Fabric &amp; texture</h4><p>Spring is one of the clearest, most radiant seasons, so you look amazing in high-shine, light-reflecting finishes: satin, silk, rayon and sequins. Softer matte fabrics still work, they just don't capture your lively energy in quite the same way.</p></div>
    <div><h4>Denim</h4><p>See the Spring denim page in your guide for washes that suit you.</p></div>`],
  ["Outfit inspiration","Basics, shoes, bags and accessories",`<p>Bright, joyful outfits in your colours, plus the basics, shoes, bags and accessories to build them from.</p>${h.appCTA("Shop these looks","Shop over 7,000 items for your season and 400+ styled looks in the YourSZN app.")}`],
  ["Jewellery, gems &amp; eyewear","Warm gold and bright stones",`
    <p>14k and 18k yellow gold look fantastic on you and harmonise with your bright, warm complexion. Play with coloured gemstones that echo your palette: emerald green, aqua blue, coral and warm red.</p>
    <div><h4>Gemstones from your guide</h4>${h.pills(["Green citrine","Citrine","Ruby","Tiger's eye","Emerald","Onyx"])}</div>
    <div><h4>Jewellery brands</h4>${h.pills(["The Silver Collective","Arms of Eve","JBW","By Charlotte","Christie Nicolaides","Breda","Sezane"])}</div>
    <div><h4>Eyewear</h4><p>Any colour from your palette works for frames. Warm tortoiseshell, gold, teal and bright colours are easy starting points.</p>${h.pills(["Guess","Oroton","OSPM","Bailey Nelson","Miu Miu","Marc Jacobs","Prada"])}</div>`],
  ["True Springs to follow","Inspiration from your season",`
    ${h.pills(["Madelaine Petsch","Simon Baker","Jessica Chastain","Bryce Dallas Howard","Blake Lively","Nicole Kidman","Alex Pettyfer","Sadie Sink","Leslie Mann"])}
    <p class="small muted">Even celebrities miss the mark sometimes, with hair colours or outfits outside their season. Not every True Spring looks alike either.</p>`],
  ["Hair colour","Copper, golden and warm browns",`
    <p>Rich copper reds, warm browns, light browns and golden hues complement your warm undertones and bring out your vibrant colouring. Steer clear of very dark, cool, ashy or muted colours, which can flatten your complexion and dim your natural glow.</p>
    <div><h4>Shades to ask your colourist about</h4><div class="hair">${[["9.0","Very Light Blonde"],["99.0","Warm Very Light Blonde"],["88.0","Warm Light Blonde"],["77.0","Warm Medium Blonde"],["8.3","Light Golden Blonde"],["7.3","Medium Golden Blonde"],["6.3","Dark Golden Blonde"],["8.4","Light Copper Blonde"],["6.4","Dark Copper Blonde"],["9.53","Light Warm Mahogany Blonde"],["6.45","Dark Copper Mahogany"],["5.3","Light Golden Brown"]].map(x=>`<div><b>${x[0]}</b>${x[1]}</div>`).join("")}</div></div>`,true],
  ["Makeup","Bright, warm and luminous",`
    <p>Vibrant, fresh and warm. Clear, crisp shades like coral, turquoise and bright pink for lips and cheeks, with fresh, luminous skin. Avoid muted or very dark shades, which dull your natural vibrancy.</p>
    <div><h4>Lips</h4><p>Antique rose, soft fuchsia, raspberry, watermelon, soft plum and cerise. Choose sheen or glossy finishes. Matte can look dull on you.</p>
      <p class="small muted">From your guide: Rouge Dior 844 Trafalgar, Chanel Rouge Allure 152 Insaisissable, MAC Macximal Sleek Satin in Morange, Clinique Pop Longwear in Melon Pop, Kosas Wet Stick in Papaya, Charlotte Tilbury K.I.S.S.I.N.G in Coral Kiss, Fenty Gloss Bomb in Mango Margz.</p></div>
    <div><h4>Blush</h4><p>Coral, soft peach, warm rose, watermelon, apricot and light tangerine give a fresh, luminous flush.</p>${h.strokes(S.blush)}
      <p class="small muted">From your guide: Rare Beauty Soft Pinch in Joy, Patrick Ta Major Headlines in She's The Moment, Refy Cream Blush in Peach, Charlotte Tilbury Glow in Beach Peach Glow, Mecca Max Cheek Crush in Coral, Tower 28 BeachPlease.</p></div>
    <div><h4>Eyes</h4><p>Highlight with champagne, soft gold, light peach, warm beige and pale apricot. Add depth with teal, emerald, warm brown, golden bronze and soft coral.</p>${h.strokes(S.shadow)}
      <p>Mascara in black-brown, deep espresso, auburn or warm black. Eyeliner in teal, emerald, bronze, warm brown, golden copper or aubergine.</p>
      <p class="small muted">From your guide: Natasha Denona Golden Palette, Too Faced Italian Spritz, Charlotte Tilbury Palette of Beautifying in Emerald Effect.</p></div>
    <div><h4>Bronzer, contour &amp; highlight</h4><p>Bronzers and contours both suit you. Choose bronzers with a golden or peachy undertone, and contours that are slightly warm but subtle. Highlight with champagne and peachy golds.</p>
      <p class="small muted">From your guide: Rare Beauty Warm Wishes Effortless Bronzer Stick, Tarte Sugar Rush bronzer, Refy Cream Bronzer, Fenty Match Stix in Champagne Heist.</p></div>
    <div><h4>Nails &amp; perfume</h4><p>Choose any nail colour from your palette. For perfume, Spring suits warm, inviting notes like honey, vanilla, chocolate and floral bouquets.</p>
      <p class="small muted">From your guide: Ellis Brooklyn Bee, Gucci Flora Gorgeous Gardenia, Maison Rebatchi Vanilla Riviera.</p></div>
    <div><h4>Before you buy</h4><p>Always swatch makeup on your own skin first. Lips and skin react to pigments differently, even within your palette.</p></div>`,true],
  ["Shopping tips","Lighting, names and the maybe rule",`
    <div><h4>Check the light</h4><p>Many shops use dim or warm lighting that flatters clothes. Check colours near a window or take a mirror selfie outside the change room.</p></div>
    <div><h4>Colour names aren't fixed</h4><p>One brand's "teal" is another's "aqua". Judge the colour itself, not its name.</p></div>
    <div><h4>Start small</h4><p>Test new shades where there's no pressure, like gym wear or a cheap tee at home. Fit matters as much as colour, and you won't love every colour in your palette, which is completely normal.</p></div>
    <div><h4>The golden rule</h4><p class="note" style="font-size:18px">If it feels like a "maybe", it's a no.</p></div>
    <div><h4>Foundation &amp; fake tan</h4><p>Don't choose foundation by "warm" or "cool" labels, since brands use them differently. Test in store and take a sample home for a few days. Fake tan is easy for warm-toned Springs: golden or red-based formulas suit you.</p></div>
    <div><h4>Where to start</h4>${h.pills(["Aje","Sheike","The Iconic","Alemais","Gap","Reiss","Max Mara","Alex + Olivia","Sabo","Forever New","Meshki","Wittner","St. Agni","Nine West","Steve Madden","Billini","Polène","Charles & Keith"])}</div>
    ${h.appCTA("Want the exact pieces?","The YourSZN app links straight to items in your colours from these brands and more.")}`],
  ["Colour basics","The theory behind your season",`
    <div><h4>Hue, value and chroma</h4><p><b>Hue</b> is the colour's name, like blue or pink. <b>Value</b> is how light or dark it is. <b>Chroma</b> is how vivid or muted it is. True Spring colours are warm in hue, light to medium in value and clear in chroma.</p></div>
    <div><h4>Tints, tones and shades</h4><p>A <b>tint</b> adds white, a <b>tone</b> adds grey and a <b>shade</b> adds black. Your palette is mostly pure hues and clear tints, with very few greyed tones.</p></div>
    <div><h4>Enhancers and intensifiers</h4><p><b>Enhancers</b> echo your own hair, skin or eye colour for a harmonious look. <b>Intensifiers</b> sit opposite your features on the colour wheel and make them stand out. Wear both above the waist.</p></div>
    <div><h4>Why wrong colours look "off"</h4><p>Colours that are too cool, muted, heavy or dusty for you can drain your warmth, making you look tired or washed out and showing up redness and dark circles. The right colours feel effortless.</p></div>
    <div><h4>Ageing and your colours</h4><p>Your undertone stays the same, but hair and skin soften over time. If your colours stop feeling right, a refresh session is worth it.</p></div>`],
  ["Myths &amp; FAQs","The questions everyone asks",`
    <div class="table-wrap"><table><tr><th>Myth</th><th>Truth</th></tr>
      <tr><td>The vein test tells you your undertone</td><td>Lighting, skin thickness and vein depth make it unreliable.</td></tr>
      <tr><td>Everyone looks good in black</td><td>Black overpowers many people. Chocolate brown is your softer swap.</td></tr>
      <tr><td>You'll look good in every palette colour</td><td>You'll look harmonious in most, but some will suit you better than others.</td></tr>
      <tr><td>You must replace your whole wardrobe</td><td>Not at all. Change at your own pace.</td></tr></table></div>
    <div><h4>My favourite colour isn't in my palette</h4><p>You can still wear it. Keep it away from your face, show some skin between it and your face (like a bandeau top), or wear it in a print that's mostly your colours.</p></div>
    <div><h4>Can my season change?</h4><p>Your undertone stays the same, but hair colour, ageing and lifestyle can shift how colours look on you.</p></div>
    <div><h4>I got a different season before</h4><p>Older 4-season systems, different naming systems and between-season results can all explain it. Message Latisha if you're unsure.</p></div>`],
  ["Closet clean-up","Your wardrobe worksheet",`<p>Sort your wardrobe into keep, maybe and donate, then plan what to shop next.</p><div class="row"><button class="btn ghost" data-go="closet">Open the closet worksheet</button></div>`]
  ]}

function hsl(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return{h,s,l}}
function familyOf(hex){const k=hex.toLowerCase();if(SEASON.famOf&&SEASON.famOf[k])return SEASON.famOf[k];for(const f in SEASON.families)if(SEASON.families[f].avoid.includes(k))return f;const{h,s,l}=hsl(k);return SEASON.famRule(h,s,l)}
function wearTip(hex){const{l}=hsl(hex);if(l>.78)return"A light, airy shade. Wear it right up near your face: shirts, knits, tees and scarves.";if(l>.55)return"A mid-light shade and one of your easiest to wear. Great for tops, dresses and knitwear near your face.";if(l>.38)return"A medium shade. Lovely in dresses and tops, or pair it with a lighter shade to keep your contrast soft.";return"One of your deepest shades. Best for bottoms, outerwear, bags and shoes, with a lighter colour near your face."}
function whyNot(hex){return SEASON.whyNot(hex,hsl)}

const QUIZZES={
  mine:{t:"Is this my colour?",d:"Decide if each colour belongs in your palette. Just like standing in a shop.",build(){

    const allAvoid=[...SEASON.avoidGeneral,...Object.values(SEASON.families).flatMap(f=>f.avoid)];

    return shuffle([...yes,...no]).map(x=>({prompt:`Is this a ${SEASON.name} colour?`,visual:`<span class="big" style="background:${x.c}"></span>`,opts:["Yes, it's mine","No, skip it"],ans:x.ok?0:1,
      why:x.ok?`That's ${nm(x.c)}, one of your palette colours.`:`That's ${nm(x.c)}. It's ${whyNot(x.c)}.`}))}},
  spot:{t:"Spot your shade",d:"Three similar colours, only one is yours. Train your eye for the shades that suit you.",build(){
    return shuffle(SEASON.familyOrder.filter(k=>k!=="neutrals"&&SEASON.families[k].avoid.length>=2)).concat(SEASON.familyOrder.filter(k=>k!=="neutrals"&&SEASON.families[k].avoid.length>=2)).slice(0,6).map(k=>{

  swaps:{t:"Neutral swaps",d:"Swap everyday neutrals for the soft versions that suit you.",build(){

  combo:{t:"Combo check",d:`Pick the pairing that works for a ${SEASON.name}.`,build(){

let qState=null;

function startQuiz(k){qState={k,qs:QUIZZES[k].build(),i:0,score:0};drawQ();$("#qstage").scrollIntoView({behavior:"smooth",block:"start"})}
function drawQ(){
  const s=qState,q=s.qs[s.i],stage=$("#qstage");
  const optHtml=q.opts.map((o,i)=>q.swatches?`<button class="opt sw-opt" data-i="${i}" aria-label="Option ${i+1}"><span class="c" style="background:${o}"></span></button>`
    :q.combos?`<button class="opt sw-opt" data-i="${i}" aria-label="Option ${i+1}"><span class="circles">${o.map(c=>`<span style="background:${c}"></span>`).join("")}</span></button>`

    $("#fb").innerHTML=`<div class="feedback"><b>${ok?pickOne(["That's right.","Spot on.","Nailed it.","Exactly."]):pickOne(["Not quite.","Close, but no.","Good try."])}</b>${esc(q.why)}</div>

const pickOne=a=>a[Math.floor(Math.random()*a.length)];
function finishQ(){
  const s=qState,pct=s.score/s.qs.length,pr=progress();pr[s.k]={best:Math.max(pct,pr[s.k]?.best||0)};store("quiz",pr);

}

// Illustrated sitter shown before a selfie is added, so clients can see what Try On does
function drawExample(ctx,W,H){

  // hair top
  ctx.fillStyle=hairC;ctx.beginPath();ctx.moveTo(W*.36,H*.36);ctx.bezierCurveTo(W*.35,H*.2,W*.5,H*.18,W*.6,H*.22);ctx.bezierCurveTo(W*.66,H*.26,W*.665,H*.32,W*.645,H*.37);ctx.bezierCurveTo(W*.6,H*.28,W*.47,H*.25,W*.36,H*.36);ctx.fill();

function drawDrape(){
  const cv=$("#cv0");if(!cv)return;const ctx=cv.getContext("2d");const W=cv.width,H=cv.height;
  const L=T.slots[0],R=(T.mode===2||!T.cut)?T.slots[1]:T.slots[0];
  const paint=(shape)=>{ctx.save();ctx.beginPath();ctx.rect(0,0,W/2,H);ctx.clip();ctx.fillStyle=L;shape();ctx.restore();
    ctx.save();ctx.beginPath();ctx.rect(W/2,0,W/2,H);ctx.clip();ctx.fillStyle=R;shape();ctx.restore()};

}
// Horizontal centre of the head (top part of the cut-out), 0..1, so the split runs down the middle of the face
function faceCentre(cut){
  try{const k=120/cut.width,w=120,h=Math.max(1,Math.round(cut.height*k));const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(cut,0,0,w,h);
    const d=x.getImageData(0,0,w,h).data;let top=-1;for(let y=0;y<h&&top<0;y++)for(let i=0;i<w;i++)if(d[(y*w+i)*4+3]>128){top=y;break}
    if(top<0)return .5;let sum=0,n=0;const bottom=Math.min(h,top+Math.round(h*.3));
    for(let y=top;y<bottom;y++)for(let i=0;i<w;i++)if(d[(y*w+i)*4+3]>128){sum+=i;n++}
    return n?sum/n/w:.5}catch(e){return .5}
}
let segP=null;
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("load"));document.head.appendChild(s)})}
function getSeg(){
  if(!segP)segP=(async()=>{await loadScript("mp/models.js");await loadScript("mp/selfie_segmentation.js");
    const blobs={};const toUrl=k=>{if(!blobs[k]){const b=atob(window.SZN_MODELS[k]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);blobs[k]=URL.createObjectURL(new Blob([u]))}return blobs[k]};
    const seg=new SelfieSegmentation({locateFile:f=>window.SZN_MODELS[f]?toUrl(f):f.endsWith(".data")?URL.createObjectURL(new Blob([])):"mp/"+f});seg.setOptions({modelSelection:0,selfieMode:false});await seg.initialize();return seg})();
  segP.catch(()=>{segP=null});return segP;
}
function setStatus(t){T.msg=t;const el=$("#tStatus");if(el)el.textContent=t}
async function loadSelfie(file){
  T.busy=true;T.cut=null;renderTryOn();setStatus("Removing your background. This takes a few seconds the first time.");
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:"from-image"}).catch(()=>createImageBitmap(file));
    const k=Math.min(1,1100/Math.max(bmp.width,bmp.height));
    const src=document.createElement("canvas");src.width=Math.round(bmp.width*k);src.height=Math.round(bmp.height*k);src.getContext("2d").drawImage(bmp,0,0,src.width,src.height);
    const seg=await getSeg();
    const mask=await new Promise((ok,no)=>{const t=setTimeout(()=>no(new Error("timeout")),30000);seg.onResults(r=>{clearTimeout(t);ok(r.segmentationMask)});seg.send({image:src}).catch(no)});
    const out=document.createElement("canvas");out.width=src.width;out.height=src.height;const o=out.getContext("2d");
    o.filter="blur(2px)";o.drawImage(mask,0,0,out.width,out.height);o.filter="none";
    o.globalCompositeOperation="source-in";o.drawImage(src,0,0);
    T.cut=out;T.cx=faceCentre(out);T.busy=false;store("tried",true);if(T.saved)savePhoto(true);T.msg="Tap colours below to compare them next to your face.";
  }catch(e){T.busy=false;T.cut=null;T.msg="We couldn't remove the background from that photo. Try a clear, well-lit photo with your face and shoulders in frame."}
  renderTryOn();
}

let camStream=null,camFam="all",camSize=44;
function camColours(){return camFam==="all"?SEASON.palette:SEASON.palette.filter(c=>familyOf(c)===camFam)}
function drawCamGrid(){const g=$("#camGrid");if(!g)return;g.style.setProperty("--d",camSize+"px");g.style.setProperty("--g",Math.round(camSize*.3)+"px");g.innerHTML=camColours().map(c=>`<span style="background:${c}"></span>`).join("")}
async function openCamera(){
  const cam=$("#cam");cam.hidden=false;document.body.style.overflow="hidden";
  const fams=[["all","All"],...SEASON.familyOrder.map(k=>[k,SEASON.families[k].short])];
  cam.innerHTML=`<video id="camVid" playsinline muted autoplay></video><img class="shot" id="camShot" alt="" hidden>
    <div class="cam-top"><button class="x" id="camX" aria-label="Close colour camera">×</button>${fams.map(([k,l])=>`<button data-f="${k}" aria-pressed="${camFam===k}">${l}</button>`).join("")}</div>
    <div class="cam-msg" id="camMsg"><div class="stack"><b>Starting your camera…</b></div></div>
    <div class="cam-grid" id="camGrid"></div>
    <div class="cam-bottom"><label for="camSz">Size</label><input type="range" id="camSz" min="28" max="84" value="${camSize}"></div>`;
  drawCamGrid();
  $("#camX").onclick=closeCamera;
  cam.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{camFam=b.dataset.f;cam.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b));drawCamGrid()});
  $("#camSz").oninput=e=>{camSize=+e.target.value;drawCamGrid()};
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("no");
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
    const v=$("#camVid");v.srcObject=camStream;await v.play().catch(()=>{});$("#camMsg").hidden=true;
  }catch(e){
    $("#camVid").hidden=true;
    $("#camMsg").innerHTML=`<div class="stack"><b>Your camera couldn't start</b><p class="small" style="color:#ddd">Check that camera access is allowed for this page, or take a photo of the clothes and your colours will sit on top.</p><label class="btn filebtn" style="background:#fff;color:#1C1712">Take a photo<input type="file" id="camFile" accept="image/*" capture="environment" aria-label="Take a photo"></label></div>`;
    $("#camFile").onchange=ev=>{const f=ev.target.files&&ev.target.files[0];if(!f)return;const im=$("#camShot");im.src=URL.createObjectURL(f);im.hidden=false;$("#camMsg").hidden=true};
  }
}
function closeCamera(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}const cam=$("#cam");cam.hidden=true;cam.innerHTML="";document.body.style.overflow=""}

    <div class="chipgrid">${g[k].map(c=>pchip(c)).join("")}</div>
    ${showAvoid&&fm.avoid.length?`<span class="eyebrow" style="margin-top:4px">Not in your palette</span><div class="chipgrid">${fm.avoid.map(c=>pchip(c,{avoid:1})).join("")}</div>`:""}</section>`}).join("")}
  ${palFilter==="all"||palFilter==="neutrals"?`<section class="card stack"><h3>Neutral swaps</h3><p class="small muted">Swap everyday neutrals for softer, cooler versions.</p>
    ${SEASON.swaps.map(s=>`<div class="swap"><span class="dot" style="background:${s[0]}"></span><span aria-hidden="true">→</span><span class="dot" style="background:${s[1]}"></span><span class="small"><b>${s[2]}</b> becomes ${s[3]}</span></div>`).join("")}</section>`:""}
  ${palFilter==="all"?`<section class="stack" style="gap:12px"><div class="fam-head"><h2>Neighbouring colours</h2><p>From your sister seasons. The softer, lighter ones closest to your palette can work on you too.</p></div>
    ${Object.entries(SEASON.neighbours).map(([n,cs])=>`<span class="eyebrow">${n}</span><div class="chipgrid">${cs.map(c=>pchip(c,{nb:n})).join("")}</div>`).join("")}</section>`:""}
  <p class="screen-note">Screens show colour slightly differently, so treat these swatches as a guide. Check new pieces in natural daylight, near a window if you can.</p>`;
  const v=$("#v-palette");
  const setAvoid=on=>{showAvoid=on;store("avoid",on);renderPalette();if(on)$("#avoidTop").scrollIntoView({behavior:"smooth",block:"start"})};
  $("#avoidToggle").onclick=()=>setAvoid(!showAvoid);const ao=$("#avoidOff");if(ao)ao.onclick=()=>setAvoid(false);
  v.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{palFilter=b.dataset.f;renderPalette()});
  v.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>openSheet(b.dataset.c,!!b.dataset.avoid,b.dataset.nb));
  $("#addMore").onclick=()=>{palFilter="all";renderPalette();const t=$("#fam-blues");if(t)t.scrollIntoView({behavior:"smooth",block:"start"})};
  const cb=$("#camBtn2");if(cb)cb.onclick=openCamera;
}
function nearest(c,list){let best=null,bd=1e9;list.forEach(x=>{if(x===c)return;const a=hsl(c),b=hsl(x);let dh=Math.abs(a.h-b.h);dh=Math.min(dh,360-dh);const d=dh/180+Math.abs(a.l-b.l)*1.5;if(d<bd){bd=d;best=x}});return best}
function hueShift(c,deg){const{h}=hsl(c);const t=(h+deg)%360;let best=null,bd=1e9;SEASON.palette.forEach(x=>{const y=hsl(x);if(y.s<.23)return;let d=Math.abs(y.h-t);d=Math.min(d,360-d)+Math.abs(y.l-hsl(c).l)*60;if(d<bd){bd=d;best=x}});return best}
function openSheet(c,avoid,nb){
  const host=$("#sheetHost"),fam=familyOf(c),fav=isFav(c);
  const hc=hsl(c).h,hd=x=>{const d=Math.abs(hsl(x).h-hc);return Math.min(d,360-d)};const sameFam=SEASON.palette.filter(x=>fam==="neutrals"?familyOf(x)==="neutrals":familyOf(x)!=="neutrals"&&hd(x)<14).sort((a,b)=>hsl(b).l-hsl(a).l);
  let ramp=[];if(!avoid&&!nb){const i=sameFam.indexOf(c);const st=Math.max(0,Math.min(sameFam.length-5,i-2));ramp=sameFam.slice(st,st+5)}
  const pairs=avoid?[]:[[c,hueShift(c,180)||SEASON.pairNeutral,"Contrast"],[c,hueShift(c,35)||SEASON.pairNeutral,"Neighbour"],[c,fam==="neutrals"?SEASON.pairAccent:SEASON.pairNeutral,"With a neutral"]];
  const label=nb?nb:avoid?"Not in your palette":SEASON.families[fam].name;
  host.innerHTML=`<div class="sheet-bg" id="sheetBg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${nm(c)}">
    <span class="grab" aria-hidden="true"></span>
    <div class="top-row"><span class="big" style="background:${c}"></span><div class="stack" style="gap:4px"><span class="eyebrow">${label}</span><h2>${nm(c)}</h2><span class="small muted">${c.toUpperCase()}</span></div><button class="x" id="sheetX" aria-label="Close">×</button></div>
    ${avoid?`<p class="note">This one is ${whyNot(c)}. If you love it, wear it away from your face or in a print that's mostly your colours.</p>`:""}
    <div class="acts">${avoid?"":`<button class="btn ghost heart-btn" id="sheetFav" aria-pressed="${fav}">${HEART}<span>${fav?"Saved":"Save"}</span></button>`}<button class="btn" id="sheetTry"${avoid?' style="grid-column:1/-1"':""}>Try on my face</button></div>
    ${pairs.length?`<div class="stack" style="gap:10px"><span class="eyebrow">Wear it with</span><div class="pairs">${pairs.map(([a,b,l])=>`<div><span class="duo"><span style="background:${a}"></span><span style="background:${b}"></span></span>${l}: ${nm(b)}</div>`).join("")}</div></div>`:""}
    ${ramp.length>1?`<div class="stack" style="gap:10px"><span class="eyebrow">Lighter and deeper</span><div class="ramp">${ramp.map(x=>`<button style="background:${x}" data-c="${x}" aria-label="${nm(x)}" aria-current="${x===c}"></button>`).join("")}</div></div>`:""}
    <a class="small" href="https://www.yourszn.com.au/pages/mobile-app" target="_blank" rel="noopener">Shop ${nm(c).toLowerCase()} pieces in the YourSZN app →</a>
  </div></div>`;
  document.body.style.overflow="hidden";
  const close=()=>{host.innerHTML="";document.body.style.overflow="";document.removeEventListener("keydown",key)};
  const key=e=>{if(e.key==="Escape")close()};document.addEventListener("keydown",key);
  $("#sheetBg").onclick=e=>{if(e.target.id==="sheetBg")close()};$("#sheetX").onclick=close;
  const fb=$("#sheetFav");if(fb)fb.onclick=()=>{toggleFav(c);const on=isFav(c);fb.setAttribute("aria-pressed",on);fb.querySelector("span").textContent=on?"Saved":"Save";refreshBehind()};
  $("#sheetTry").onclick=()=>{close();T.mode=1;T.active=0;T.slots[0]=c;go("tryon",true)};
  host.querySelectorAll(".ramp button").forEach(b=>b.onclick=()=>openSheet(b.dataset.c));
  $("#sheetX").focus();
}
function refreshBehind(){const y=window.scrollY;if(!$("#v-palette").hidden)renderPalette();else if(!$("#v-home").hidden)renderHome();window.scrollTo(0,y)}

/* ================= LEARN ================= */
let learnSub=store("sub")||"guide";
const SUBR={guide:renderGuide,combos:renderCombos,practise:renderPractise};
function renderLearn(){
  document.querySelectorAll("#v-learn .seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.sub===learnSub));
  ["guide","combos","practise"].forEach(k=>$("#v-"+k).hidden=k!==learnSub);
  SUBR[learnSub]();
}
document.querySelectorAll("#v-learn .seg button").forEach(b=>b.onclick=()=>{learnSub=b.dataset.sub;store("sub",learnSub);if(learnSub==="guide")guideIdx=-1;renderLearn()});

/* ================= WARDROBE ================= */
function renderWardrobe(){
  renderCloset();
  $("#v-shop").innerHTML=`<div class="card stack" style="gap:14px"><span class="eyebrow">Shop your season</span><h2>Fill the gaps in your wardrobe</h2>
    <p class="muted">Shop over 7,000 items for your season and 400+ styled looks in the YourSZN app.</p>
    <div class="wshop">${SEASON.images.shop.map(n=>`<img src="img/${n}.webp" alt="${SEASON.name} inspiration" loading="lazy">`).join("")}</div>
    <a class="btn blue" href="https://www.yourszn.com.au/pages/mobile-app" target="_blank" rel="noopener" style="justify-self:start">Open the app →</a></div>`;
}

/* ================= routing ================= */
const TABS=[
 ["home","Home",'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>'],
 ["palette","Palette",'<circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 0 0 0 20c.9 0 1.6-.7 1.6-1.6 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.6 1.6-1.6H16a6 6 0 0 0 6-6c0-4.9-4.5-8.6-10-8.6z"/>'],
 ["tryon","Try On",'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>'],
 ["learn","Learn",'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>'],
 ["wardrobe","Wardrobe",'<path d="M12 6a2 2 0 1 1 2-2"/><path d="M12 6v2L3 15.5A1.3 1.3 0 0 0 3.8 18h16.4a1.3 1.3 0 0 0 .8-2.5L12 8"/>']
];
const RENDER={home:renderHome,palette:renderPalette,tryon:renderTryOn,learn:renderLearn,wardrobe:renderWardrobe};
const ALIAS={season:["home"],guide:["learn","guide"],combos:["learn","combos"],practise:["learn","practise"],closet:["wardrobe"]};
const icon=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
$("#sidenav").innerHTML=TABS.map(([k,l,ic])=>`<button class="navi" data-k="${k}">${icon(ic)}<span>${l}</span></button>`).join("");
$("#tabbar").innerHTML=TABS.map(([k,l,ic])=>`<button class="tab" data-k="${k}"><span class="ic">${icon(ic)}</span><span>${l}</span></button>`).join("");
function go(k,scroll){
  if(ALIAS[k]){const [t,sub]=ALIAS[k];if(sub){learnSub=sub;store("sub",sub);if(sub==="guide"&&k==="guide")guideIdx=-1}k=t}
  if(!RENDER[k])k="home";
  TABS.forEach(([t])=>{$("#v-"+t).hidden=t!==k});
  document.querySelectorAll(".navi,.tab").forEach(b=>b.dataset.k===k?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  RENDER[k]();store("tab",k);
  if(scroll)window.scrollTo({top:0,behavior:"instant"in window?"instant":"auto"})}
document.querySelectorAll(".navi,.tab").forEach(b=>b.onclick=()=>{if(b.dataset.k==="learn"&&learnSub==="guide")guideIdx=-1;go(b.dataset.k,true)});
$("#avatarBtn").onclick=()=>go("home",true);
document.addEventListener("click",e=>{const pg=e.target.closest(".pg");if(pg){openViewer(pg.dataset.pages.split(",").map(Number),+pg.dataset.i);return}});
function openViewer(pages,i){const rv=$("#rv");rv.hidden=false;document.body.style.overflow="hidden";
  rv.innerHTML=`<div class="rv-top"><span class="rv-count" id="rvCount"></span><button class="rv-close" id="rvX" aria-label="Close">×</button></div><div class="rv-track" id="rvTrack">${pages.map(n=>`<div class="rv-slide"><img src="${pgSrc(n)}" alt="${SEASON.name} guide page"></div>`).join("")}</div><button class="rv-arrow l" aria-label="Previous page">‹</button><button class="rv-arrow r" aria-label="Next page">›</button>`;
  const tr=$("#rvTrack"),cnt=()=>{$("#rvCount").textContent=`PAGE ${Math.round(tr.scrollLeft/tr.clientWidth)+1} OF ${pages.length}`};
  requestAnimationFrame(()=>{tr.scrollLeft=i*tr.clientWidth;cnt()});tr.onscroll=cnt;
  const close=()=>{rv.hidden=true;rv.innerHTML="";document.body.style.overflow="";document.removeEventListener("keydown",key)};
  const key=e=>{if(e.key==="Escape")close();if(e.key==="ArrowRight")tr.scrollBy({left:tr.clientWidth,behavior:"smooth"});if(e.key==="ArrowLeft")tr.scrollBy({left:-tr.clientWidth,behavior:"smooth"})};
  document.addEventListener("keydown",key);$("#rvX").onclick=close;$("#rvX").focus();
  rv.querySelector(".rv-arrow.l").onclick=()=>tr.scrollBy({left:-tr.clientWidth,behavior:"smooth"});rv.querySelector(".rv-arrow.r").onclick=()=>tr.scrollBy({left:tr.clientWidth,behavior:"smooth"})}
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b&&!e.defaultPrevented){e.preventDefault();go(b.dataset.go,true)}});
$("#sideName").textContent=CLIENT.first;$("#avatarBtn").textContent=CLIENT.first[0];
showAvoid=!!store("avoid");
const start=(location.hash||"").slice(1);
go(RENDER[start]||ALIAS[start]?start:(store("tab")||"home"));

</script>
