<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Your SZN · Client Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Client portal: sign in (name + email + emailed code), then a home page showing only
  what applies to this client. All data comes from /api/client-home for the signed-in
  email; see README.md ("How clients sign in").
-->
<style>
  :root {
    --cream: #F7F3EE; --ground: #EEE6DB; --card: #FFFFFF; --line: #D9CCBC; --soft: #F6F1EA;
    --ink: #1C1712; --muted: #5E5248; --eyebrow: #8A5A4A;
    --brown: #7A5C48; --brown-deep: #5F4636;
    --good: #3F6B4E; --good-bg: #E2EFE6; --bad: #A6404F; --bad-bg: #F8E6EA;
    --icon-winter: #9E9E9E; --icon-spring: #A8C8E8; --icon-summer: #C8A8D8; --icon-autumn: #D4B896;
    --display: 'Playfair Display', Georgia, serif;
    --body: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { background: var(--ground); }
  body { font-family: var(--body); color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  a { color: var(--brown-deep); }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brown-deep); outline-offset: 2px; border-radius: 8px; }

  .wrap { max-width: 520px; margin: 0 auto; padding: 28px max(18px, env(safe-area-inset-right)) 40px max(18px, env(safe-area-inset-left)); display: grid; gap: 16px; }
  .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--eyebrow); }
  .muted { color: var(--muted); }
  h1, h2 { font-family: var(--display); font-weight: 400; line-height: 1.12; }
  h1 { font-size: 32px; }
  h2 { font-size: 22px; }
  p { font-size: 14px; line-height: 1.6; }

  /* Sign-in */
  .hero { text-align: center; display: grid; gap: 18px; justify-items: center; padding: 20px 0 6px; }
  .hero img.logo { height: 72px; width: auto; opacity: .88; }
  .icons { display: flex; gap: 12px; }
  .icons span { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
  .icons img { width: 22px; height: 22px; object-fit: contain; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 20px; display: grid; gap: 12px; box-shadow: 0 8px 20px rgba(28,23,18,.06); }
  .field { display: grid; gap: 6px; }
  .field label { font-size: 12.5px; font-weight: 600; }
  .field input { height: 48px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px; background: #FFFFFF; color: var(--ink); }
  .field input:focus { border-color: var(--ink); outline: none; }
  .hint { font-size: 12px; color: var(--muted); }
  .msg { font-size: 13px; line-height: 1.45; color: var(--bad); }
  .msg.ok { color: var(--muted); }
  .btn { display: flex; align-items: center; justify-content: center; min-height: 48px; border: 0; border-radius: 999px; padding: 0 22px; font-size: 14px; font-weight: 700; text-decoration: none; background: var(--ink); color: #FFFFFF; }
  .btn.brown { background: var(--brown); }
  .btn.ghost { background: #FFFFFF; border: 1px solid var(--line); color: var(--ink); font-weight: 600; }
  .btn[disabled] { opacity: .55; cursor: default; }
  .links { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .linkbtn { background: none; border: 0; padding: 4px 0; font-size: 13px; font-weight: 600; color: var(--brown-deep); text-decoration: underline; text-underline-offset: 3px; }

  /* Home */
  .top { display: flex; justify-content: space-between; align-items: center; }
  .top img { height: 34px; width: auto; opacity: .88; }
  .chip { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
  .chip.good { background: var(--good-bg); color: var(--good); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .steps span { height: 5px; border-radius: 3px; background: #E8DDD3; }
  .steps span.on { background: var(--brown); }
  .steplabels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; font-size: 11px; font-weight: 600; color: var(--muted); }
  .steplabels .now { color: var(--ink); }
  .locked { border: 1.5px dashed #C9B9A6; border-radius: 22px; padding: 18px; display: flex; gap: 14px; align-items: center; }
  .locked .ic { flex: 0 0 44px; height: 44px; border-radius: 50%; background: #E6DCCF; display: grid; place-items: center; }
  .footer { text-align: center; font-size: 12px; color: var(--muted); display: grid; gap: 8px; padding-top: 8px; }

  /* Revised photos */
  .drop { border: 2px dashed var(--line); border-radius: 14px; padding: 22px; text-align: center; background: var(--soft); font-size: 13px; color: var(--muted); }
  .drop.over { border-color: var(--brown); background: #FFFFFF; }

  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: #FFFFFF; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
/* ══════════════════════════════════════════════════════════════
   Client portal — clients.yourszn.com.au
   1. Sign in: name + email → 6-digit code (/api/client-auth).
   2. Home: /api/client-home returns this client's analysis status, tour booking
      and colour dashboard. Opening the tour or dashboard asks the server for that
      dashboard's own session, so the client doesn't sign in twice.
   3. Sign out removes every YourSZN session from this device.
   Everything shown about the client comes from the server for the signed-in
   email; the page never decides what someone can see.
   ══════════════════════════════════════════════════════════════ */

var ASSETS = 'https://ntqemlkwsymdxhaonfdv.supabase.co/storage/v1/object/public/szn-assets/';
var SUPABASE_URL = 'https://ntqemlkwsymdxhaonfdv.supabase.co';
/* Public (anon) key: only allows uploading into the revised-photos bucket. */
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50cWVtbGt3c3ltZHhoYW9uZmR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMzM4MDUsImV4cCI6MjA4ODYwOTgwNX0.6F34kwmrXpiLKnd2d_oyQubn5QpodO2iHR6O47W9gA4';
var PHOTO_BUCKET = 'online-clients-photos';
var WEBSITE = 'https://www.yourszn.com.au';
var TOUR_INTEREST_FORM = 'https://links.ivorey.io/widget/form/9Iyx9X6ofTxjcQVTdyDl';  /* Vietnam Tailoring Tour expression of interest */
var MAX_PHOTO_MB = 15;

/* Session keys on this device. The tour and colour dashboard read their own keys. */
var KEYS = { portal: 'szn_portal_session', tour: 'vt_session', colour: 'szn_colour_token' };

var signInName = '', signInEmail = '', home = null;
var app = document.getElementById('app');

/* ── helpers ── */
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function readSession(key) {
  try { var s = JSON.parse(localStorage.getItem(key) || 'null'); return s && s.token && s.expires > Date.now() ? s : null; }
  catch (e) { return null; }
}
function saveSession(key, data) {
  try { localStorage.setItem(key, JSON.stringify({ token: data.token, expires: data.expires })); } catch (e) {}
}
function signOut() {
  try { Object.keys(KEYS).forEach(function(k) { localStorage.removeItem(KEYS[k]); }); sessionStorage.clear(); } catch (e) {}
  home = null;
  showEmailStep();
}
function api(path, body, auth) {
  var headers = { 'Content-Type': 'application/json' };
  if (auth) { var s = readSession(KEYS.portal); headers.Authorization = 'Bearer ' + (s ? s.token : ''); }
  return fetch('/api/' + path, { method: 'POST', headers: headers, body: JSON.stringify(body) })
    .then(function(r) { return r.json().catch(function() { return {}; }).then(function(d) { d._status = r.status; return d; }); });
}
function setMsg(id, text, ok) {
  var el = document.getElementById(id);
  if (!el) return;
  el.textContent = text || '';
  el.className = 'msg' + (ok ? ' ok' : '');
  el.hidden = !text;
}
function busy(btn, on, label) {
  if (!btn) return;
  btn.disabled = on;
  btn.innerHTML = on ? '<span class="spinner" aria-hidden="true"></span><span class="sr-only" style="position:absolute;left:-9999px">Working…</span>' : esc(label);
}
var LOCK_ICON = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5248" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

/* ── 1. Sign in ── */
function heroHTML() {
  return '<div class="hero">'
    + '<img class="logo" src="' + ASSETS + 'YourSZN-Charcoal-Stacked%402x.png" alt="Your SZN">'
    + '<div class="icons" aria-hidden="true">'
    + '<span style="background:var(--icon-winter)"><img src="' + ASSETS + 'Icon-Winter-Clouds-Charcoal%20copy.png" alt=""></span>'
    + '<span style="background:var(--icon-spring)"><img src="' + ASSETS + 'Icon-Spring-Leaf-Charcoal%20copy.png" alt=""></span>'
    + '<span style="background:var(--icon-summer)"><img src="' + ASSETS + 'Icon-Summer-Sun-Charcoal%20copy.png" alt=""></span>'
    + '<span style="background:var(--icon-autumn)"><img src="' + ASSETS + 'Icon-Autumn-Sunrise-Charcoal%20copy.png" alt=""></span>'
    + '</div></div>';
}

function showEmailStep(message) {
  app.innerHTML = heroHTML()
    + '<div style="display:grid;gap:8px"><span class="eyebrow">Client portal</span><h1>Welcome to YourSZN</h1>'
    + '<p class="muted">Sign in to start your colour analysis, see your results or open your tour.</p></div>'
    + '<form class="card" id="f-email" novalidate>'
    + '<div class="field"><label for="in-name">Full name</label><input id="in-name" autocomplete="name" maxlength="120" value="' + esc(signInName) + '" required></div>'
    + '<div class="field"><label for="in-email">Email</label><input id="in-email" type="email" autocomplete="email" maxlength="200" value="' + esc(signInEmail) + '" required>'
    + '<span class="hint">Use the email you booked with.</span></div>'
    + '<p class="msg" id="m-email" role="alert" hidden></p>'
    + '<button class="btn" id="b-email" type="submit">Email me a code</button>'
    + '</form>'
    + '<p class="hint" style="text-align:center">You’ll get a 6-digit code by email. No password needed.</p>';
  if (message) setMsg('m-email', message);
  document.getElementById('f-email').onsubmit = function(e) { e.preventDefault(); sendCode(false); };
  document.getElementById(signInName ? 'in-email' : 'in-name').focus();
}

function sendCode(resend) {
  if (!resend) {
    signInName = document.getElementById('in-name').value.trim();
    signInEmail = document.getElementById('in-email').value.trim().toLowerCase();
    if (!signInName) { setMsg('m-email', 'Please enter your full name.'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(signInEmail)) { setMsg('m-email', 'Please enter a valid email address.'); return; }
  }
  var btn = document.getElementById(resend ? 'b-code' : 'b-email');
  busy(btn, true);
  api('client-auth', { action: 'send', email: signInEmail, name: signInName }).then(function(d) {
    if (d.ok) { showCodeStep(resend ? 'A new code is on its way.' : '', true); return; }
    busy(btn, false, resend ? 'Sign in' : 'Email me a code');
    setMsg(resend ? 'm-code' : 'm-email', d.error || 'Something went wrong. Please try again.');
  }).catch(function() {
    busy(btn, false, resend ? 'Sign in' : 'Email me a code');
    setMsg(resend ? 'm-code' : 'm-email', 'Something went wrong. Please try again.');
  });
}

function showCodeStep(message, quiet) {
  app.innerHTML = heroHTML()
    + '<div style="display:grid;gap:8px"><span class="eyebrow">Check your email</span><h1>Enter your code</h1>'
    + '<p class="muted">We sent a 6-digit code to <b style="color:var(--ink)">' + esc(signInEmail) + '</b>. It works for 10 minutes.</p></div>'
    + '<form class="card" id="f-code" novalidate>'
    + '<div class="field"><label for="in-code">6-digit code</label><input id="in-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div>'
    + '<p class="msg" id="m-code" role="alert" hidden></p>'
    + '<button class="btn" id="b-code" type="submit">Sign in</button>'
    + '<div class="links"><button type="button" class="linkbtn" id="l-resend">Send a new code</button><button type="button" class="linkbtn" id="l-back">Use another email</button></div>'
    + '</form>'
    + '<p class="hint" style="text-align:center">Can’t find it? Check your junk or spam folder.</p>';
  if (message) setMsg('m-code', message, quiet);
  document.getElementById('f-code').onsubmit = function(e) { e.preventDefault(); verifyCode(); };
  document.getElementById('l-resend').onclick = function() { sendCode(true); };
  document.getElementById('l-back').onclick = function() { showEmailStep(); };
  document.getElementById('in-code').focus();
}

function verifyCode() {
  var code = document.getElementById('in-code').value.replace(/\D/g, '');
  if (code.length !== 6) { setMsg('m-code', 'Please enter the 6-digit code from your email.'); return; }
  var btn = document.getElementById('b-code');
  busy(btn, true);
  api('client-auth', { action: 'verify', email: signInEmail, code: code, name: signInName }).then(function(d) {
    if (!d.ok) { busy(btn, false, 'Sign in'); setMsg('m-code', d.error || 'Something went wrong. Please try again.'); return; }
    saveSession(KEYS.portal, d);
    loadHome();
  }).catch(function() { busy(btn, false, 'Sign in'); setMsg('m-code', 'Something went wrong. Please try again.'); });
}

/* ── 2. Home ── */
function loadHome() {
  app.innerHTML = '<p class="muted" style="text-align:center;padding:60px 0">Loading…</p>';
  api('client-home', { action: 'get' }, true).then(function(d) {
    if (d._status === 401) { signOut(); return; }
    if (!d.ok) { app.innerHTML = '<div class="card"><p>Something went wrong loading your portal.</p><button class="btn" onclick="loadHome()">Try again</button></div>'; return; }
    home = d;
    renderHome();
  }).catch(function() {
    app.innerHTML = '<div class="card"><p>Something went wrong loading your portal.</p><button class="btn" onclick="loadHome()">Try again</button></div>';
  });
}

function headline() {
  var a = home.analysis.state;
  if (home.dashboard.open) return 'Your results are ready';
  if (a === 'none') return 'What would you like to do?';
  if (a === 'sent') return 'Your results are on their way';
  return 'Your analysis is in review';
}

function analysisCard() {
  var a = home.analysis;
  if (a.state === 'none') {
    return '<section class="card" aria-labelledby="h-oca">'
      + '<span class="eyebrow">Online Colour Analysis</span>'
      + '<h2 id="h-oca">Find your season</h2>'
      + '<p class="muted">Answer a short questionnaire and upload your photos, and Latisha will find your colours.</p>'
      + '<button class="btn brown" id="b-start">Start your questionnaire</button>'
      + '<a class="hint" href="' + WEBSITE + '" target="_blank" rel="noopener">Not booked yet? See the Online Colour Analysis →</a>'
      + '</section>';
  }
  var step = a.state === 'submitted' ? 1 : a.state === 'review' ? 2 : 3;
  var date = a.submittedAt ? new Date(a.submittedAt).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }) : '';
  var text = a.state === 'sent' ? 'Your results have been sent. Check your email.'
    : a.state === 'review' ? 'Latisha is working on your colours. We’ll email you as soon as your results are ready.'
    : 'We’ve received your questionnaire' + (date ? ' (' + date + ')' : '') + '. Latisha will start on it soon.';
  var bars = [1, 2, 3].map(function(n) { return '<span class="' + (n <= step ? 'on' : '') + '"></span>'; }).join('');
  var labels = ['Submitted', 'In review', 'Results'].map(function(l, i) { return '<span class="' + (i + 1 === step ? 'now' : '') + '">' + l + '</span>'; }).join('');
  return '<section class="card" aria-labelledby="h-oca">'
    + '<div class="row"><span class="eyebrow" id="h-oca">Online Colour Analysis</span>' + (a.state === 'sent' ? '<span class="chip good">Done</span>' : '') + '</div>'
    + '<div class="steps" aria-hidden="true">' + bars + '</div><div class="steplabels">' + labels + '</div>'
    + '<p class="muted">' + text + '</p>'
    + (a.revisedAt ? '<p class="hint">Revised photos received ' + new Date(a.revisedAt).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }) + '.</p>' : '')
    + (a.state !== 'sent' ? '<button class="btn ghost" id="b-revised" aria-expanded="false">Upload revised photos</button><div id="revised" hidden></div>' : '')
    + '</section>';
}

function tourCard() {
  if (home.tour.booked) {
    return '<section class="card" aria-labelledby="h-tour">'
      + '<div class="row"><span class="eyebrow" id="h-tour">Vietnam Tailoring Tour</span><span class="chip good">Booked</span></div>'
      + '<p class="muted">Your itinerary, packing list, budget and wardrobe plan.</p>'
      + '<p class="msg" id="m-tour" role="alert" hidden></p>'
      + '<button class="btn ghost" id="b-tour">Open your tour →</button>'
      + '</section>';
  }
  return '<section class="card" aria-labelledby="h-tour">'
    + '<span class="eyebrow" id="h-tour">Vietnam Tailoring Tour</span>'
    + '<p class="muted">Have your wardrobe made in your colours in Hoi An.</p>'
    + '<a href="' + TOUR_INTEREST_FORM + '" target="_blank" rel="noopener" style="font-size:13.5px;font-weight:700">Register your interest →</a>'
    + '</section>';
}

function dashboardCard() {
  if (home.dashboard.open) {
    return '<section class="card" aria-labelledby="h-dash" style="border-color:var(--brown)">'
      + '<span class="eyebrow">Your season</span>'
      + '<h2 id="h-dash">' + esc(home.dashboard.season || 'Your Colour Dashboard') + '</h2>'
      + '<p class="muted">Your palette, guide, makeup, try-on and Latisha’s picks.</p>'
      + '<p class="msg" id="m-dash" role="alert" hidden></p>'
      + '<button class="btn brown" id="b-dash">Open your Colour Dashboard →</button>'
      + '</section>';
  }
  var waiting = home.analysis.state !== 'none';
  return '<section class="locked" aria-labelledby="h-dash"><div class="ic">' + LOCK_ICON + '</div>'
    + '<div style="display:grid;gap:2px"><b id="h-dash" style="font-size:14px">Colour Dashboard</b>'
    + '<span class="hint">' + (waiting ? 'Your results are being prepared.' : 'Unlocks once your results are ready.') + '</span></div></section>';
}

function renderHome() {
  var first = String(home.name || '').split(' ')[0];
  app.innerHTML = '<div class="top"><img src="' + ASSETS + 'YourSZN-Charcoal-Stacked%402x.png" alt="Your SZN"></div>'
    + '<div style="display:grid;gap:4px"><span class="muted" style="font-size:13px">' + (first ? 'Hi ' + esc(first) : 'Hi there') + '</span><h1>' + esc(headline()) + '</h1></div>'
    + (home.dashboard.open ? dashboardCard() + analysisCard() : analysisCard() + dashboardCard())
    + tourCard()
    + '<div class="footer"><span>Questions? <span style="user-select:all">hello@yourszn.com.au</span></span>'
    + '<span>Signed in as ' + esc(home.email) + ' · <button type="button" class="linkbtn" id="b-signout">Sign out</button></span></div>';

  var start = document.getElementById('b-start');
  if (start) start.onclick = function() {
    /* Prefill the questionnaire without putting personal details in the URL. */
    try { sessionStorage.setItem('szn_prefill', JSON.stringify({ name: home.name || signInName, email: home.email })); } catch (e) {}
    window.location.href = 'yourszn-form-7.html';
  };
  var rev = document.getElementById('b-revised');
  if (rev) rev.onclick = toggleRevised;
  var tour = document.getElementById('b-tour');
  if (tour) tour.onclick = function() { openDashboard('tour', 'vietnam-tour.html', tour, 'm-tour', 'Open your tour →'); };
  var dash = document.getElementById('b-dash');
  if (dash) dash.onclick = function() { openDashboard('colour', 'colour-dashboard.html', dash, 'm-dash', 'Open your Colour Dashboard →'); };
  document.getElementById('b-signout').onclick = signOut;
}

/* Ask the server for that dashboard's own session (only given if this email is on
   its client list), store it where that page looks for it, then go there. */
function openDashboard(target, page, btn, msgId, label) {
  busy(btn, true);
  api('client-home', { action: 'open', target: target }, true).then(function(d) {
    if (d._status === 401) { signOut(); return; }
    if (!d.ok) { busy(btn, false, label); setMsg(msgId, d.error || 'Something went wrong. Please try again.'); return; }
    saveSession(KEYS[target], d);
    window.location.href = page;
  }).catch(function() { busy(btn, false, label); setMsg(msgId, 'Something went wrong. Please try again.'); });
}

/* ── Revised photos ── */
function toggleRevised() {
  var box = document.getElementById('revised');
  var btn = document.getElementById('b-revised');
  var open = box.hidden;
  box.hidden = !open;
  btn.setAttribute('aria-expanded', String(open));
  if (!open || box.innerHTML) return;
  box.innerHTML = '<div class="drop" id="drop">'
    + '<p style="font-size:13px">Drop photos here, or</p>'
    + '<label class="btn ghost" for="in-photos" style="margin:10px auto 0;max-width:220px">Choose photos</label>'
    + '<input id="in-photos" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif" multiple style="position:absolute;left:-9999px">'
    + '<p class="hint" style="margin-top:10px">JPG, PNG or iPhone photos, up to ' + MAX_PHOTO_MB + ' MB each.</p></div>'
    + '<p class="msg" id="m-photos" role="status" hidden></p>';
  var drop = document.getElementById('drop');
  document.getElementById('in-photos').onchange = function() { uploadPhotos(this.files); this.value = ''; };
  drop.addEventListener('dragover', function(e) { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', function() { drop.classList.remove('over'); });
  drop.addEventListener('drop', function(e) { e.preventDefault(); drop.classList.remove('over'); uploadPhotos(e.dataTransfer.files); });
}

function toJpegIfHeic(file) {
  var heic = /\.(heic|heif)$/i.test(file.name) || /image\/hei[cf]/.test(file.type);
  if (!heic || typeof heic2any !== 'function') return Promise.resolve(file);
  return heic2any({ blob: file, toType: 'image/jpeg', quality: 0.92 }).then(function(b) {
    if (Array.isArray(b)) b = b[0];
    return new File([b], file.name.replace(/\.(heic|heif)$/i, '.jpg'), { type: 'image/jpeg' });
  });
}

function uploadPhotos(fileList) {
  var files = Array.prototype.slice.call(fileList || []).slice(0, 20);
  if (!files.length) return;
  var tooBig = files.filter(function(f) { return f.size > MAX_PHOTO_MB * 1024 * 1024; });
  if (tooBig.length) { setMsg('m-photos', tooBig[0].name + ' is over ' + MAX_PHOTO_MB + ' MB. Please choose a smaller photo.'); return; }
  setMsg('m-photos', 'Uploading ' + files.length + ' photo' + (files.length > 1 ? 's' : '') + '…', true);
  var subId = home.analysis.submissionId, ts = Date.now();

  Promise.all(files.map(function(file, i) {
    return toJpegIfHeic(file).then(function(f) {
      if (['image/jpeg', 'image/png', 'image/webp'].indexOf(f.type) === -1) throw new Error('type');
      var path = subId + '/revised_' + ts + '_' + i + '_' + f.name.replace(/[^a-zA-Z0-9._-]/g, '_').slice(-80);
      return fetch(SUPABASE_URL + '/storage/v1/object/' + PHOTO_BUCKET + '/' + path, {
        method: 'POST',
        headers: { 'Content-Type': f.type, apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY },
        body: f
      }).then(function(r) { if (!r.ok) throw new Error('upload'); return { path: path, name: f.name, type: f.type }; });
    });
  })).then(function(photos) {
    return api('client-submission', { action: 'revised', photos: photos }, true).then(function(d) { if (!d.ok) throw new Error(d.error || 'save'); });
  }).then(function() {
    document.getElementById('drop').hidden = true;
    setMsg('m-photos', 'Thank you, your photos are in. Latisha will take a look.', true);
  }).catch(function(e) {
    setMsg('m-photos', e && e.message === 'type' ? 'Please upload JPG, PNG or iPhone photos only.' : 'The upload didn’t work. Please try again.');
  });
}

/* ── Start ── */
if (readSession(KEYS.portal)) loadHome(); else showEmailStep();
</script>
