<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your SZN — Vietnam Tailoring Tour</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* contrast pass: deeper ground so white cards separate; secondary text >= 6:1 */
    --cream: #EFE8DF; --warm: #E7DED3; --sand: #D3C6B6;
    --tan: #8C7550; --charcoal: #1C1712; --deep: #1C1712;
    --green: #5F7253; --rose: #9A6250; --gold: #8C6E38;
    --muted: #5E5248;
    /* mapped from the ported Inspiration Board component styles */
    --bg-card: #FFFFFF; --border: var(--sand); --border-light: var(--warm);
    --text-mid: #44392F; --text-light: var(--muted);
    --accent: var(--charcoal); --accent-hover: #000000; --accent-soft: var(--tan);
    --tag-bg: var(--warm); --danger: #C4685A; --danger-bg: #FDF0EE; --success: var(--green);
    --radius: 14px; --radius-sm: 8px;
    --shadow: 0 2px 10px rgba(28,23,18,.07); --shadow-md: 0 10px 26px rgba(28,23,18,.1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--cream); color: var(--charcoal);
    min-height: 100vh;
  }
  /* ── Sidebar (matches the internal staff dashboard's sidebar exactly) ── */
  .sidebar {
    position: fixed; left: 0; top: 0; width: 220px; height: 100vh;
    background: #F9F5F0; border-right: 1px solid var(--sand);
    display: flex; flex-direction: column; padding: 32px 0;
    z-index: 100; transition: width .22s cubic-bezier(.4,0,.2,1); overflow: hidden;
  }
  #sb-toggle-btn {
    position: absolute; top: 16px; right: -12px; width: 24px; height: 24px;
    border-radius: 50%; background: #F9F5F0; border: 1px solid var(--sand);
    color: var(--muted); font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 101; line-height: 1; box-shadow: 0 1px 4px rgba(28,23,18,.1);
  }
  .slogo {
    font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300;
    color: var(--charcoal); letter-spacing: 3px; text-transform: uppercase;
    padding: 0 28px 24px; border-bottom: 1px solid var(--sand); white-space: nowrap;
  }
  .slogo span { font-style: italic; opacity: .6; }
  .suser { padding: 14px 28px; border-bottom: 1px solid var(--sand); margin-bottom: 8px; white-space: nowrap; }
  .sulab { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .suname { font-size: 13px; color: var(--charcoal); margin-top: 3px; font-weight: 500; }
  .snav { flex: 1; padding: 8px 0; display: flex; flex-direction: column; gap: 2px; }
  .nitem {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 16px; margin: 1px 12px; border-radius: 8px;
    font-family: 'Montserrat', sans-serif; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); cursor: pointer; transition: all .2s; white-space: nowrap;
  }
  .nitem svg { width: 14px; height: 14px; flex-shrink: 0; stroke: currentColor; }
  .nitem:hover { background: var(--sand); color: var(--charcoal); }
  .nitem.on { background: var(--charcoal); color: #F9F5F0; }
  .sout {
    display: block; margin: 8px 20px 0; padding: 10px; border-radius: 8px;
    border: 1px solid var(--sand); color: var(--muted); background: none;
    font-family: 'Montserrat', sans-serif; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    text-align: center; text-decoration: none; cursor: pointer; transition: all .2s; white-space: nowrap;
  }
  .sout:hover { background: var(--sand); color: var(--charcoal); }

  body.sb-collapsed .sidebar { width: 56px; }
  body.sb-collapsed .slogo,
  body.sb-collapsed .suser,
  body.sb-collapsed .nitem span,
  body.sb-collapsed .sout { display: none; }
  body.sb-collapsed .nitem { justify-content: center; margin: 1px 8px; padding: 11px 0; }
  body.sb-collapsed .main { margin-left: 56px; }

  /* ── Main content ── */
  .main { margin-left: 220px; min-height: 100vh; padding: 32px 44px 40px; transition: margin-left .22s cubic-bezier(.4,0,.2,1); }
  .ph { margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid var(--sand); }
  .ptitle { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 400; color: var(--charcoal); }
  .psub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .countdown-banner {
    background: var(--charcoal); border-radius: 14px;
    padding: 22px 28px; margin-bottom: 22px;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  .countdown-num { font-family: 'Playfair Display', serif; font-size: 40px; color: #fff; line-height: 1; }
  .countdown-label { font-family: 'Montserrat', sans-serif; font-size: 14px; color: #F2EDE6; }
  @media (max-width: 480px) { .countdown-banner { padding: 18px 20px; } .countdown-num { font-size: 32px; } }
  .tab-panel { display: none; }
  .tab-panel.on { display: block; }

  /* ── Bottom tab bar (mobile) ── */
  .bottom-tabs {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
    background: #fff; border-top: 1px solid var(--sand);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .bt-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    border: none; background: none; cursor: pointer;
    font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: .3px;
    color: var(--muted); padding: 6px 2px;
  }
  .bt-item svg { width: 18px; height: 18px; stroke: currentColor; }
  .bt-item.on { color: var(--charcoal); }
  .bt-item span { white-space: nowrap; }
  .bottom-tabs { overflow-x: auto; scrollbar-width: none; }
  .bottom-tabs::-webkit-scrollbar { display: none; }
  .bt-item { min-width: 50px; flex: 1 0 auto; }
  @media (max-width: 400px) { .bt-item { font-size: 9px; letter-spacing: 0; padding: 6px 2px; } }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .main { margin-left: 0 !important; padding: 20px 16px 90px; }
    .bottom-tabs { display: flex; }
  }

  /* ── Cards (Itinerary / Recommendations) ── */
  .card {
    background: white; border: 1px solid var(--sand); border-radius: 14px;
    padding: 22px 24px; margin-bottom: 16px;
    box-shadow: 0 2px 10px rgba(28,23,18,.04);
  }
  .day-heading {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 22px; color: var(--charcoal);
    margin: 26px 0 10px;
  }
  .day-heading:first-child { margin-top: 0; }
  .itin-item { display:flex; gap:14px; padding: 12px 0; border-bottom: 1px solid var(--warm); }
  .itin-item:last-child { border-bottom: none; }
  .itin-time {
    font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700;
    color: var(--rose); text-transform: uppercase; letter-spacing: .5px;
    flex-shrink: 0; width: 84px; padding-top: 2px;
  }
  .itin-title { font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 600; color: var(--charcoal); }
  .itin-desc { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .itin-loc { font-size: 12px; color: var(--tan); margin-top: 4px; }
  .itin-loc::before { content: '📍 '; }


  /* ── Recommendation tiles ── */
  .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .rec-tile { background: #fff; border: 1px solid var(--sand); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .rec-gal { position: relative; aspect-ratio: 4 / 3; background: #EFE8DF; }
  .rec-track { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth; }
  .rec-track::-webkit-scrollbar { display: none; }
  .rec-track img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; }
  .rec-noimg { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 44px; }
  .rec-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.88); color: var(--charcoal); font-size: 16px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.18);
    display: flex; align-items: center; justify-content: center; }
  .rec-arrow.l { left: 10px; } .rec-arrow.r { right: 10px; }
  .rec-dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; pointer-events: none; }
  .rec-dots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.55); }
  .rec-dots span.on { background: #fff; }
  .rec-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .rec-title { font-family: 'Playfair Display', serif; font-size: 22px; line-height: 1.15; color: var(--charcoal); }
  .rec-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .rec-chip { font-family: 'Montserrat', sans-serif; font-size: 11px; padding: 3px 9px; border-radius: 20px; background: #F4EEE7; color: var(--charcoal); }
  .rec-info { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .rec-info b { color: var(--charcoal); font-weight: 600; }
  .rec-tip { font-size: 13px; line-height: 1.5; background: #F9F5F0; border-left: 3px solid var(--charcoal); padding: 8px 10px; border-radius: 0 8px 8px 0; color: var(--charcoal); }
  .rec-map { margin-top: auto; align-self: flex-start; font-family: 'Montserrat', sans-serif; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--charcoal); text-decoration: none; border-bottom: 1px solid var(--charcoal); padding-bottom: 2px; }
  .rec-actions { margin-top: auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-top: 4px; }
  .rec-actions .rec-map { margin-top: 0; align-self: center; }
  .rec-btn { font-family: 'Montserrat', sans-serif; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; text-decoration: none;
    background: var(--charcoal); color: #F9F5F0; padding: 9px 16px; border-radius: 8px; }
  @media (max-width: 640px) { .rec-grid { grid-template-columns: 1fr; } }
  /* ── Full-screen viewer (menus + tile photos) ── */
  .rv { position: fixed; inset: 0; z-index: 1000; background: rgba(20,16,12,.94); display: none; flex-direction: column; }
  .rv.open { display: flex; }
  .rv-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; color: #F9F5F0; font-family: 'Montserrat', sans-serif; }
  .rv-title { font-family: 'Playfair Display', serif; font-size: 22px; }
  .rv-count { font-size: 12px; letter-spacing: 1.5px; opacity: .7; margin-left: 12px; }
  .rv-close { background: none; border: none; color: #F9F5F0; font-size: 30px; line-height: 1; cursor: pointer; padding: 4px 8px; }
  .rv-track { flex: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth; }
  .rv-track::-webkit-scrollbar { display: none; }
  .rv-slide { flex: 0 0 100%; scroll-snap-align: start; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 0 12px 20px; }
  .rv-slide img { max-width: 100%; max-height: calc(100vh - 90px); object-fit: contain; border-radius: 6px; background: #fff; margin: auto; }
  .rv-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.9); color: var(--charcoal); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .rv-arrow.l { left: 16px; } .rv-arrow.r { right: 16px; }
  @media (max-width: 640px) { .rv-arrow { display: none; } .rv-slide { padding: 0 0 16px; } }
  .rec-track img { cursor: zoom-in; }
  .rec-subtabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .rec-subtab {
    padding: 9px 20px; border: 1px solid var(--sand); border-radius: 24px;
    font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
    background: white; color: var(--muted); transition: all .2s;
  }
  .rec-subtab:hover { border-color: var(--charcoal); color: var(--charcoal); }
  .rec-subtab.on { background: var(--charcoal); color: #fff; border-color: var(--charcoal); }
  .rec-card {
    display:flex; align-items:flex-start; gap: 14px;
    background: white; border: 1px solid var(--sand); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 10px;
  }
  .rec-pin {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink:0;
    background: var(--warm); display:flex; align-items:center; justify-content:center;
    font-size: 18px;
  }
  .rec-name { font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 600; color: var(--charcoal); }
  .rec-desc { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .rec-link {
    display:inline-block; margin-top: 8px;
    font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; color: var(--charcoal);
    text-decoration: underline; text-underline-offset: 3px;
  }

  .pack-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 22px; color: var(--charcoal);
    margin-bottom: 4px;
  }
  .pack-sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .pack-cat { font-family:'Montserrat',sans-serif; font-size: 11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color: var(--rose); margin: 16px 0 8px; }
  .pack-cat:first-of-type { margin-top: 0; }
  .pack-row { display:flex; align-items:center; gap:10px; padding: 7px 0; user-select:none; }
  .pack-row input { width:18px; height:18px; accent-color: var(--green); cursor:pointer; flex-shrink:0; }
  .pack-row .pack-item-text { font-size: 14px; color: var(--charcoal); flex:1; min-width:0; word-break:break-word; }
  .pack-row.checked .pack-item-text { color: var(--muted); text-decoration: line-through; }
  .pack-row-actions { display:flex; gap:4px; flex-shrink:0; opacity:.55; }
  .pack-icon-btn { border:none; background:none; cursor:pointer; font-size:12px; color:var(--muted); padding:4px; line-height:1; }
  .pack-icon-btn:hover { color: var(--charcoal); }
  .pack-edit-input { flex:1; font-size:14px; color:var(--charcoal); font-family:'Montserrat',sans-serif; border:1px solid var(--sand); border-radius:6px; padding:4px 8px; outline:none; }
  .pack-edit-input:focus { border-color: var(--charcoal); }
  .pack-add-bar { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .pack-add-bar input { border:1px solid var(--sand); border-radius:8px; padding:9px 12px; font-family:'Montserrat',sans-serif; font-size:13px; background:white; color:var(--charcoal); outline:none; }
  .pack-add-bar input:focus { border-color: var(--charcoal); }
  .pack-add-bar #pack-new-cat { width:160px; flex-shrink:0; }
  .pack-add-bar #pack-new-text { flex:1; min-width:140px; }
  @media (max-width: 480px) { .pack-add-bar #pack-new-cat { width:100%; } }

  /* Budget */
  .budget-summary-card { background:white; border:1px solid var(--sand); border-radius:14px; padding:22px 24px; margin-bottom:20px; box-shadow:0 2px 10px rgba(28,23,18,.07); }
  .budget-stat { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .budget-stat-label { font-family:'Montserrat',sans-serif; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .budget-stat-value { font-family:'Playfair Display',serif; font-size:20px; color:var(--charcoal); }
  .budget-progress-track { width:100%; height:8px; border-radius:6px; background:var(--warm); overflow:hidden; margin:12px 0 8px; }
  .budget-progress-fill { height:100%; background:var(--green); border-radius:6px; transition:width .3s ease; }
  .budget-progress-fill.over { background:var(--rose); }
  .budget-remaining { font-size:13px; color:var(--muted); }
  .budget-remaining.over { color:var(--rose); font-weight:600; }
  .budget-goal-edit { display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .budget-goal-edit input { border:1px solid var(--sand); border-radius:8px; padding:8px 12px; font-family:'Montserrat',sans-serif; font-size:13px; width:140px; outline:none; }
  .budget-goal-edit input:focus { border-color:var(--charcoal); }
  .budget-row { display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--warm); }
  .budget-row:last-child { border-bottom:none; }
  .budget-row-date { font-family:'Montserrat',sans-serif; font-size:11px; color:var(--tan); width:64px; flex-shrink:0; }
  .budget-row-main { flex:1; min-width:0; }
  .budget-row-desc { font-size:14px; color:var(--charcoal); }
  .budget-row-cat { font-size:11px; color:var(--muted); margin-top:1px; }
  .budget-row-amount { font-family:'Playfair Display',serif; font-size:17px; color:var(--charcoal); flex-shrink:0; }

  /* Trip intro (welcome note + inclusions) */
  .trip-note { background:white; border:1px solid var(--sand); border-radius:14px; padding:24px 26px; margin-bottom:16px; box-shadow:var(--shadow); }
  .trip-note-title { font-family:'Playfair Display',serif; font-size:22px; color:var(--charcoal); margin-bottom:10px; }
  .trip-note-body { font-size:14px; line-height:1.7; color:var(--muted); max-width:70ch; }
  .trip-note-body p { margin:0 0 10px; } .trip-note-body p:last-child { margin:0; }
  .trip-note-body strong { color:var(--charcoal); font-weight:600; }
  .intro-video { position:relative; width:100%; aspect-ratio:16/9; border-radius:10px; overflow:hidden; background:#000; }
  .intro-video iframe, .intro-video video { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .trip-incl { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:28px; }
  .trip-incl .trip-note { margin-bottom:0; }
  .trip-incl ul { list-style:none; padding:0; margin:0; }
  .trip-incl li { position:relative; padding-left:22px; margin-bottom:8px; font-size:13px; line-height:1.55; color:var(--charcoal); }
  .trip-incl li::before { position:absolute; left:0; top:0; font-weight:700; }
  .trip-incl .yes li::before { content:'✓'; color:var(--green); }
  .trip-incl .no li::before { content:'✕'; color:var(--rose); font-size:12px; top:1px; }
  .trip-incl strong { font-weight:600; }
  .day-sub { font-family:'Playfair Display',serif; font-style:italic; }
  @media (max-width:700px) { .trip-incl { grid-template-columns:1fr; } .trip-note { padding:20px; } }
  /* Payment schedule */
  .pay-row { display:grid; grid-template-columns:1fr auto auto; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--warm); font-size:13px; }
  .pay-row:last-of-type { border-bottom:none; }
  .pay-label { font-weight:600; color:var(--charcoal); }
  .pay-due { color:var(--muted); font-size:12px; margin-top:2px; }
  .pay-amt { font-variant-numeric:tabular-nums; font-weight:600; color:var(--charcoal); text-align:right; }
  .pay-pill { font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:4px 9px; border-radius:20px; white-space:nowrap; }
  .pay-pill.paid { background:#E3EBDD; color:#3F5233; }
  .pay-pill.due { background:var(--warm); color:var(--charcoal); }
  .pay-pill.overdue { background:#F5DDD8; color:#8E3B2E; }
  .pay-total { display:flex; justify-content:space-between; padding-top:12px; font-size:13px; font-weight:600; }

  /* Visual itinerary */
  .itin-strip { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; margin-bottom:12px; scrollbar-width:thin; }
  .itin-pill { flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-start; gap:2px; min-width:118px; padding:10px 14px; border-radius:12px;
    border:1px solid var(--sand); background:white; cursor:pointer; text-align:left; font-family:'Montserrat',sans-serif; color:var(--charcoal); }
  .itin-pill:hover { border-color:var(--charcoal); }
  .itin-pill.on { background:var(--charcoal); border-color:var(--charcoal); color:#F9F5F0; }
  .ip-day { font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; opacity:.75; }
  .ip-title { font-family:'Playfair Display',serif; font-size:16px; line-height:1.2; }
  .ip-date { font-size:11px; opacity:.75; }
  .itin-day { background:white; border:1px solid var(--sand); border-radius:16px; overflow:hidden; box-shadow:var(--shadow); }
  .itin-banner { position:relative; min-height:150px; display:flex; align-items:flex-end;
    background:linear-gradient(135deg, #3A2E25 0%, #6B5444 55%, #A8836A 100%); background-size:cover; background-position:center; }
  .itin-banner.has-photo { min-height:220px; }
  .itin-banner.has-photo::before { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(20,15,10,0) 35%, rgba(20,15,10,.7) 100%); }
  .ib-inner { position:relative; padding:20px 24px; color:#fff; }

function renderCountdownBanner(items) {
  var dates = (items || []).map(function(it){ return it.item_date; }).filter(Boolean).sort();
  if (dates.length === 0) return '';
  var first = new Date(dates[0] + 'T00:00:00');

  var today = new Date(); today.setHours(0,0,0,0);

  return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
}

// Reads "- item" lines; **bold** is kept. Non-bullet lines are ignored.
function inclItems(text) {
  return String(text || '').split(/\r?\n/).map(function(l) { return l.trim(); })
    .filter(function(l) { return /^[-•]\s+/.test(l); }).map(function(l) { return l.replace(/^[-•]\s+/, ''); });
}

function inclInline(t) { return recEsc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }

function renderInclusions(tour) {
  tour = tour || {};
  var inc = inclItems(tour.included), exc = inclItems(tour.not_included);
  if (!inc.length && !exc.length) return '';
  var html = '<section class="incl">';
  if (inc.length) {
    html += '<div class="incl-card"><h2 class="incl-title">What’s included</h2><div class="incl-list">'
      + inc.map(function(t) {
        return '<div class="incl-row"><span class="incl-ic">' + inclSvg(inclIcon(t), 18) + '</span><span class="incl-txt">' + inclInline(t) + '</span></div>';
      }).join('') + '</div></div>';
  }
  if (exc.length) {
    html += '<div class="incl-ex"><div class="incl-ex-head">Not included <span>· budget for these separately</span></div>'
      + '<div class="incl-ex-list">' + exc.map(function(t) {
        return '<div class="incl-ex-item"><span class="incl-ex-ic">' + inclSvg(inclIcon(t, 'wallet'), 16) + '</span><span>' + inclInline(t) + '</span></div>';
      }).join('') + '</div></div>';
  }
  return html + '</section>';
}

var tourInfo = {};

var itinItems = [];
var itinDay = null;

// Picks an icon from the activity's wording so the timeline scans at a glance.
function itinIcon(it) {
  var t = ((it.title || '') + ' ' + (it.time_label || '')).toLowerCase();
  var rules = [
    [/breakfast|coffee/, '☕'], [/lunch|dinner|meal/, '🍽️'], [/fitting|tailor|measure/, '✂️'],
    [/airport|arriv|flight|transfer/, '✈️'], [/check ?out|depart|luggage/, '🧳'], [/silk/, '🧵'],
    [/beach|pool/, '🏖️'], [/tour|village|market|temple/, '🏮'], [/free|relax|leisure|own/, '🌿']
  ];
  for (var i = 0; i < rules.length; i++) if (rules[i][0].test(t)) return rules[i][1];
  return '•';
}

function itinDays() {
  var byDay = {};
  itinItems.forEach(function(it) { var d = it.day_number || 0; (byDay[d] = byDay[d] || []).push(it); });
  return Object.keys(byDay).map(Number).sort(function(a, b) { return a - b; }).map(function(d) { return { day: d, items: byDay[d] }; });
}

function itinDefaultDay(days) {
  var today = new Date(); today.setHours(0, 0, 0, 0);
  for (var i = 0; i < days.length; i++) {
    var dt = days[i].items[0].item_date;
    if (dt && new Date(dt + 'T00:00:00').getTime() === today.getTime()) return days[i].day;
  }
  return days.length ? days[0].day : null;
}

function renderItinerary(items) {
  if (items) itinItems = items;
  if (!itinItems.length) {
    return '<div class="empty"><div class="em-icon">🗓️</div>Your itinerary hasn\'t been added yet.<br>Check back soon.</div>';
  }
  var days = itinDays();
  if (itinDay === null || !days.some(function(d) { return d.day === itinDay; })) itinDay = itinDefaultDay(days);
  var photos = (tourInfo && tourInfo.day_photos) || {}, tips = (tourInfo && tourInfo.day_tips) || {};

  var strip = '<div class="itin-strip" role="tablist">' + days.map(function(d) {
    var first = d.items[0], dt = first.item_date ? new Date(first.item_date + 'T00:00:00') : null;
    return '<button role="tab" aria-selected="' + (d.day === itinDay) + '" class="itin-pill' + (d.day === itinDay ? ' on' : '') + '" onclick="setItinDay(' + d.day + ')">'
      + '<span class="ip-day">Day ' + d.day + '</span>'
      + '<span class="ip-title">' + recEsc(first.day_title || '') + '</span>'
      + (dt ? '<span class="ip-date">' + dt.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' }) + '</span>' : '')
      + '</button>';
  }).join('') + '</div>';

  var cur = days.filter(function(d) { return d.day === itinDay; })[0];
  var first = cur.items[0];
  var photo = recSafeUrl(photos[String(cur.day)]);
  var dateLabel = fmtDate(first.item_date);
  var idx = days.indexOf(cur);
  var banner = '<div class="itin-banner' + (photo ? ' has-photo' : '') + '"' + (photo ? ' style="background-image:url(\'' + photo + '\')"' : '') + '>'
    + '<div class="ib-inner"><div class="ib-day">Day ' + cur.day + (dateLabel ? ' · ' + dateLabel : '') + '</div>'
    + '<div class="ib-title">' + recEsc(first.day_title || 'Your day') + '</div></div></div>';

  var timeline = '<div class="itin-tl">' + cur.items.map(function(it) {
    return '<div class="tl-row"><div class="tl-time">' + recEsc(it.time_label || '') + '</div>'
      + '<div class="tl-dot" aria-hidden="true">' + itinIcon(it) + '</div>'
      + '<div class="tl-body"><div class="itin-title">' + recEsc(it.title) + '</div>'
      + (it.description ? '<div class="itin-desc">' + recEsc(it.description) + '</div>' : '')
      + (it.location ? '<div class="itin-loc">' + recEsc(it.location) + '</div>' : '')
      + '</div></div>';
  }).join('') + '</div>';

  var tip = tips[String(cur.day)];
  var tipBox = tip ? '<div class="itin-tips"><div class="it-head">💡 Need to know today</div><div class="faq-a" style="display:block;padding:0">' + faqFormat(tip) + '</div></div>' : '';

  var nav = '<div class="itin-nav">'
    + (idx > 0 ? '<button class="rec-subtab" onclick="setItinDay(' + days[idx - 1].day + ')">‹ Day ' + days[idx - 1].day + '</button>' : '<span></span>')
    + (idx < days.length - 1 ? '<button class="rec-subtab" onclick="setItinDay(' + days[idx + 1].day + ')">Day ' + days[idx + 1].day + ' ›</button>' : '<span></span>')
    + '</div>';

  return strip + '<div class="itin-day">' + banner + '<div class="itin-day-body">' + timeline + tipBox + '</div></div>' + nav;
}

function setItinDay(d) {
  itinDay = d;
  var panel = document.getElementById('panel-itinerary');
  if (panel) {
    panel.innerHTML = renderItinerary();
    var pill = panel.querySelector('.itin-pill.on');
    if (pill && pill.scrollIntoView) pill.scrollIntoView({ block: 'nearest', inline: 'center' });
  }
}

/* ═══════════ Packing (synced, editable) ═══════════ */

var packingItems = [];
var packingLoaded = false;

function packingPanelShell(inner) {
  return '<div class="pack-add-bar">'
    + '<input id="pack-new-cat" list="pack-cat-options" placeholder="Category (e.g. Clothing)">'
    + '<datalist id="pack-cat-options">' + packingCategoryOptions() + '</datalist>'
    + '<input id="pack-new-text" placeholder="Add an item…" onkeydown="if(event.key===\'Enter\')addPackItem()">'
    + '<button class="btn btn-primary btn-sm" onclick="addPackItem()">+ Add</button>'
    + '</div>'
    + inner;
}

function packingCategoryOptions() {
  var cats = [];
  packingItems.forEach(function(it) { if (cats.indexOf(it.category) === -1) cats.push(it.category); });
  return cats.map(function(c) { return '<option value="' + c.replace(/"/g, '&quot;') + '">'; }).join('');
}

function renderPackingPanel() {
  if (!packingLoaded) {
    return '<div class="empty">Loading your packing list…</div>';
  }
  if (packingItems.length === 0) {
    return packingPanelShell('<div class="empty" style="padding:30px 0"><div class="em-icon">🧳</div>No items yet — add your first one above.</div>');
  }
  var byCat = {};
  var order = [];
  packingItems.forEach(function(it) {
    if (!byCat[it.category]) { byCat[it.category] = []; order.push(it.category); }
    byCat[it.category].push(it);
  });
  var html = '<div class="card">';
  order.forEach(function(cat) {
    html += '<div class="pack-cat">' + cat + '</div>';
    byCat[cat].forEach(function(it) {
      html += '<div class="pack-row' + (it.is_checked ? ' checked' : '') + '" data-id="' + it.id + '">'
        + '<input type="checkbox" ' + (it.is_checked ? 'checked' : '') + ' onchange="togglePackItem(\'' + it.id + '\',this.checked)">'
        + '<span class="pack-item-text" id="pack-text-' + it.id + '">' + it.item_text + '</span>'
        + '<span class="pack-row-actions">'
        + '<button class="pack-icon-btn" onclick="startEditPackItem(\'' + it.id + '\')" title="Rename">✎</button>'
        + '<button class="pack-icon-btn" onclick="deletePackItem(\'' + it.id + '\')" title="Remove">✕</button>'
        + '</span></div>';
    });
  });
  html += '</div>';
  return packingPanelShell(html);
}

function packingBody(action, extra) {
  return JSON.stringify(Object.assign({ cid: qs('cid'), email: dashClient && dashClient.email, action: action }, extra || {}));
}

function loadPackingPanel() {
  var panel = document.getElementById('panel-packing');
  if (!panel) return;
  panel.innerHTML = renderPackingPanel();
  fetch('/api/vietnam-packing', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: packingBody('list') })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      packingLoaded = true;
      packingItems = (data && data.items) || [];
      panel.innerHTML = renderPackingPanel();
    })
    .catch(function() {
      packingLoaded = true;
      panel.innerHTML = '<div class="empty">Couldn’t load your packing list. Please try again.</div>';
    });
}

function addPackItem() {
  var catEl = document.getElementById('pack-new-cat');
  var textEl = document.getElementById('pack-new-text');
  var category = (catEl.value || 'My Items').trim();
  var text = (textEl.value || '').trim();
  if (!text) { textEl.focus(); return; }
  textEl.value = '';
  fetch('/api/vietnam-packing', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: packingBody('add', { category: category, item_text: text }) })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      packingItems = (data && data.items) || packingItems;
      document.getElementById('panel-packing').innerHTML = renderPackingPanel();
      var newCat = document.getElementById('pack-new-cat'); if (newCat) newCat.value = category;
    })
    .catch(function() { showToast('Failed to add item', true); });
}

function togglePackItem(id, checked) {
  var item = packingItems.filter(function(i){ return i.id === id; })[0];
  if (item) item.is_checked = checked;
  var row = document.querySelector('.pack-row[data-id="' + id + '"]');
  if (row) row.classList.toggle('checked', checked);
  fetch('/api/vietnam-packing', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: packingBody('toggle', { id: id, is_checked: checked }) })
    .catch(function() { showToast('Failed to save — please try again', true); });
}

function startEditPackItem(id) {
  var span = document.getElementById('pack-text-' + id);
  if (!span) return;
  var current = span.textContent;
  var input = document.createElement('input');
  input.className = 'pack-edit-input';
  input.value = current;
  input.onblur = function() { savePackItemEdit(id, input.value); };
  input.onkeydown = function(e) { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.value = current; input.blur(); } };
  span.replaceWith(input);
  input.focus();
  input.select();
}

function savePackItemEdit(id, newText) {
  newText = (newText || '').trim();
  var item = packingItems.filter(function(i){ return i.id === id; })[0];
  if (!newText || !item) { document.getElementById('panel-packing').innerHTML = renderPackingPanel(); return; }
  item.item_text = newText;
  document.getElementById('panel-packing').innerHTML = renderPackingPanel();
  fetch('/api/vietnam-packing', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: packingBody('edit', { id: id, item_text: newText }) })
    .catch(function() { showToast('Failed to save — please try again', true); });
}

function deletePackItem(id) {
  packingItems = packingItems.filter(function(i){ return i.id !== id; });
  document.getElementById('panel-packing').innerHTML = renderPackingPanel();
  fetch('/api/vietnam-packing', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: packingBody('delete', { id: id }) })
    .catch(function() { showToast('Failed to remove — please try again', true); });
}

/* ═══════════ Budget (synced expense log + goal) ═══════════ */

var budgetItems = [];
var budgetGoal = null;
var budgetLoaded = false;
var budgetGoalEditing = false;

function fmtMoney(n) {
  n = Number(n) || 0;
  return '$' + n.toLocaleString('en-AU', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function budgetBody(action, extra) {
  return JSON.stringify(Object.assign({ cid: qs('cid'), email: dashClient && dashClient.email, action: action }, extra || {}));
}

function budgetSummaryHTML() {
  var spent = budgetItems.reduce(function(sum, it) { return sum + Number(it.amount || 0); }, 0);
  var html = '<div class="budget-summary-card">';
  html += '<div class="budget-stat"><div class="budget-stat-label">Spent so far</div><div class="budget-stat-value">' + fmtMoney(spent) + '</div></div>';

  if (budgetGoalEditing) {
    html += '<div class="budget-goal-edit">'
      + '<input type="number" id="budget-goal-input" placeholder="e.g. 2000" value="' + (budgetGoal || '') + '">'
      + '<button class="btn btn-primary btn-sm" onclick="saveBudgetGoal()">Save</button>'
      + '<button class="pack-icon-btn" onclick="cancelBudgetGoalEdit()">Cancel</button>'
      + '</div>';
  } else if (budgetGoal) {
    var pct = Math.min(100, Math.round((spent / budgetGoal) * 100));
    var over = spent > budgetGoal;
    html += '<div class="budget-stat"><div class="budget-stat-label">Goal <button class="pack-icon-btn" onclick="startBudgetGoalEdit()" title="Edit goal">✎</button></div><div class="budget-stat-value">' + fmtMoney(budgetGoal) + '</div></div>'
      + '<div class="budget-progress-track"><div class="budget-progress-fill' + (over ? ' over' : '') + '" style="width:' + pct + '%"></div></div>'
      + '<div class="budget-remaining' + (over ? ' over' : '') + '">' + (over ? 'You’re ' + fmtMoney(spent - budgetGoal) + ' over your goal' : fmtMoney(budgetGoal - spent) + ' remaining') + '</div>';
  } else {
    html += '<button class="btn btn-secondary btn-sm" onclick="startBudgetGoalEdit()">+ Set a Spending Goal</button>';
  }
  html += '</div>';
  return html;
}

function renderBudgetPanel() {
  if (!budgetLoaded) return '<div class="empty">Loading your budget…</div>';
  var html = budgetSummaryHTML();
  html += '<div class="pack-add-bar">'
    + '<input type="date" id="budget-new-date">'
    + '<input id="budget-new-cat" placeholder="Category" style="width:120px">'
    + '<input id="budget-new-desc" placeholder="Description" style="flex:1;min-width:120px">'
    + '<input type="number" id="budget-new-amount" placeholder="Amount" style="width:100px" onkeydown="if(event.key===\'Enter\')addBudgetItem()">'
    + '<button class="btn btn-primary btn-sm" onclick="addBudgetItem()">+ Add</button>'
    + '</div>';
  if (budgetItems.length === 0) {
    html += '<div class="empty" style="padding:30px 0"><div class="em-icon">💵</div>No expenses logged yet.</div>';
    return html;
  }
  html += '<div class="card">';
  budgetItems.forEach(function(it) {
    html += '<div class="budget-row">'
      + '<div class="budget-row-date">' + (it.expense_date ? fmtDate(it.expense_date) : '—') + '</div>'
      + '<div class="budget-row-main"><div class="budget-row-desc">' + (it.description || it.category || 'Expense') + '</div>'
      + (it.category ? '<div class="budget-row-cat">' + it.category + '</div>' : '') + '</div>'
      + '<div class="budget-row-amount">' + fmtMoney(it.amount) + '</div>'
      + '<button class="pack-icon-btn" onclick="deleteBudgetItem(\'' + it.id + '\')" title="Remove">✕</button>'
      + '</div>';
  });
  html += '</div>';
  return html;
}

function loadBudgetPanel() {
  var panel = document.getElementById('panel-budget');
  if (!panel) return;
  panel.innerHTML = renderBudgetPanel();
  fetch('/api/vietnam-budget', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: budgetBody('list') })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      budgetLoaded = true;
      budgetItems = (data && data.items) || [];
      budgetGoal = data && data.goal;
      panel.innerHTML = renderBudgetPanel();
    })
    .catch(function() {
      budgetLoaded = true;
      panel.innerHTML = '<div class="empty">Couldn’t load your budget. Please try again.</div>';
    });
}

function startBudgetGoalEdit() { budgetGoalEditing = true; document.getElementById('panel-budget').innerHTML = renderBudgetPanel(); document.getElementById('budget-goal-input').focus(); }
function cancelBudgetGoalEdit() { budgetGoalEditing = false; document.getElementById('panel-budget').innerHTML = renderBudgetPanel(); }

function saveBudgetGoal() {
  var val = Number(document.getElementById('budget-goal-input').value);
  if (!val || val <= 0) { showToast('Enter a valid amount', true); return; }
  budgetGoal = val;
  budgetGoalEditing = false;
  document.getElementById('panel-budget').innerHTML = renderBudgetPanel();
  fetch('/api/vietnam-budget', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: budgetBody('set_goal', { amount: val }) })
    .catch(function() { showToast('Failed to save goal', true); });
}

function addBudgetItem() {
  var dateEl = document.getElementById('budget-new-date');
  var catEl = document.getElementById('budget-new-cat');
  var descEl = document.getElementById('budget-new-desc');
  var amtEl = document.getElementById('budget-new-amount');
  var amount = Number(amtEl.value);
  if (!amount || amount <= 0) { amtEl.focus(); return; }
  var payload = { expense_date: dateEl.value || null, category: catEl.value.trim(), description: descEl.value.trim(), amount: amount };
  catEl.value = ''; descEl.value = ''; amtEl.value = '';
  fetch('/api/vietnam-budget', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: budgetBody('add', payload) })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      budgetItems = (data && data.items) || budgetItems;
      document.getElementById('panel-budget').innerHTML = renderBudgetPanel();
    })
    .catch(function() { showToast('Failed to add expense', true); });
}

function deleteBudgetItem(id) {
  budgetItems = budgetItems.filter(function(i){ return i.id !== id; });
  document.getElementById('panel-budget').innerHTML = renderBudgetPanel();
  fetch('/api/vietnam-budget', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: budgetBody('delete', { id: id }) })
    .catch(function() { showToast('Failed to remove — please try again', true); });
}

/* ═══════════ FAQ (edited in the staff portal → Vietnam → FAQ) ═══════════ */

var faqData = [];

// Tiny formatter for FAQ answers: blank line = new paragraph, "- " = bullet,
// "1. " = numbered list, **text** = bold. Everything is escaped first.
function faqFormat(text) {
  var esc = function(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var inline = function(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); };
  var out = '', list = null;
  var close = function() { if (list) { out += '</' + list + '>'; list = null; } };
  String(text || '').split(/\r?\n/).forEach(function(line) {
    var t = line.trim(), m;
    if (!t) { close(); return; }
    if ((m = t.match(/^[-•]\s+(.*)$/))) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += '<li>' + inline(m[1]) + '</li>'; return; }
    if ((m = t.match(/^\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += '<li>' + inline(m[1]) + '</li>'; return; }
    close(); out += '<p>' + inline(t) + '</p>';
  });
  close();
  return out;
}

var FAQ_CATS = [
  { id: 'trip',     lbl: 'Your trip' },
  { id: 'before',   lbl: 'Before you go' },
  { id: 'around',   lbl: 'Getting around' },
  { id: 'money',    lbl: 'Money' },
  { id: 'safety',   lbl: 'Health & safety' },
  { id: 'everyday', lbl: 'Everyday life' }
];

var faqCat = null;

function renderFaqPanel() {
  if (!faqData.length) return '<div class="empty"><div class="em-icon">❓</div>FAQs are coming soon.</div>';
  var cats = FAQ_CATS.concat([{ id: '', lbl: 'More' }]).map(function(c) {
    return { id: c.id, lbl: c.lbl, items: faqData.filter(function(f) { return c.id ? f.category === c.id : !FAQ_CATS.some(function(k) { return k.id === f.category; }); }) };
  }).filter(function(c) { return c.items.length; });
  if (!cats.some(function(c) { return c.id === faqCat; })) faqCat = cats[0].id;
  var cur = cats.filter(function(c) { return c.id === faqCat; })[0];
  var tabs = '<div class="rec-subtabs">' + cats.map(function(c) {
    return '<button class="rec-subtab' + (c.id === faqCat ? ' on' : '') + '" onclick="setFaqCat(\'' + c.id + '\')">' + c.lbl + ' <span style="opacity:.55">' + c.items.length + '</span></button>';
  }).join('') + '</div>';
  var list = cur.items.map(function(f, i) {
    return '<div class="faq-item" id="faq-' + i + '">'
      + '<button type="button" class="faq-q" aria-expanded="false" onclick="faqToggle(' + i + ')">'
      + (f.icon ? '<span class="faq-ic">' + recEsc(f.icon) + '</span>' : '')
      + '<span>' + recEsc(f.question) + '</span><span class="faq-chev">+</span></button>'
      + '<div class="faq-a">' + faqFormat(f.answer) + '</div></div>';
  }).join('');
  return tabs + (cur.items.length > 1 ? '<div class="faq-tools"><button type="button" onclick="faqToggleAll()">Expand all</button></div>' : '') + list;
}

function setFaqCat(id) {
  faqCat = id;
  var panel = document.getElementById('panel-faq');
  if (panel) panel.innerHTML = renderFaqPanel();
}

function faqToggle(i) {
  var el = document.getElementById('faq-' + i); if (!el) return;
  var open = el.classList.toggle('open');
  el.querySelector('.faq-q').setAttribute('aria-expanded', open ? 'true' : 'false');
}

function faqToggleAll() {
  var items = document.querySelectorAll('.faq-item');
  var anyClosed = Array.prototype.some.call(items, function(el) { return !el.classList.contains('open'); });
  items.forEach(function(el) { el.classList.toggle('open', anyClosed); el.querySelector('.faq-q').setAttribute('aria-expanded', anyClosed ? 'true' : 'false'); });
  var btn = document.querySelector('.faq-tools button'); if (btn) btn.textContent = anyClosed ? 'Collapse all' : 'Expand all';
}

/* ═══════════ About Vietnam (static content; tab id stays 'needtoknow') ═══════════ */

var NEED_TO_KNOW = [

  { icon: '💵', title: 'Money & Currency', body: 'The local currency is Vietnamese đồng (VND). Notes come in 1,000, 2,000, 5,000, 10,000, 20,000, 50,000, 100,000, 200,000 and 500,000. Cash is king for markets, street food and small shops, and cards are fine at hotels and larger restaurants. ATMs are everywhere in Hoi An and Da Nang. Let your bank know you\'re travelling so your card isn\'t blocked.' },
  { icon: '☀️', title: 'Weather', body: '<div class="ntk-seasons">'
      + '<div><b>Spring</b><span>Feb–Apr</span><em>20–28°C</em></div>'
      + '<div><b>Summer</b><span>May–Aug</span><em>24–32°C</em></div>'
      + '<div><b>Autumn</b><span>Sep–Oct</span><em>28–35°C</em></div>'
      + '<div><b>Winter</b><span>Nov–Jan</span><em>18–24°C</em></div>'
