function renderNeedToKnowPanel() {
  var html = '';
  NEED_TO_KNOW.forEach(function(section) {
    html += '<div class="ntk-card"><div class="ntk-title"><span class="ntk-icon">' + section.icon + '</span>' + section.title + '</div>'
      + '<div class="ntk-body">' + section.body + '</div></div>';
  });
  return html;
}

/* ═══════════ Your Info (contract, personal details, documents) ═══════════ */

var yourInfoLoaded = false;
var yourInfoData = { info: null, documents: [] };

function infoBody(action, extra) {
  return JSON.stringify(Object.assign({ cid: qs('cid'), email: dashClient && dashClient.email, action: action }, extra || {}));
}

function fmtFileSize() { return ''; }

var infoSub = 'personal';
var infoStatus = {};   // doc type -> upload status text

var INFO_TABS = [
  { id: 'personal',  lbl: 'Personal Info' },
  { id: 'flights',   lbl: 'Flights' },
  { id: 'accom',     lbl: 'Accommodation' },
  { id: 'contract',  lbl: 'Contract' },
  { id: 'visa',      lbl: 'Visa' },
  { id: 'insurance', lbl: 'Insurance' }
];

function infoEsc(v) { return recEsc(v); }

function infoDocs(type) { return (yourInfoData.documents || []).filter(function(d) { return d.doc_type === type; }); }

// One upload box per document type: lists what's there and lets the client add or remove their own files.
function infoUploadBox(type, title, hint, emptyText) {
  var docs = infoDocs(type);
  var html = (title ? '<div class="info-title" style="font-size:19px;margin-top:18px">' + title + '</div>' : '')
    + (hint ? '<div class="info-sub" style="margin-bottom:12px">' + hint + '</div>' : '');
  if (!docs.length) html += '<div class="info-sub" style="margin-bottom:6px;font-style:italic">' + (emptyText || 'Nothing uploaded yet.') + '</div>';
  docs.forEach(function(d) {
    html += '<div class="doc-row"><span class="doc-name">📎 ' + infoEsc(d.file_name) + '</span>'
      + (d.url ? '<a class="rec-link" href="' + infoEsc(d.url) + '" target="_blank" rel="noopener" style="margin-right:10px">View ↗</a>' : '<span class="info-sub" style="margin-right:10px">Reload to view</span>')
      + (d.uploaded_by === 'client' ? '<button class="pack-icon-btn" onclick="deleteYourInfoDoc(\'' + d.id + '\')" title="Remove">✕</button>' : '')
      + '</div>';
  });
  html += '<input type="file" id="info-up-' + type + '" accept="image/*,application/pdf" style="display:none" onchange="uploadYourInfoDoc(this,\'' + type + '\')">'
    + '<button class="btn btn-secondary btn-sm" style="margin-top:12px" onclick="document.getElementById(\'info-up-' + type + '\').click()">+ Upload' + (docs.length ? ' another' : '') + '</button>'
    + '<div class="info-sub" style="margin-top:8px">' + infoEsc(infoStatus[type] || 'PDF or photo, up to 4MB.') + '</div>';
  return html;
}

function infoField(id, label, value, opts) {
  opts = opts || {};
  var v = infoEsc(value || '');
  var input = opts.textarea
    ? '<textarea id="' + id + '" placeholder="' + infoEsc(opts.ph || '') + '">' + v + '</textarea>'
    : '<input id="' + id + '" type="' + (opts.type || 'text') + '" value="' + v + '" placeholder="' + infoEsc(opts.ph || '') + '">';
  return '<div class="form-group' + (opts.full ? ' full' : '') + '"><label for="' + id + '">' + label + '</label>' + input + '</div>';
}

function infoSection(title, sub, inner) {
  return '<div class="card"><div class="info-title">' + title + '</div>' + (sub ? '<div class="info-sub" style="margin-bottom:16px">' + sub + '</div>' : '') + inner + '</div>';
}

function renderInfoSub() {
  var info = yourInfoData.info || {};
  if (infoSub === 'personal') {
    return infoSection('Passport', 'Your passport must be valid for 6 months from the date you arrive in Vietnam.',
        '<div class="prompts-section">'
        + infoField('info-passport-number', 'Passport Number', info.passport_number)
        + infoField('info-passport-expiry', 'Passport Expiry', info.passport_expiry, { type: 'date' })
        + '</div>' + infoUploadBox('passport', 'Passport copy', 'Upload a clear photo or scan of your passport photo page.'))
      + infoSection('Emergency Contact', 'Someone we can call if anything happens while you’re away.',
        '<div class="prompts-section">'
        + infoField('info-ec-name', 'Name', info.emergency_contact_name)
        + infoField('info-ec-rel', 'Relationship to you', info.emergency_contact_relationship, { ph: 'e.g. Partner, Mum' })
        + infoField('info-ec-phone', 'Phone (with country code)', info.emergency_contact_phone, { type: 'tel', ph: '+61 …' })
        + '</div>')
      + infoSection('Food & Health', 'So we can plan meals and let restaurants know.',
        '<div class="prompts-section">'
        + infoField('info-allergies', 'Allergies', info.allergies, { textarea: true, full: true, ph: 'e.g. Peanuts (severe), shellfish' })
        + infoField('info-dietary', 'Dietary requirements', info.dietary_needs, { textarea: true, full: true, ph: 'e.g. Vegetarian, no pork, gluten free' })
        + infoField('info-notes', 'Anything else we should know?', info.notes, { textarea: true, full: true })
        + '</div>')
      + '<button class="btn btn-primary btn-sm" id="info-save-personal" onclick="saveYourInfo(\'personal\')">Save Personal Info</button>';
  }
  if (infoSub === 'flights') {
    return infoSection('Flight Details', 'Times are local time at the airport.',
        '<div class="prompts-section">'
        + '<div class="form-group full" style="margin-bottom:4px"><label style="color:var(--charcoal)">Arriving into Da Nang</label></div>'
        + infoField('info-arr-flight', 'Flight number', info.arrival_flight, { ph: 'e.g. SQ 184' })
        + infoField('info-arr-from', 'Flying in from', info.arrival_from, { ph: 'e.g. Singapore' })
        + infoField('info-arr-dt', 'Arrival date & time', info.arrival_datetime, { type: 'datetime-local' })
        + '<div class="form-group full" style="margin:6px 0 4px"><label style="color:var(--charcoal)">Departing Da Nang</label></div>'
        + infoField('info-dep-flight', 'Flight number', info.departure_flight, { ph: 'e.g. CX 760' })
        + infoField('info-dep-to', 'Flying to', info.departure_to, { ph: 'e.g. Hong Kong' })
        + infoField('info-dep-dt', 'Departure date & time', info.departure_datetime, { type: 'datetime-local' })
        + infoField('info-flight-notes', 'Anything else about your flights?', info.flight_notes, { textarea: true, full: true, ph: 'e.g. Staying a night in Singapore on the way' })
        + '</div>'
        + '<button class="btn btn-primary btn-sm" id="info-save-flights" onclick="saveYourInfo(\'flights\')">Save Flight Details</button>')
      + infoSection('Flight Itinerary', '', infoUploadBox('flights', '', 'Upload your booking confirmation or e-ticket.'));
  }
  if (infoSub === 'accom') {
    var room = yourInfoData.room_type, partner = yourInfoData.partner_name;
    var rows = '<div class="doc-row"><span class="doc-name" style="color:var(--muted)">Room type</span><span style="font-weight:600">' + infoEsc(room || 'To be confirmed') + '</span></div>';
    if (partner) rows += '<div class="doc-row"><span class="doc-name" style="color:var(--muted)">Sharing with</span><span style="font-weight:600">' + infoEsc(partner) + '</span></div>';
    return infoSection('Your Accommodation', 'Set by your tour coordinator. Email us if anything here looks wrong.', rows);
  }
  if (infoSub === 'contract') {
    var c = infoDocs('contract')[0];
    var top = c
      ? '<div class="doc-row"><span class="doc-name">📄 ' + infoEsc(c.file_name) + '</span>'
        + (c.url ? '<a class="rec-link" href="' + infoEsc(c.url) + '" target="_blank" rel="noopener">Download ↗</a>' : '<span class="info-sub">Reload to view</span>') + '</div>'
      : '<div class="info-sub" style="font-style:italic">Your tour coordinator hasn’t added your contract yet.</div>';
    return infoSection('Your Contract', 'Download, sign and upload your signed copy below.', top)
      + infoSection('Signed Contract', '', infoUploadBox('signed_contract', '', 'Upload your signed contract.'))
      + renderPayments();
  }
  if (infoSub === 'visa') {
    return infoSection('Visa', 'Apply at least 2 weeks before you travel. See the FAQ for how.', infoUploadBox('visa', '', 'Upload your approved e-visa.'));
  }
  if (infoSub === 'insurance') {
    return infoSection('Travel Insurance', 'Make sure your policy covers everything you plan to do, including scooters if you’ll ride one.', infoUploadBox('insurance', '', 'Upload your policy certificate.'));
  }
  return '';
}

function fmtAud(n) {
  if (n === null || n === undefined || n === '') return '';
  var v = Number(n);
  return '$' + v.toLocaleString('en-AU', { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 });
}

function renderPayments() {
  var list = yourInfoData.payments || [];
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var body;
  if (!list.length) {
    body = '<div class="info-sub" style="font-style:italic">Your payment schedule will appear here once your booking is confirmed.</div>';
  } else {
    var total = 0, paid = 0;
    body = list.map(function(p) {
      var amt = p.amount != null ? Number(p.amount) : 0;
      total += amt; if (p.status === 'paid') paid += amt;
      var due = p.due_date ? new Date(p.due_date + 'T00:00:00') : null;
      var state = p.status === 'paid' ? 'paid' : (due && due < today ? 'overdue' : 'due');
      var stateLbl = { paid: 'Paid', due: 'Due', overdue: 'Overdue' }[state];
      return '<div class="pay-row"><div><div class="pay-label">' + infoEsc(p.label) + '</div>'
        + '<div class="pay-due">' + (due ? 'Due ' + due.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : '') + (p.note ? (due ? ' · ' : '') + infoEsc(p.note) : '') + '</div></div>'
        + '<div class="pay-amt">' + fmtAud(p.amount) + '</div>'
        + '<span class="pay-pill ' + state + '">' + stateLbl + '</span></div>';
    }).join('');
    if (total) body += '<div class="pay-total"><span>Paid ' + fmtAud(paid) + ' of ' + fmtAud(total) + '</span><span>Remaining ' + fmtAud(total - paid) + '</span></div>';
  }
  return infoSection('Payment Schedule', 'All amounts in AUD. Credit card payments incur a 1.9% fee; bank transfer is also available.', body);
}

function renderYourInfoPanel() {
  if (!yourInfoLoaded) return '<div class="empty">Loading your info…</div>';
  var done = {
    personal: !!((yourInfoData.info || {}).passport_number && infoDocs('passport').length),
    flights: infoDocs('flights').length > 0, accom: !!yourInfoData.room_type,
    contract: infoDocs('signed_contract').length > 0, visa: infoDocs('visa').length > 0, insurance: infoDocs('insurance').length > 0
  };
  var tabs = '<div class="rec-subtabs">' + INFO_TABS.map(function(t) {
    return '<button class="rec-subtab' + (infoSub === t.id ? ' on' : '') + '" onclick="setInfoSub(\'' + t.id + '\')">'
      + t.lbl + (done[t.id] ? ' <span aria-label="done" style="opacity:.75">✓</span>' : '') + '</button>';
  }).join('') + '</div>';
  return tabs + '<div id="info-sub-body">' + renderInfoSub() + '</div>';
}

function setInfoSub(id) {
  infoSub = id;
  var panel = document.getElementById('panel-yourinfo');
  if (panel) panel.innerHTML = renderYourInfoPanel();
}

function loadYourInfoPanel() {
  var panel = document.getElementById('panel-yourinfo');
  if (!panel) return;
  panel.innerHTML = renderYourInfoPanel();
  fetch('/api/vietnam-info', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: infoBody('get') })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      yourInfoLoaded = true;
      yourInfoData = { info: data.info, documents: data.documents || [], room_type: data.room_type, partner_name: data.partner_name, payments: data.payments || [] };
      panel.innerHTML = renderYourInfoPanel();
    })
    .catch(function() {
      yourInfoLoaded = true;
      panel.innerHTML = '<div class="empty">Couldn’t load your info. Please try again.</div>';
    });
}

function saveYourInfo(which) {
  var v = function(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; };
  var payload = which === 'flights' ? {
    arrival_flight: v('info-arr-flight'), arrival_from: v('info-arr-from'), arrival_datetime: v('info-arr-dt'),
    departure_flight: v('info-dep-flight'), departure_to: v('info-dep-to'), departure_datetime: v('info-dep-dt'),
    flight_notes: v('info-flight-notes')
  } : {
    passport_number: v('info-passport-number'), passport_expiry: v('info-passport-expiry'),
    emergency_contact_name: v('info-ec-name'), emergency_contact_relationship: v('info-ec-rel'), emergency_contact_phone: v('info-ec-phone'),
    allergies: v('info-allergies'), dietary_needs: v('info-dietary'), notes: v('info-notes')
  };
  var btn = document.getElementById('info-save-' + which);
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  fetch('/api/vietnam-info', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: infoBody('save_info', payload) })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data || !data.ok) throw new Error((data && data.error) || 'Failed to save');
      yourInfoData.info = data.info || Object.assign({}, yourInfoData.info, payload);
      showToast('Saved');
      setInfoSub(infoSub);
    })
    .catch(function(e) {
      showToast(e.message || 'Failed to save — please try again', true);
      if (btn) { btn.disabled = false; btn.textContent = which === 'flights' ? 'Save Flight Details' : 'Save Personal Info'; }
    });
}

// Typed fields aren't lost when an upload re-renders the tab.
function infoKeepTyped() {
  var keep = {};
  document.querySelectorAll('#info-sub-body input[id], #info-sub-body textarea[id]').forEach(function(el) { if (el.type !== 'file') keep[el.id] = el.value; });
  return function() { Object.keys(keep).forEach(function(id) { var el = document.getElementById(id); if (el) el.value = keep[id]; }); };
}

function uploadYourInfoDoc(input, type) {
  var file = input.files[0];
  input.value = '';
  if (!file) return;
  if (file.size > 4 * 1024 * 1024) { showToast('File must be under 4MB', true); return; }
  var restore = infoKeepTyped();
  infoStatus[type] = 'Uploading ' + file.name + '…'; setInfoSub(infoSub); restore();
  var reader = new FileReader();
  reader.onload = function() {
    fetch('/api/vietnam-info', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: infoBody('upload', { doc_type: type, file_name: file.name, content_type: file.type, file_base64: reader.result.split(',')[1] })
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data && data.ok) { yourInfoData.documents = data.documents; infoStatus[type] = 'Uploaded ✓'; }
        else infoStatus[type] = (data && data.error) || 'Upload failed.';
      })
      .catch(function() { infoStatus[type] = 'Upload failed. Please try again.'; })
      .then(function() { var r2 = infoKeepTyped(); setInfoSub(infoSub); r2(); });
  };
  reader.readAsDataURL(file);
}

function deleteYourInfoDoc(id) {
  var restore = infoKeepTyped();
  fetch('/api/vietnam-info', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: infoBody('delete_document', { id: id }) })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.documents) { yourInfoData.documents = data.documents; setInfoSub(infoSub); restore(); }
      else showToast((data && data.error) || 'Failed to remove', true);
    })
    .catch(function() { showToast('Failed to remove — please try again', true); });
}

/* ═══════════ Recommendations ═══════════ */

var recsData = [];
var recFilter = null;

// Order here = order of the subtabs. Only categories with at least one place show.
var REC_CATS = [
  { id: 'food',        lbl: 'Restaurants', icon: '🍜' },
  { id: 'cafe',        lbl: 'Cafes',       icon: '☕' },
  { id: 'bar',         lbl: 'Bars',        icon: '🍸' },
  { id: 'activity',    lbl: 'Activities',  icon: '🎡' },
  { id: 'sightseeing', lbl: 'Sightseeing', icon: '🏯' },
  { id: 'spa',         lbl: 'Spas',        icon: '💆' },
  { id: 'shopping',    lbl: 'Shopping',    icon: '🛍️' },
  { id: 'beach',       lbl: 'Beaches',     icon: '🏖️' },
  { id: 'daytrip',     lbl: 'Day Trips',   icon: '🚐' }
];

function recEsc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function recSafeUrl(u) { return /^https?:\/\//i.test(u || '') ? recEsc(u) : ''; }

function recCatsWithItems() {
  return REC_CATS.filter(function(c) {
    return recsData.some(function(r) { return r.category === c.id; });
  });
}

function recSubTabsHTML(cats) {
  return '<div class="rec-subtabs">' + cats.map(function(c) {
    var n = recsData.filter(function(r) { return r.category === c.id; }).length;
    return '<button class="rec-subtab' + (recFilter === c.id ? ' on' : '') + '" onclick="setRecFilter(\'' + c.id + '\')">'
      + c.lbl + ' <span style="opacity:.55">' + n + '</span></button>';
  }).join('') + '</div>';
}

function recPhotos(r) {
  var list = Array.isArray(r.photos) && r.photos.length ? r.photos : (r.image_url ? [r.image_url] : []);
  return list.map(recSafeUrl).filter(Boolean);
}

function recMenu(r) { return (Array.isArray(r.menu_photos) ? r.menu_photos : []).map(recSafeUrl).filter(Boolean); }

var recVisible = [];   // places in the subtab currently shown, indexed like the tiles

function recViewerEl() {
  var el = document.getElementById('rec-viewer');
  if (el) return el;
  el = document.createElement('div');
  el.id = 'rec-viewer'; el.className = 'rv';
  el.innerHTML = '<div class="rv-top"><div><span class="rv-title" id="rv-title"></span><span class="rv-count" id="rv-count"></span></div>'
    + '<button class="rv-close" aria-label="Close" onclick="recCloseViewer()">&times;</button></div>'
    + '<div class="rv-track" id="rv-track" onscroll="recViewerSync()"></div>'
    + '<button class="rv-arrow l" aria-label="Previous" onclick="recViewerStep(-1)">&#8249;</button>'
    + '<button class="rv-arrow r" aria-label="Next" onclick="recViewerStep(1)">&#8250;</button>';
  el.addEventListener('click', function(e) { if (e.target === el || e.target.classList.contains('rv-slide')) recCloseViewer(); });
  document.body.appendChild(el);
  document.addEventListener('keydown', function(e) {
    if (!el.classList.contains('open')) return;
    if (e.key === 'Escape') recCloseViewer();
    if (e.key === 'ArrowRight') recViewerStep(1);
    if (e.key === 'ArrowLeft') recViewerStep(-1);
  });
  return el;
}

function recOpenViewer(idx, kind, start) {
  var r = recVisible[idx]; if (!r) return;
  var imgs = kind === 'menu' ? recMenu(r) : recPhotos(r);
  openViewer(r.name + (kind === 'menu' ? ' — Menu' : ''), imgs, start);
}

// Full-screen swipeable viewer used by recommendations, menus and the style guide.
function openViewer(title, imgs, start) {
  if (!imgs || !imgs.length) return;
  var el = recViewerEl();
  document.getElementById('rv-title').textContent = title;
  document.getElementById('rv-track').innerHTML = imgs.map(function(u) { return '<div class="rv-slide"><img src="' + u + '" alt=""></div>'; }).join('');
  var multi = imgs.length > 1;
  el.querySelectorAll('.rv-arrow').forEach(function(b) { b.style.visibility = multi ? '' : 'hidden'; });
  el.classList.add('open');
  document.body.style.overflow = 'hidden';
  var t = document.getElementById('rv-track');
  t.style.scrollBehavior = 'auto'; t.scrollLeft = (start || 0) * t.clientWidth; t.style.scrollBehavior = '';
  recViewerSync();
}

function recCloseViewer() {
  var el = document.getElementById('rec-viewer'); if (el) el.classList.remove('open');
  document.body.style.overflow = '';
}

function recViewerStep(dir) {
  var t = document.getElementById('rv-track'); if (!t) return;
  var n = t.children.length, i = Math.round(t.scrollLeft / t.clientWidth);
  t.scrollTo({ left: Math.max(0, Math.min(n - 1, i + dir)) * t.clientWidth });
}

function recViewerSync() {
  var t = document.getElementById('rv-track'); if (!t) return;
  var n = t.children.length, i = Math.round(t.scrollLeft / t.clientWidth);
  document.getElementById('rv-count').textContent = n > 1 ? (i + 1) + ' / ' + n : '';
}

function recTileHTML(r, cat, idx) {
  var photos = recPhotos(r);
  var gid = 'recg' + idx;
  var gal = '<div class="rec-gal">';
  if (photos.length) {
    gal += '<div class="rec-track" id="' + gid + '" onscroll="recSync(\'' + gid + '\')">'
      + photos.map(function(u, k) { return '<img src="' + u + '" alt="' + recEsc(r.name) + '" loading="lazy" onclick="recOpenViewer(' + idx + ',\'photos\',' + k + ')">'; }).join('') + '</div>';
    if (photos.length > 1) {
      gal += '<button class="rec-arrow l" aria-label="Previous photo" onclick="recSlide(\'' + gid + '\',-1)">&#8249;</button>'
        + '<button class="rec-arrow r" aria-label="Next photo" onclick="recSlide(\'' + gid + '\',1)">&#8250;</button>'
        + '<div class="rec-dots" id="' + gid + '-dots">' + photos.map(function(_, i) { return '<span' + (i === 0 ? ' class="on"' : '') + '></span>'; }).join('') + '</div>';
    }
  } else {
    gal += '<div class="rec-noimg">' + cat.icon + '</div>';
  }
  gal += '</div>';

  var chips = [r.price_range, r.walk_time ? (/walk/i.test(r.walk_time) ? '🚶 ' : '📍 ') + r.walk_time : '', r.booking].filter(Boolean)
    .map(function(c) { return '<span class="rec-chip">' + recEsc(c) + '</span>'; }).join('');
  var map = recSafeUrl(r.maps_url);
  return '<div class="rec-tile">' + gal + '<div class="rec-body">'
    + '<div class="rec-title">' + recEsc(r.name) + '</div>'
    + (chips ? '<div class="rec-chips">' + chips + '</div>' : '')
    + (r.description ? '<div class="rec-info">' + recEsc(r.description).replace(/\n/g, '<br>') + '</div>' : '')
    + (r.popular ? '<div class="rec-info"><b>Popular:</b> ' + recEsc(r.popular) + '</div>' : '')
    + (r.hours ? '<div class="rec-info"><b>Hours:</b> ' + recEsc(r.hours) + '</div>' : '')
    + (r.tip ? '<div class="rec-tip"><b>Latisha\'s tip:</b> ' + recEsc(r.tip) + '</div>' : '')
    + ((map || recSafeUrl(r.menu_url) || recMenu(r).length) ? '<div class="rec-actions">'
        + (recMenu(r).length ? '<button type="button" class="rec-btn" style="border:none;cursor:pointer" onclick="recOpenViewer(' + idx + ',\'menu\')">View Menu</button>'
           : recSafeUrl(r.menu_url) ? '<a class="rec-btn" href="' + recSafeUrl(r.menu_url) + '" target="_blank" rel="noopener">View Menu ↗</a>' : '')
        + (map ? '<a class="rec-map" href="' + map + '" target="_blank" rel="noopener">Open in Maps ↗</a>' : '')
        + '</div>' : '')
    + '</div></div>';
}

function recSlide(gid, dir) {
  var t = document.getElementById(gid); if (!t) return;
  var n = t.children.length, i = Math.round(t.scrollLeft / t.clientWidth);
  var j = (i + dir + n) % n;   // wraps around at the ends
  t.scrollTo({ left: j * t.clientWidth });
}

function recSync(gid) {
  var t = document.getElementById(gid), d = document.getElementById(gid + '-dots');
  if (!t || !d) return;
  var i = Math.round(t.scrollLeft / t.clientWidth);
  Array.prototype.forEach.call(d.children, function(s, k) { s.className = k === i ? 'on' : ''; });
}

function renderRecommendationsPanel() {
  var cats = recCatsWithItems();
  if (!recsData || recsData.length === 0 || cats.length === 0) {
    return '<div class="empty"><div class="em-icon">📍</div>Recommendations are coming soon for your trip.</div>';
  }
  if (!cats.some(function(c) { return c.id === recFilter; })) recFilter = cats[0].id;
  var cat = cats.filter(function(c) { return c.id === recFilter; })[0];
  var list = recsData.filter(function(r) { return r.category === recFilter; });
  recVisible = list;
  return recSubTabsHTML(cats)
    + '<div class="rec-grid">' + list.map(function(r, i) { return recTileHTML(r, cat, i); }).join('') + '</div>';
}

function setRecFilter(cat) {
  recFilter = cat;
  var panel = document.getElementById('panel-recs');
  if (panel) panel.innerHTML = renderRecommendationsPanel();
}

/* ═══════════ Tailoring (Inspiration Board — ported) ═══════════ */

var SB_URL = SUPABASE_URL;
var SB_KEY = SUPABASE_KEY;
var STORAGE_BUCKET = 'inspiration-photos';

var currentClient = null;
var boardItems = [];
var saveTimers = {};
var activeFilter = 'All';
var openedItemId = null;
var tailoringInited = false;

function tailoringPanelHTML() {
  return '<div class="board-header"><h1>Your Inspiration Board</h1><p>Add items you love — we\'ll bring them to life in Vietnam</p></div>'
    + '<div class="add-item-bar">'
    + '<select id="newCategory"><option value="">Choose a category…</option>'
    + '<option>Tops</option><option>Pants</option><option>Shorts</option><option>Jackets / Blazers</option>'
    + '<option>Suits</option><option>Shoes</option><option>Accessories</option><option>Dresses</option>'
    + '</select>'
    + '<button class="btn btn-primary btn-sm" onclick="addItem()">+ Add Item</button>'
    + '</div>'
    + '<div id="filterTabs" class="filter-tabs" style="display:none"></div>'
    + '<div id="itemsList"></div>'
    + '<div id="emptyState" class="empty-state" style="display:none"><div class="icon" style="font-size:40px;margin-bottom:12px;opacity:.4">✦</div><h3 style="font-family:\'Playfair Display\',serif;font-size:19px;color:var(--text-mid);margin-bottom:6px">No items yet</h3><p style="font-size:13px;color:var(--text-light)">Select a category above and add your first inspiration piece</p></div>';
}

async function sb(path, opts) {
  opts = opts || {};
  var res = await fetch(SB_URL + '/rest/v1/' + path, Object.assign({
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', Prefer: opts.prefer || '' }
  }, opts));
  if (!res.ok) { var e = await res.text(); throw new Error(e); }
  var text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function uploadPhoto(file, clientId, itemId, slot) {
  var ext = file.name.split('.').pop().toLowerCase();
  var path = clientId + '/' + itemId + '/' + slot + '_' + Date.now() + '.' + ext;
  var res = await fetch(SB_URL + '/storage/v1/object/' + STORAGE_BUCKET + '/' + path, {
    method: 'POST',
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': file.type },
    body: file
  });
  if (!res.ok) throw new Error('Upload failed');
  return path;
}

async function deletePhoto(path) {
  await fetch(SB_URL + '/storage/v1/object/' + STORAGE_BUCKET + '/' + path, {
    method: 'DELETE',
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
  });
}

function photoUrl(path) { return SB_URL + '/storage/v1/object/public/' + STORAGE_BUCKET + '/' + path; }

function showToast(msg, isError) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(function(){ t.className = 'toast'; }, 2500);
}
function flashSaved() {
  var s = document.getElementById('saveIndicator');
  s.classList.add('show');
  setTimeout(function(){ s.classList.remove('show'); }, 1800);
}

/* Silent "login" using the identity already established on the Vietnam dashboard —
   no second name/email form. Finds or creates the matching inspiration_clients row. */
async function initTailoringBoard() {
  if (tailoringInited) return;
  if (!dashClient || !dashClient.name || !dashClient.email) return;
  tailoringInited = true;
  try {
    var clients = await sb('inspiration_clients?email=eq.' + encodeURIComponent(dashClient.email) + '&select=*');
    if (clients.length > 0) {
      currentClient = clients[0];
      if (currentClient.name !== dashClient.name) {
        await sb('inspiration_clients?id=eq.' + currentClient.id, { method: 'PATCH', body: JSON.stringify({ name: dashClient.name }) });
        currentClient.name = dashClient.name;
      }
    } else {
      var created = await sb('inspiration_clients', { method: 'POST', body: JSON.stringify({ name: dashClient.name, email: dashClient.email }), prefer: 'return=representation' });
      currentClient = created[0];
    }
    await loadItems();
  } catch (e) {
    console.error(e);
    document.getElementById('itemsList').innerHTML = '<div class="empty"><div class="em-icon">✦</div>Couldn’t load your moodboard. Please refresh and try again.</div>';
  }
}

async function loadItems() {
  boardItems = await sb('inspiration_items?client_id=eq.' + currentClient.id + '&order=sort_order.asc,created_at.asc&select=*,inspiration_photos(*),inspiration_item_colours(*)');
  renderBoardItems();
}

function renderFilterTabs() {
  var cats = {};
  boardItems.forEach(function(i){ cats[i.category] = (cats[i.category] || 0) + 1; });
  var tabContainer = document.getElementById('filterTabs');
  if (boardItems.length <= 1) { tabContainer.style.display = 'none'; return; }
  tabContainer.style.display = 'flex';
  var allActive = activeFilter === 'All' ? 'active' : '';
  var html = '<div class="filter-tab ' + allActive + '" onclick="setFilter(\'All\')">All <span class="count">' + boardItems.length + '</span></div>';
  Object.keys(cats).sort().forEach(function(cat) {
    var active = activeFilter === cat ? 'active' : '';
    html += '<div class="filter-tab ' + active + '" onclick="setFilter(\'' + cat.replace(/'/g, "\\'") + '\')">' + cat + ' <span class="count">' + cats[cat] + '</span></div>';
  });
  tabContainer.innerHTML = html;
}

function setFilter(cat) {
  activeFilter = cat;
  openedItemId = null;
  renderBoardItems();
}

function renderPhotoSlots(itemId, photoMap) {
  return ['front','back','side_left','side_right'].map(function(slot) {
    var p = photoMap[slot];
    var slotLabel = slot.replace('_',' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
    var cls = 'photo-slot' + (p ? ' has-photo' : '');
    var inner = '';
    if (p) {
      inner = '<img src="' + photoUrl(p.storage_path) + '" alt="' + slotLabel + '">'
        + '<button class="remove-photo" onclick="event.stopPropagation();removePhoto(\'' + itemId + '\',\'' + p.id + '\',\'' + p.storage_path + '\')">✕</button>';
    } else {
      inner = '<span class="plus">+</span>';
    }
    return '<div class="' + cls + '" onclick="event.stopPropagation();triggerUpload(\'' + itemId + '\',\'' + slot + '\')">'
      + inner
      + '<span class="label">' + slotLabel + '</span>'
      + '<input type="file" id="file-' + itemId + '-' + slot + '" accept="image/*" onchange="handlePhoto(event,\'' + itemId + '\',\'' + slot + '\')">'
      + '</div>';
  }).join('');
}

function toggleShelf(itemId) {
  openedItemId = (openedItemId === itemId) ? null : itemId;
  renderBoardItems();
  if (openedItemId) {
    setTimeout(function() {
      var shelf = document.getElementById('shelf-' + itemId);
      if (shelf) shelf.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
  }
}

function renderBoardItems() {
  renderFilterTabs();
  var list = document.getElementById('itemsList');
  var empty = document.getElementById('emptyState');
  if (boardItems.length === 0) { list.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  var filtered = activeFilter === 'All' ? boardItems : boardItems.filter(function(i){ return i.category === activeFilter; });
  if (filtered.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:36px;color:var(--text-light);font-size:13px">No items in this category</div>';
    return;
  }

  var html = '<div class="tile-grid">';
  filtered.forEach(function(item) {
    var photos = item.inspiration_photos || [];
    var frontPhoto = photos.filter(function(p){ return p.slot === 'front'; })[0];
    var isOpen = openedItemId === item.id;

    html += '<div class="item-tile ' + (isOpen ? 'active' : '') + '" onclick="toggleShelf(\'' + item.id + '\')">'
      + '<div class="tile-thumb">' + (frontPhoto ? '<img src="' + photoUrl(frontPhoto.storage_path) + '" alt="' + item.category + '">' : '<div class="placeholder"><span class="plus">+</span>No photo yet</div>') + '</div>'
      + '<div class="tile-info"><span class="item-category">' + item.category + ((item.quantity||1)>1 ? ' <span style="font-weight:700;margin-left:2px">×' + item.quantity + '</span>' : '') + '</span>'
      + renderTileSwatches(item)
      + '<span class="tile-arrow">▾</span></div>'
      + '</div>';

    if (isOpen) {
      var photoMap = {};
      photos.forEach(function(p){ photoMap[p.slot] = p; });
      html += '<div class="item-shelf" id="shelf-' + item.id + '">'
        + '<div class="shelf-header"><span class="item-category">' + item.category + '</span>'
        + '<div class="shelf-actions">'
        + '<button class="icon-btn" onclick="event.stopPropagation();toggleShelf(\'' + item.id + '\')" title="Close">✕</button>'
        + '<button class="icon-btn delete" onclick="event.stopPropagation();deleteItem(\'' + item.id + '\')" title="Delete">🗑</button>'
        + '</div></div>'
        + '<div class="photo-grid">' + renderPhotoSlots(item.id, photoMap) + '</div>'
        + '<div class="prompts-section">'
        + '<div class="form-group full"><label>What do you love about this piece?</label><textarea data-field="prompt_love" oninput="autoSave(\'' + item.id + '\',this)">' + (item.prompt_love || '') + '</textarea></div>'
        + '<div class="form-group full"><label>What fabric/material are you after?</label><textarea data-field="prompt_colour_fabric" oninput="autoSave(\'' + item.id + '\',this)" placeholder="e.g. Silk, linen, cotton…">' + (item.prompt_colour_fabric || '') + '</textarea></div>'
        + '<div class="form-group"><label>Occasion or use?</label><select data-field="prompt_occasion" onchange="handleOccasion(\'' + item.id + '\',this)"><option value="">Select…</option>'
        + ['Casual','Work','Event','Travel','Wedding'].map(function(o){ return '<option ' + (item.prompt_occasion===o?'selected':'') + '>' + o + '</option>'; }).join('')
        + '<option ' + (item.prompt_occasion && ['Casual','Work','Event','Travel','Wedding',''].indexOf(item.prompt_occasion)===-1 ? 'selected' : '') + ' value="__other">Other</option></select>'
        + (item.prompt_occasion && ['Casual','Work','Event','Travel','Wedding',''].indexOf(item.prompt_occasion)===-1 ? '<input type="text" style="margin-top:8px" value="' + item.prompt_occasion + '" data-field="prompt_occasion" oninput="autoSave(\'' + item.id + '\',this)" placeholder="Describe the occasion…">' : '')
        + '</div>'
        + '<div class="form-group"><label>Exact replica or inspired by it?</label><select data-field="prompt_exact_or_inspired" onchange="autoSave(\'' + item.id + '\',this)"><option value="">Select…</option>'
        + ['Exact replica','Inspired by it','Not sure yet'].map(function(o){ return '<option ' + (item.prompt_exact_or_inspired===o?'selected':'') + '>' + o + '</option>'; }).join('') + '</select></div>'
        + '<div class="form-group full"><label>What fit do you prefer?</label><textarea data-field="prompt_fit" oninput="autoSave(\'' + item.id + '\',this)" placeholder="e.g. Slim through the chest, relaxed in the body…">' + (item.prompt_fit || '') + '</textarea></div>'
        + '<div class="form-group full"><label>Anything you\'d change about this piece?</label><textarea data-field="prompt_changes" oninput="autoSave(\'' + item.id + '\',this)">' + (item.prompt_changes || '') + '</textarea></div>'
        + '<div class="form-group"><label>How important is this piece?</label><select data-field="prompt_priority" onchange="autoSave(\'' + item.id + '\',this)"><option value="">Select…</option>'
        + ['Must-have','Nice-to-have','Just browsing'].map(function(o){ return '<option ' + (item.prompt_priority===o?'selected':'') + '>' + o + '</option>'; }).join('') + '</select></div>'
        + '<div class="form-group"><label>Reference link (optional)</label><input type="url" data-field="prompt_source_url" value="' + (item.prompt_source_url || '') + '" oninput="autoSave(\'' + item.id + '\',this)" placeholder="https://…"></div>'
        + '</div>'
        + '<div class="qty-colour-section"><div class="qc-title">How many do you want made &amp; in what colours?</div>'
        + '<div class="qc-qty-row"><label>Quantity</label><div class="qc-stepper"><button onclick="event.stopPropagation();changeQty(\'' + item.id + '\',-1)">−</button><span id="qty-display-' + item.id + '">' + (item.quantity || 1) + '</span><button onclick="event.stopPropagation();changeQty(\'' + item.id + '\',1)">+</button></div></div>'
        + '<div id="colour-units-' + item.id + '">' + renderColourUnits(item) + '</div>'
        + '<div class="qc-hint">Tap each circle to pick a colour</div></div>'
        + '</div>';
    }
  });
  html += '</div>';
  list.innerHTML = html;
}

async function addItem() {
  var cat = document.getElementById('newCategory').value;
  if (!cat) { showToast('Please select a category first', true); return; }
  try {
    var created = await sb('inspiration_items', { method: 'POST', body: JSON.stringify({ client_id: currentClient.id, category: cat, sort_order: boardItems.length }), prefer: 'return=representation' });
    document.getElementById('newCategory').value = '';
    openedItemId = created[0].id;
    await loadItems();
    setTimeout(function() {
      var shelf = document.getElementById('shelf-' + created[0].id);
      if (shelf) shelf.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  } catch (e) {
    showToast('Failed to add item', true);
  }
}

async function deleteItem(itemId) {
  if (!confirm('Delete this item and all its photos?')) return;
  try {
    var item = boardItems.filter(function(i){ return i.id === itemId; })[0];
    if (item && item.inspiration_photos) {
      for (var i = 0; i < item.inspiration_photos.length; i++) {
        await deletePhoto(item.inspiration_photos[i].storage_path).catch(function(){});
      }
    }
    await sb('inspiration_photos?item_id=eq.' + itemId, { method: 'DELETE' });
    await sb('inspiration_admin_notes?item_id=eq.' + itemId, { method: 'DELETE' });
    await sb('inspiration_item_colours?item_id=eq.' + itemId, { method: 'DELETE' });
    await sb('inspiration_items?id=eq.' + itemId, { method: 'DELETE' });
    if (openedItemId === itemId) openedItemId = null;
    await loadItems();
    showToast('Item deleted');
  } catch (e) {
    showToast('Failed to delete', true);
  }
}

function autoSave(itemId, el) {
  var field = el.dataset.field;
  var value = el.value;
  var key = itemId + '-' + field;
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(async function() {
    try {
      var body = {}; body[field] = value; body.updated_at = new Date().toISOString();
      await sb('inspiration_items?id=eq.' + itemId, { method: 'PATCH', body: JSON.stringify(body) });
      var item = boardItems.filter(function(i){ return i.id === itemId; })[0];
      if (item) item[field] = value;
      flashSaved();
    } catch (e) {
      showToast('Save failed — please try again', true);
    }
  }, 600);
}

function handleOccasion(itemId, el) {
  if (el.value === '__other') {
    var item = boardItems.filter(function(i){ return i.id === itemId; })[0];
    if (item) item.prompt_occasion = '';
    renderBoardItems();
    setTimeout(function() {
      var shelf = document.getElementById('shelf-' + itemId);
      if (shelf) { var inp = shelf.querySelector('input[data-field="prompt_occasion"]'); if (inp) inp.focus(); }
    }, 50);
  } else {
    autoSave(itemId, el);
  }
}

function triggerUpload(itemId, slot) { document.getElementById('file-' + itemId + '-' + slot).click(); }

async function handlePhoto(e, itemId, slot) {
  var file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { showToast('Photo must be under 5MB', true); return; }
  var item = boardItems.filter(function(i){ return i.id === itemId; })[0];
  var existing = ((item && item.inspiration_photos) || []).filter(function(p){ return p.slot === slot; })[0];
  try {
    if (existing) {
      await deletePhoto(existing.storage_path).catch(function(){});
      await sb('inspiration_photos?id=eq.' + existing.id, { method: 'DELETE' });
    }
    var path = await uploadPhoto(file, currentClient.id, itemId, slot);
    await sb('inspiration_photos', { method: 'POST', body: JSON.stringify({ item_id: itemId, slot: slot, storage_path: path }) });
    await loadItems();
    flashSaved();
  } catch (e) {
    showToast('Photo upload failed', true);
  }
}

async function removePhoto(itemId, photoId, path) {
  try {
    await deletePhoto(path).catch(function(){});
    await sb('inspiration_photos?id=eq.' + photoId, { method: 'DELETE' });
    await loadItems();
    flashSaved();
  } catch (e) {
    showToast('Failed to remove photo', true);
  }
}

function renderColourUnits(item) {
  var qty = item.quantity || 1;
  var colours = item.inspiration_item_colours || [];
  var html = '';
  for (var u = 1; u <= qty; u++) {
    var c = colours.filter(function(x){ return x.unit_number === u; })[0] || {};
    var unitLabel = qty > 1 ? 'Unit ' + u : 'Colours';
    html += '<div class="colour-unit"><div class="colour-unit-num">' + unitLabel + '</div>'
      + '<div class="colour-pick-group"><span class="colour-pick-label">Primary</span>' + renderColourCircle(item.id, u, 'primary_colour', c.primary_colour) + '</div>'
      + '<div class="colour-pick-group"><span class="colour-pick-label">Backup</span>' + renderColourCircle(item.id, u, 'backup_colour', c.backup_colour) + '</div>'
      + '</div>';
  }
  return html;
}

function renderColourCircle(itemId, unitNum, colField, val) {
  var bg = val ? 'background:' + val + ';' : '';
  return '<div class="colour-circle" style="' + bg + '"><input type="color" value="' + (val || '#cccccc') + '" onchange="saveColour(\'' + itemId + '\',' + unitNum + ',\'' + colField + '\',this.value)"></div>';
}

function renderTileSwatches(item) {
  var colours = item.inspiration_item_colours || [];
  if (colours.length === 0) return '';
  var dots = '';
  colours.slice().sort(function(a,b){ return a.unit_number - b.unit_number; }).forEach(function(c) {
    if (c.primary_colour) dots += '<div class="tile-swatch" style="background:' + c.primary_colour + '"></div>';
    if (c.backup_colour) dots += '<div class="tile-swatch" style="background:' + c.backup_colour + ';opacity:0.6"></div>';
  });
  if (!dots) return '';
  return '<div class="tile-swatches">' + dots + '</div>';
}

async function changeQty(itemId, delta) {
  var item = boardItems.filter(function(i){ return i.id === itemId; })[0];
  if (!item) return;
  var qty = (item.quantity || 1) + delta;
  if (qty < 1) qty = 1;
  if (qty > 10) qty = 10;
  try {
    await sb('inspiration_items?id=eq.' + itemId, { method: 'PATCH', body: JSON.stringify({ quantity: qty, updated_at: new Date().toISOString() }) });
    item.quantity = qty;
    var colours = item.inspiration_item_colours || [];
    var toDelete = colours.filter(function(c){ return c.unit_number > qty; });
    for (var i = 0; i < toDelete.length; i++) { await sb('inspiration_item_colours?id=eq.' + toDelete[i].id, { method: 'DELETE' }); }
    item.inspiration_item_colours = colours.filter(function(c){ return c.unit_number <= qty; });
    flashSaved();
    renderBoardItems();
  } catch(e) {
    showToast('Failed to update quantity', true);
  }
}

async function saveColour(itemId, unitNum, colField, value) {
  var item = boardItems.filter(function(i){ return i.id === itemId; })[0];
  if (!item) return;
  var colours = item.inspiration_item_colours || [];
  var existing = colours.filter(function(c){ return c.unit_number === unitNum; })[0];
  try {
    if (existing) {
      var body = {}; body[colField] = value;
      await sb('inspiration_item_colours?id=eq.' + existing.id, { method: 'PATCH', body: JSON.stringify(body) });
      existing[colField] = value;
    } else {
      var body2 = { item_id: itemId, unit_number: unitNum }; body2[colField] = value;
      var res = await sb('inspiration_item_colours', { method: 'POST', body: JSON.stringify(body2), prefer: 'return=representation' });
      if (!item.inspiration_item_colours) item.inspiration_item_colours = [];
      item.inspiration_item_colours.push(Array.isArray(res) ? res[0] : res);
    }
    flashSaved();
    renderBoardItems();
  } catch(e) {
    showToast('Failed to save colour', true);
  }
}

  sgGroups = {};

/* Checklist: saved to the client's record via /api/vietnam-info */
function sgLoadChecklist() {
  fetch('/api/vietnam-info', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: infoBody('get') })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var saved = data && data.info && data.info.style_checklist;
      sgChecklist = saved && typeof saved === 'object' ? saved : { items: {}, notes: {}, reflection: '' };
      if (sgSection === 'checklist') renderStyleGuide();
    })
    .catch(function() { sgChecklist = { items: {}, notes: {}, reflection: '' }; if (sgSection === 'checklist') renderStyleGuide(); });
}

var sgSaveTimer = null;
function sgQueueSave() {
  var el = document.getElementById('sg-save-state'); if (el) el.textContent = 'Saving…';
  clearTimeout(sgSaveTimer);
  sgSaveTimer = setTimeout(function() {
    fetch('/api/vietnam-info', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: infoBody('save_checklist', { checklist: sgChecklist }) })
      .then(function(r) { return r.json(); })
      .then(function(d) { var e = document.getElementById('sg-save-state'); if (e) e.textContent = d && d.ok ? 'Saved ✓' : ((d && d.error) || 'Couldn’t save'); })
      .catch(function() { var e = document.getElementById('sg-save-state'); if (e) e.textContent = 'Couldn’t save — check your connection'; });
  }, 700);
}

function sgCheck(key, val) {
  sgChecklist.items = sgChecklist.items || {};
  sgChecklist.items[key] = sgChecklist.items[key] === val ? '' : val;
  var keep = {}; document.querySelectorAll('#panel-style textarea').forEach(function(t) { keep[t.id] = t.value; });
  renderStyleGuide();
  Object.keys(keep).forEach(function(id) { var t = document.getElementById(id); if (t) t.value = keep[id]; });
  sgQueueSave();
}
function sgNote(gi, v) { sgChecklist.notes = sgChecklist.notes || {}; sgChecklist.notes[gi] = v; sgQueueSave(); }
function sgReflect(v) { sgChecklist.reflection = v; sgQueueSave(); }

/* Client/itinerary/recommendations now come from /api/vietnam-dashboard, which
   verifies the session email server-side before returning anything — the
   browser no longer has direct read access to these tables (anon access was
   revoked). A cid alone in the URL is not enough to see someone's data. */
function init() {
  var cid = qs('cid');
  var nameParam = qs('name');
  var email = '';
  try { email = sessionStorage.getItem('vt_email') || ''; } catch (e) {}

  if (!cid || !email) { showLoginRequired(); return; }

  document.getElementById('app-root').innerHTML = '<div class="center-box"><div class="empty">Loading your dashboard…</div></div>';

  fetch('/api/vietnam-dashboard', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cid: cid, email: email })
  })
    .then(function(r) { return r.json().then(function(data) { return { status: r.status, data: data }; }); })
    .then(function(res) {
      if (!res.data || !res.data.ok) { showNotFound(); return; }
      dashClient = Object.assign({}, res.data.client, { email: email });
      recsData = res.data.recommendations || [];
      faqData = res.data.faqs || [];
      tourInfo = res.data.tour || {};
      var displayName = nameParam || dashClient.name;
      document.getElementById('app-root').innerHTML =
        sidebarHTML(displayName)
        + '<div class="main">'
        + '<div class="ph"><div class="ptitle">Vietnam Tailoring Tour</div><div class="psub">Your personal trip dashboard</div></div>'
        + renderCountdownBanner(res.data.itinerary)
        + '<div class="tab-panel on" id="panel-intro">' + renderIntroPanel(res.data.tour) + '</div>'
        + '<div class="tab-panel" id="panel-itinerary">' + renderItinerary(res.data.itinerary) + '</div>'
        + '<div class="tab-panel" id="panel-packing">' + renderPackingPanel() + '</div>'
        + '<div class="tab-panel" id="panel-recs">' + renderRecommendationsPanel() + '</div>'
        + '<div class="tab-panel" id="panel-map">' + vtMapPanelHTML() + '</div>'
        + '<div class="tab-panel" id="panel-budget">' + renderBudgetPanel() + '</div>'
        + '<div class="tab-panel" id="panel-faq">' + renderFaqPanel() + '</div>'
        + '<div class="tab-panel" id="panel-needtoknow">' + renderNeedToKnowPanel() + '</div>'
        + '<div class="tab-panel" id="panel-style"></div>'
        + '<div class="tab-panel" id="panel-tailoring">' + tailoringPanelHTML() + '</div>'
        + '<div class="tab-panel" id="panel-yourinfo">' + '<div class="empty">Loading your info…</div>' + '</div>'
        + '<div class="footer" style="text-align:left;padding:24px 0 0">Questions? Email <a href="mailto:hello@yourszn.com.au" style="color:var(--muted)">hello@yourszn.com.au</a></div>'
        + '</div>'
        + bottomTabsHTML();
    })
    .catch(function() {
      document.getElementById('app-root').innerHTML = '<div class="center-box"><div class="empty">Something went wrong loading your dashboard. Please try again.</div></div>';
    });
}

init();
</script>
</body>
</html>
