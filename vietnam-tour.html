<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your SZN — Vietnam Tailoring Tour</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Almarai:wght@300;400;700&family=Inter:wght@300;400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F7F3EE; --warm: #F2EDE6; --sand: #E5DDD4;
    --tan: #C9B99A; --charcoal: #1C1712; --deep: #1C1712;
    --green: #7A8C6E; --rose: #C49A8A; --gold: #B8965A;
    --muted: #8A7D72;
    /* mapped from the ported Inspiration Board component styles */
    --bg-card: #FFFFFF; --border: var(--sand); --border-light: var(--warm);
    --text-mid: #6B5E53; --text-light: var(--muted);
    --accent: var(--charcoal); --accent-hover: #000000; --accent-soft: var(--tan);
    --tag-bg: var(--warm); --danger: #C4685A; --danger-bg: #FDF0EE; --success: var(--green);
    --radius: 14px; --radius-sm: 8px;
    --shadow: 0 2px 10px rgba(28,23,18,.04); --shadow-md: 0 10px 26px rgba(28,23,18,.1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--cream); color: var(--charcoal);
    min-height: 100vh;
  }
  /* ── Sidebar (matches the internal staff dashboard's sidebar exactly) ── */
  .sidebar {
    position: fixed; left: 0; top: 0; width: 220px; height: 100vh;
    background: #F9F5F0; border-right: 1px solid var(--sand);
    display: flex; flex-direction: column; padding: 32px 0;
    z-index: 100; transition: width .22s cubic-bezier(.4,0,.2,1); overflow: hidden;
  }
  #sb-toggle-btn {
    position: absolute; top: 16px; right: -12px; width: 24px; height: 24px;
    border-radius: 50%; background: #F9F5F0; border: 1px solid var(--sand);
    color: var(--muted); font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 101; line-height: 1; box-shadow: 0 1px 4px rgba(28,23,18,.1);
  }
  .slogo {
    font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300;
    color: var(--charcoal); letter-spacing: 3px; text-transform: uppercase;
    padding: 0 28px 24px; border-bottom: 1px solid var(--sand); white-space: nowrap;
  }
  .slogo span { font-style: italic; opacity: .6; }
  .suser { padding: 14px 28px; border-bottom: 1px solid var(--sand); margin-bottom: 8px; white-space: nowrap; }
  .sulab { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .suname { font-size: 13px; color: var(--charcoal); margin-top: 3px; font-weight: 500; }
  .snav { flex: 1; padding: 8px 0; display: flex; flex-direction: column; gap: 2px; }
  .nitem {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 16px; margin: 1px 12px; border-radius: 8px;
    font-family: 'Inter', sans-serif; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); cursor: pointer; transition: all .2s; white-space: nowrap;
  }
  .nitem svg { width: 14px; height: 14px; flex-shrink: 0; stroke: currentColor; }
  .nitem:hover { background: var(--sand); color: var(--charcoal); }
  .nitem.on { background: var(--charcoal); color: #F9F5F0; }
  .sout {
    display: block; margin: 8px 20px 0; padding: 10px; border-radius: 8px;
    border: 1px solid var(--sand); color: var(--muted); background: none;
    font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    text-align: center; text-decoration: none; cursor: pointer; transition: all .2s; white-space: nowrap;
  }
  .sout:hover { background: var(--sand); color: var(--charcoal); }

  body.sb-collapsed .sidebar { width: 56px; }
  body.sb-collapsed .slogo,
  body.sb-collapsed .suser,
  body.sb-collapsed .nitem span,
  body.sb-collapsed .sout { display: none; }
  body.sb-collapsed .nitem { justify-content: center; margin: 1px 8px; padding: 11px 0; }
  body.sb-collapsed .main { margin-left: 56px; }

  /* ── Main content ── */
  .main { margin-left: 220px; min-height: 100vh; padding: 32px 44px 40px; transition: margin-left .22s cubic-bezier(.4,0,.2,1); }
  .ph { margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid var(--sand); }
  .ptitle { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 400; color: var(--charcoal); }
  .psub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .countdown-banner {
    background: var(--charcoal); border-radius: 14px;
    padding: 22px 28px; margin-bottom: 22px;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  .countdown-num { font-family: 'Cormorant Garamond', serif; font-size: 40px; color: #fff; line-height: 1; }
  .countdown-label { font-family: 'Inter', sans-serif; font-size: 14px; color: #F2EDE6; }
  @media (max-width: 480px) { .countdown-banner { padding: 18px 20px; } .countdown-num { font-size: 32px; } }
  .tab-panel { display: none; }
  .tab-panel.on { display: block; }

  /* ── Bottom tab bar (mobile) ── */
  .bottom-tabs {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
    background: #fff; border-top: 1px solid var(--sand);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .bt-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    border: none; background: none; cursor: pointer;
    font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: .3px;
    color: var(--muted); padding: 6px 2px;
  }
  .bt-item svg { width: 18px; height: 18px; stroke: currentColor; }
  .bt-item.on { color: var(--charcoal); }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .main { margin-left: 0 !important; padding: 20px 16px 90px; }
    .bottom-tabs { display: flex; }
  }

  /* ── Cards (Itinerary / Recommendations) ── */
  .card {
    background: white; border: 1px solid var(--sand); border-radius: 14px;
    padding: 22px 24px; margin-bottom: 16px;
    box-shadow: 0 2px 10px rgba(28,23,18,.04);
  }
  .day-heading {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 22px; color: var(--charcoal);
    margin: 26px 0 10px;
  }
  .day-heading:first-child { margin-top: 0; }
  .itin-item { display:flex; gap:14px; padding: 12px 0; border-bottom: 1px solid var(--warm); }
  .itin-item:last-child { border-bottom: none; }
  .itin-time {
    font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700;
    color: var(--rose); text-transform: uppercase; letter-spacing: .5px;
    flex-shrink: 0; width: 84px; padding-top: 2px;
  }
  .itin-title { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; color: var(--charcoal); }
  .itin-desc { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .itin-loc { font-size: 12px; color: var(--tan); margin-top: 4px; }
  .itin-loc::before { content: '📍 '; }

  .rec-subtabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .rec-subtab {
    padding: 9px 20px; border: 1px solid var(--sand); border-radius: 24px;
    font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
    background: white; color: var(--muted); transition: all .2s;
  }
  .rec-subtab:hover { border-color: var(--charcoal); color: var(--charcoal); }
  .rec-subtab.on { background: var(--charcoal); color: #fff; border-color: var(--charcoal); }
  .rec-card {
    display:flex; align-items:flex-start; gap: 14px;
    background: white; border: 1px solid var(--sand); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 10px;
  }
  .rec-pin {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink:0;
    background: var(--warm); display:flex; align-items:center; justify-content:center;
    font-size: 18px;
  }
  .rec-name { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; color: var(--charcoal); }
  .rec-desc { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .rec-link {
    display:inline-block; margin-top: 8px;
    font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; color: var(--charcoal);
    text-decoration: underline; text-underline-offset: 3px;
  }

  .pack-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 22px; color: var(--charcoal);
    margin-bottom: 4px;
  }
  .pack-sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .pack-cat { font-family:'DM Sans',sans-serif; font-size: 11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color: var(--rose); margin: 16px 0 8px; }
  .pack-cat:first-of-type { margin-top: 0; }
  .pack-row { display:flex; align-items:center; gap:10px; padding: 7px 0; user-select:none; }
  .pack-row input { width:18px; height:18px; accent-color: var(--green); cursor:pointer; flex-shrink:0; }
  .pack-row .pack-item-text { font-size: 14px; color: var(--charcoal); flex:1; min-width:0; word-break:break-word; }
  .pack-row.checked .pack-item-text { color: var(--muted); text-decoration: line-through; }
  .pack-row-actions { display:flex; gap:4px; flex-shrink:0; opacity:.55; }
  .pack-icon-btn { border:none; background:none; cursor:pointer; font-size:12px; color:var(--muted); padding:4px; line-height:1; }
  .pack-icon-btn:hover { color: var(--charcoal); }
  .pack-edit-input { flex:1; font-size:14px; color:var(--charcoal); font-family:'Inter',sans-serif; border:1px solid var(--sand); border-radius:6px; padding:4px 8px; outline:none; }
  .pack-edit-input:focus { border-color: var(--charcoal); }
  .pack-add-bar { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .pack-add-bar input { border:1px solid var(--sand); border-radius:8px; padding:9px 12px; font-family:'Inter',sans-serif; font-size:13px; background:white; color:var(--charcoal); outline:none; }
  .pack-add-bar input:focus { border-color: var(--charcoal); }
  .pack-add-bar #pack-new-cat { width:160px; flex-shrink:0; }
  .pack-add-bar #pack-new-text { flex:1; min-width:140px; }
  @media (max-width: 480px) { .pack-add-bar #pack-new-cat { width:100%; } }

  /* Budget */
  .budget-summary-card { background:white; border:1px solid var(--sand); border-radius:14px; padding:22px 24px; margin-bottom:20px; box-shadow:0 2px 10px rgba(28,23,18,.04); }
  .budget-stat { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .budget-stat-label { font-family:'DM Sans',sans-serif; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .budget-stat-value { font-family:'Cormorant Garamond',serif; font-size:24px; color:var(--charcoal); }
  .budget-progress-track { width:100%; height:8px; border-radius:6px; background:var(--warm); overflow:hidden; margin:12px 0 8px; }
  .budget-progress-fill { height:100%; background:var(--green); border-radius:6px; transition:width .3s ease; }
  .budget-progress-fill.over { background:var(--rose); }
  .budget-remaining { font-size:13px; color:var(--muted); }
  .budget-remaining.over { color:var(--rose); font-weight:600; }
  .budget-goal-edit { display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .budget-goal-edit input { border:1px solid var(--sand); border-radius:8px; padding:8px 12px; font-family:'Inter',sans-serif; font-size:13px; width:140px; outline:none; }
  .budget-goal-edit input:focus { border-color:var(--charcoal); }
  .budget-row { display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--warm); }
  .budget-row:last-child { border-bottom:none; }
  .budget-row-date { font-family:'DM Sans',sans-serif; font-size:11px; color:var(--tan); width:64px; flex-shrink:0; }
  .budget-row-main { flex:1; min-width:0; }
  .budget-row-desc { font-size:14px; color:var(--charcoal); }
  .budget-row-cat { font-size:11px; color:var(--muted); margin-top:1px; }
  .budget-row-amount { font-family:'Cormorant Garamond',serif; font-size:17px; color:var(--charcoal); flex-shrink:0; }

  .empty { text-align:center; padding: 50px 20px; color: var(--muted); font-size: 14px; }
  .empty .em-icon { font-size: 30px; margin-bottom: 10px; }

  .center-box { display:flex; align-items:center; justify-content:center; min-height: 50vh; padding: 20px; }
  .msg-card {
    max-width: 420px; width:100%; background:white; border:1px solid var(--sand);
    border-radius:14px; padding: 36px 30px; text-align:center;
    box-shadow: 0 2px 10px rgba(28,23,18,.04);
  }
  .msg-title { font-family:'Cormorant Garamond',Georgia,serif; font-size:24px; color:var(--charcoal); margin-bottom:8px; }
  .msg-desc { font-size:13px; color:var(--muted); line-height:1.6; margin-bottom: 20px; }
  .msg-link {
    font-family:'DM Sans',sans-serif; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--charcoal); text-decoration:underline; text-underline-offset:3px;
  }
  .footer { text-align:center; font-family:'Inter',sans-serif; font-size:11px; color:var(--muted); padding: 0 20px 30px; }

  /* ══════════════ Ported: Tailoring / Inspiration Board ══════════════ */
  .board-header { margin-bottom: 24px; }
  .board-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500; margin-bottom: 4px; color: var(--charcoal); }
  .board-header p { font-size: 13px; color: var(--text-light); }

  .form-group { text-align: left; margin-bottom: 18px; }
  .form-group label { display: block; font-size: 12px; font-weight: 500; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-mid); margin-bottom: 6px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif; font-size: 14px; color: var(--charcoal); background: var(--warm);
    transition: border-color 0.2s; outline: none;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
  .form-group textarea { resize: vertical; min-height: 70px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 24px; border: none; border-radius: 24px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; letter-spacing: 0.3px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: var(--warm); color: var(--charcoal); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--border-light); }
  .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid #EACDC8; }
  .btn-danger:hover { background: #F5DDD8; }
  .btn-sm { padding: 9px 18px; font-size: 12px; }

  .add-item-bar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .add-item-bar select { padding: 10px 16px; border: 1px solid var(--border); border-radius: 24px; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--charcoal); background: var(--bg-card); outline: none; cursor: pointer; min-width: 180px; }
  .add-item-bar select:focus { border-color: var(--accent); }

  .filter-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-tab { padding: 8px 18px; border: 1px solid var(--border); border-radius: 24px; font-family: 'Inter', sans-serif; font-size: 12px; cursor: pointer; background: var(--bg-card); color: var(--text-mid); transition: all 0.2s; white-space: nowrap; }
  .filter-tab:hover { border-color: var(--accent-soft); }
  .filter-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .filter-tab .count { display: inline-block; margin-left: 4px; font-size: 10px; opacity: 0.7; }

  .tile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .item-tile { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; box-shadow: var(--shadow); transition: box-shadow 0.2s, border-color 0.2s; position: relative; }
  .item-tile:hover { box-shadow: var(--shadow-md); border-color: var(--accent-soft); }
  .item-tile.active { border-color: var(--accent); box-shadow: var(--shadow-md); }
  .tile-thumb { aspect-ratio: 3/4; background: var(--warm); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .tile-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .tile-thumb .placeholder { color: var(--text-light); font-size: 12px; text-align: center; padding: 10px; }
  .tile-thumb .placeholder .plus { font-size: 28px; line-height: 1; display: block; margin-bottom: 4px; opacity: 0.5; }
  .tile-info { padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
  .item-category { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-mid); background: var(--tag-bg); padding: 4px 10px; border-radius: 16px; }
  .tile-arrow { font-size: 13px; color: var(--text-light); transition: transform 0.2s; }
  .item-tile.active .tile-arrow { transform: rotate(180deg); }

  .item-shelf { grid-column: 1 / -1; background: var(--bg-card); border: 1px solid var(--accent); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-md); animation: shelfOpen 0.25s ease; position: relative; }
  @keyframes shelfOpen { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  .shelf-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .shelf-actions { display: flex; gap: 8px; }
  .icon-btn { width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 50%; background: var(--warm); color: var(--text-light); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; transition: all 0.2s; }
  .icon-btn:hover { border-color: var(--accent); color: var(--charcoal); }
  .icon-btn.delete:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-bg); }

  .photo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px; }
  .photo-slot { aspect-ratio: 3/4; border: 2px dashed var(--border); border-radius: var(--radius-sm); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; transition: border-color 0.2s, background 0.2s; background: var(--warm); }
  .photo-slot:hover { border-color: var(--accent-soft); }
  .photo-slot .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-light); margin-top: 6px; }
  .photo-slot .plus { font-size: 22px; color: var(--text-light); line-height: 1; }
  .photo-slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .photo-slot.has-photo { border-style: solid; border-color: var(--border); }
  .photo-slot .remove-photo { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: rgba(28,23,18,0.7); color: #fff; border: none; cursor: pointer; font-size: 13px; display: none; align-items: center; justify-content: center; z-index: 2; }
  .photo-slot.has-photo:hover .remove-photo { display: flex; }
  .photo-slot input[type="file"] { display: none; }

  .prompts-section { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .prompts-section .form-group.full { grid-column: 1 / -1; }

  .save-indicator { position: fixed; bottom: 24px; right: 24px; background: var(--accent); color: #fff; padding: 10px 20px; border-radius: 24px; font-size: 13px; font-weight: 500; opacity: 0; transform: translateY(10px); transition: all 0.3s; z-index: 100; pointer-events: none; }
  .save-indicator.show { opacity: 1; transform: translateY(0); }
  .toast { position: fixed; top: 24px; right: 24px; background: var(--bg-card); border: 1px solid var(--border); padding: 14px 22px; border-radius: var(--radius); box-shadow: var(--shadow-md); font-size: 13px; z-index: 200; opacity: 0; transform: translateY(-10px); transition: all 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { border-color: var(--danger); color: var(--danger); }

  .qty-colour-section { margin-top: 18px; padding: 18px; background: var(--warm); border-radius: var(--radius); border: 1px solid var(--border-light); }
  .qc-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-mid); margin-bottom: 14px; }
  .qc-qty-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .qc-qty-row label { font-size: 13px; color: var(--text-mid); font-weight: 500; }
  .qc-stepper { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 24px; overflow: hidden; background: var(--bg-card); }
  .qc-stepper button { width: 34px; height: 34px; border: none; background: none; cursor: pointer; font-size: 17px; color: var(--text-mid); font-family: inherit; transition: background .15s; }
  .qc-stepper button:hover { background: var(--border-light); }
  .qc-stepper span { min-width: 30px; text-align: center; font-size: 14px; font-weight: 600; color: var(--charcoal); }

function fmtDate(d) {
  if (!d) return '';
  var dt = new Date(d + 'T00:00:00');
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
}

function renderCountdownBanner(items) {
  var dates = (items || []).map(function(it){ return it.item_date; }).filter(Boolean).sort();
  if (dates.length === 0) return '';
  var first = new Date(dates[0] + 'T00:00:00');
  var last = new Date(dates[dates.length - 1] + 'T00:00:00');
  var today = new Date(); today.setHours(0,0,0,0);
  var daysUntil = Math.round((first - today) / 86400000);

  var big, small;
  if (daysUntil > 1) {
    big = daysUntil; small = 'days until your Vietnam Tailoring Tour';
  } else if (daysUntil === 1) {
    big = '1'; small = 'day until your Vietnam Tailoring Tour';
  } else if (daysUntil === 0) {
    big = '✈️'; small = 'Your Vietnam Tailoring Tour starts today!';
  } else if (today <= last) {
    big = '🇻🇳'; small = 'Enjoy your Vietnam Tailoring Tour!';
  } else {
    big = '✨'; small = 'We hope you had an amazing trip!';
  }
  return '<div class="countdown-banner"><div class="countdown-num">' + big + '</div><div class="countdown-label">' + small + '</div></div>';
}

function renderItinerary(items) {
  if (!items || items.length === 0) {
    return '<div class="empty"><div class="em-icon">🗓️</div>Your itinerary hasn\'t been added yet.<br>Check back soon.</div>';
  }
  var byDay = {};
  items.forEach(function(it) {
    var d = it.day_number || 0;
    if (!byDay[d]) byDay[d] = [];
    byDay[d].push(it);
  });
  var days = Object.keys(byDay).sort(function(a,b){ return a-b; });
  var html = '';
  days.forEach(function(d) {
    var dayItems = byDay[d];
    var dateLabel = fmtDate(dayItems[0].item_date);
    html += '<div class="day-heading">Day ' + d + (dateLabel ? ' — ' + dateLabel : '') + '</div><div class="card">';
    dayItems.forEach(function(it) {
      html += '<div class="itin-item">'
        + '<div class="itin-time">' + (it.time_label || '') + '</div>'
        + '<div><div class="itin-title">' + it.title + '</div>'
        + (it.description ? '<div class="itin-desc">' + it.description + '</div>' : '')
        + (it.location ? '<div class="itin-loc">' + it.location + '</div>' : '')
        + '</div></div>';
    });
    html += '</div>';
  });
  return html;
}

var packingLoaded = false;

function packingCategoryOptions() {
  var cats = [];
  packingItems.forEach(function(it) { if (cats.indexOf(it.category) === -1) cats.push(it.category); });
  return cats.map(function(c) { return '<option value="' + c.replace(/"/g, '&quot;') + '">'; }).join('');

function renderPackingPanel() {
  if (!packingLoaded) {
    return '<div class="empty">Loading your packing list…</div>';

  if (packingItems.length === 0) {
    return packingPanelShell('<div class="empty" style="padding:30px 0"><div class="em-icon">🧳</div>No items yet — add your first one above.</div>');
  }
  var byCat = {};
  var order = [];
  packingItems.forEach(function(it) {
    if (!byCat[it.category]) { byCat[it.category] = []; order.push(it.category); }

  });
  var html = '<div class="card">';
  order.forEach(function(cat) {
    html += '<div class="pack-cat">' + cat + '</div>';
    byCat[cat].forEach(function(it) {
      html += '<div class="pack-row' + (it.is_checked ? ' checked' : '') + '" data-id="' + it.id + '">'
        + '<input type="checkbox" ' + (it.is_checked ? 'checked' : '') + ' onchange="togglePackItem(\'' + it.id + '\',this.checked)">'
        + '<span class="pack-item-text" id="pack-text-' + it.id + '">' + it.item_text + '</span>'
        + '<span class="pack-row-actions">'
        + '<button class="pack-icon-btn" onclick="startEditPackItem(\'' + it.id + '\')" title="Rename">✎</button>'

function packingBody(action, extra) {

function loadPackingPanel() {
  var panel = document.getElementById('panel-packing');
  if (!panel) return;
  panel.innerHTML = renderPackingPanel();
  fetch('/api/vietnam-packing', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: packingBody('list') })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      packingLoaded = true;
      packingItems = (data && data.items) || [];
      panel.innerHTML = renderPackingPanel();
    })
    .catch(function() {
      packingLoaded = true;
      panel.innerHTML = '<div class="empty">Couldn’t load your packing list. Please try again.</div>';
    });
}

function addPackItem() {
  var catEl = document.getElementById('pack-new-cat');
  var textEl = document.getElementById('pack-new-text');
  var category = (catEl.value || 'My Items').trim();
  var text = (textEl.value || '').trim();
  if (!text) { textEl.focus(); return; }
  textEl.value = '';
  fetch('/api/vietnam-packing', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: packingBody('add', { category: category, item_text: text }) })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      packingItems = (data && data.items) || packingItems;
      document.getElementById('panel-packing').innerHTML = renderPackingPanel();
      var newCat = document.getElementById('pack-new-cat'); if (newCat) newCat.value = category;
    })
    .catch(function() { showToast('Failed to add item', true); });
}

function togglePackItem(id, checked) {
  var item = packingItems.filter(function(i){ return i.id === id; })[0];
  if (item) item.is_checked = checked;
  var row = document.querySelector('.pack-row[data-id="' + id + '"]');
  if (row) row.classList.toggle('checked', checked);
  fetch('/api/vietnam-packing', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: packingBody('toggle', { id: id, is_checked: checked }) })
    .catch(function() { showToast('Failed to save — please try again', true); });
}

function startEditPackItem(id) {
  var span = document.getElementById('pack-text-' + id);
  if (!span) return;
  var current = span.textContent;
  var input = document.createElement('input');
  input.className = 'pack-edit-input';
  input.value = current;
  input.onblur = function() { savePackItemEdit(id, input.value); };

  span.replaceWith(input);
  input.focus();
  input.select();
}

function savePackItemEdit(id, newText) {
  newText = (newText || '').trim();
  var item = packingItems.filter(function(i){ return i.id === id; })[0];
  if (!newText || !item) { document.getElementById('panel-packing').innerHTML = renderPackingPanel(); return; }
  item.item_text = newText;
  document.getElementById('panel-packing').innerHTML = renderPackingPanel();
  fetch('/api/vietnam-packing', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: packingBody('edit', { id: id, item_text: newText }) })
    .catch(function() { showToast('Failed to save — please try again', true); });

function deletePackItem(id) {
  packingItems = packingItems.filter(function(i){ return i.id !== id; });

var budgetItems = [];

function fmtMoney(n) {

function budgetBody(action, extra) {

function budgetSummaryHTML() {
  var spent = budgetItems.reduce(function(sum, it) { return sum + Number(it.amount || 0); }, 0);

  if (budgetGoalEditing) {

      + '<button class="pack-icon-btn" onclick="cancelBudgetGoalEdit()">Cancel</button>'
      + '</div>';
  } else if (budgetGoal) {
    var pct = Math.min(100, Math.round((spent / budgetGoal) * 100));
    var over = spent > budgetGoal;
    html += '<div class="budget-stat"><div class="budget-stat-label">Goal <button class="pack-icon-btn" onclick="startBudgetGoalEdit()" title="Edit goal">✎</button></div><div class="budget-stat-value">' + fmtMoney(budgetGoal) + '</div></div>'
      + '<div class="budget-progress-track"><div class="budget-progress-fill' + (over ? ' over' : '') + '" style="width:' + pct + '%"></div></div>'
      + '<div class="budget-remaining' + (over ? ' over' : '') + '">' + (over ? 'You’re ' + fmtMoney(spent - budgetGoal) + ' over your goal' : fmtMoney(budgetGoal - spent) + ' remaining') + '</div>';
  } else {
    html += '<button class="btn btn-secondary btn-sm" onclick="startBudgetGoalEdit()">+ Set a Spending Goal</button>';
  }
  html += '</div>';
  return html;
}

function renderBudgetPanel() {
  if (!budgetLoaded) return '<div class="empty">Loading your budget…</div>';

function loadBudgetPanel() {
  var panel = document.getElementById('panel-budget');

  panel.innerHTML = renderBudgetPanel();
  fetch('/api/vietnam-budget', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: budgetBody('list') })

    .then(function(data) {
      budgetLoaded = true;
      budgetItems = (data && data.items) || [];
      budgetGoal = data && data.goal;
      panel.innerHTML = renderBudgetPanel();
    })
    .catch(function() {
      budgetLoaded = true;
      panel.innerHTML = '<div class="empty">Couldn’t load your budget. Please try again.</div>';
    });
}

function startBudgetGoalEdit() { budgetGoalEditing = true; document.getElementById('panel-budget').innerHTML = renderBudgetPanel(); document.getElementById('budget-goal-input').focus(); }
function cancelBudgetGoalEdit() { budgetGoalEditing = false; document.getElementById('panel-budget').innerHTML = renderBudgetPanel(); }

function saveBudgetGoal() {
  var val = Number(document.getElementById('budget-goal-input').value);
  if (!val || val <= 0) { showToast('Enter a valid amount', true); return; }
  budgetGoal = val;
  budgetGoalEditing = false;
  document.getElementById('panel-budget').innerHTML = renderBudgetPanel();
  fetch('/api/vietnam-budget', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: budgetBody('set_goal', { amount: val }) })
    .catch(function() { showToast('Failed to save goal', true); });
}

function addBudgetItem() {
  var dateEl = document.getElementById('budget-new-date');
  var catEl = document.getElementById('budget-new-cat');
  var descEl = document.getElementById('budget-new-desc');
  var amtEl = document.getElementById('budget-new-amount');
  var amount = Number(amtEl.value);
  if (!amount || amount <= 0) { amtEl.focus(); return; }
  var payload = { expense_date: dateEl.value || null, category: catEl.value.trim(), description: descEl.value.trim(), amount: amount };
  catEl.value = ''; descEl.value = ''; amtEl.value = '';
  fetch('/api/vietnam-budget', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: budgetBody('add', payload) })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      budgetItems = (data && data.items) || budgetItems;
      document.getElementById('panel-budget').innerHTML = renderBudgetPanel();
    })
    .catch(function() { showToast('Failed to add expense', true); });
}

function deleteBudgetItem(id) {
  budgetItems = budgetItems.filter(function(i){ return i.id !== id; });
  document.getElementById('panel-budget').innerHTML = renderBudgetPanel();
  fetch('/api/vietnam-budget', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: budgetBody('delete', { id: id }) })
    .catch(function() { showToast('Failed to remove — please try again', true); });
}

async function sb(path, opts) {
  opts = opts || {};
  var res = await fetch(SB_URL + '/rest/v1/' + path, Object.assign({
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', Prefer: opts.prefer || '' }
  }, opts));
  if (!res.ok) { var e = await res.text(); throw new Error(e); }
  var text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function uploadPhoto(file, clientId, itemId, slot) {
  var ext = file.name.split('.').pop().toLowerCase();
  var path = clientId + '/' + itemId + '/' + slot + '_' + Date.now() + '.' + ext;
  var res = await fetch(SB_URL + '/storage/v1/object/' + STORAGE_BUCKET + '/' + path, {
    method: 'POST',
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': file.type },
    body: file
  });
  if (!res.ok) throw new Error('Upload failed');
  return path;
}

async function deletePhoto(path) {
  await fetch(SB_URL + '/storage/v1/object/' + STORAGE_BUCKET + '/' + path, {
    method: 'DELETE',
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
  });
}

function photoUrl(path) { return SB_URL + '/storage/v1/object/public/' + STORAGE_BUCKET + '/' + path; }

function showToast(msg, isError) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(function(){ t.className = 'toast'; }, 2500);
}
function flashSaved() {

/* Silent "login" using the identity already established on the Vietnam dashboard —
   no second name/email form. Finds or creates the matching inspiration_clients row. */
async function initTailoringBoard() {
  if (tailoringInited) return;
  if (!dashClient || !dashClient.name || !dashClient.email) return;
  tailoringInited = true;
  try {
    var clients = await sb('inspiration_clients?email=eq.' + encodeURIComponent(dashClient.email) + '&select=*');
    if (clients.length > 0) {
      currentClient = clients[0];
      if (currentClient.name !== dashClient.name) {
        await sb('inspiration_clients?id=eq.' + currentClient.id, { method: 'PATCH', body: JSON.stringify({ name: dashClient.name }) });
        currentClient.name = dashClient.name;
      }
    } else {
      var created = await sb('inspiration_clients', { method: 'POST', body: JSON.stringify({ name: dashClient.name, email: dashClient.email }), prefer: 'return=representation' });
      currentClient = created[0];
    }
    await loadItems();
  } catch (e) {
    console.error(e);
    document.getElementById('itemsList').innerHTML = '<div class="empty"><div class="em-icon">✦</div>Couldn’t load your moodboard. Please refresh and try again.</div>';
  }
}

async function loadItems() {
  boardItems = await sb('inspiration_items?client_id=eq.' + currentClient.id + '&order=sort_order.asc,created_at.asc&select=*,inspiration_photos(*),inspiration_item_colours(*)');
  renderBoardItems();
}

function renderFilterTabs() {
  var cats = {};
  boardItems.forEach(function(i){ cats[i.category] = (cats[i.category] || 0) + 1; });
  var tabContainer = document.getElementById('filterTabs');
  if (boardItems.length <= 1) { tabContainer.style.display = 'none'; return; }
  tabContainer.style.display = 'flex';
  var allActive = activeFilter === 'All' ? 'active' : '';
  var html = '<div class="filter-tab ' + allActive + '" onclick="setFilter(\'All\')">All <span class="count">' + boardItems.length + '</span></div>';
  Object.keys(cats).sort().forEach(function(cat) {
    var active = activeFilter === cat ? 'active' : '';
    html += '<div class="filter-tab ' + active + '" onclick="setFilter(\'' + cat.replace(/'/g, "\\'") + '\')">' + cat + ' <span class="count">' + cats[cat] + '</span></div>';
  });
  tabContainer.innerHTML = html;
}

function setFilter(cat) {
  activeFilter = cat;
  openedItemId = null;
  renderBoardItems();
}

function renderPhotoSlots(itemId, photoMap) {
  return ['front','back','side_left','side_right'].map(function(slot) {
    var p = photoMap[slot];
    var slotLabel = slot.replace('_',' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
    var cls = 'photo-slot' + (p ? ' has-photo' : '');
    var inner = '';
    if (p) {
      inner = '<img src="' + photoUrl(p.storage_path) + '" alt="' + slotLabel + '">'
        + '<button class="remove-photo" onclick="event.stopPropagation();removePhoto(\'' + itemId + '\',\'' + p.id + '\',\'' + p.storage_path + '\')">✕</button>';
    } else {
      inner = '<span class="plus">+</span>';
    }
    return '<div class="' + cls + '" onclick="event.stopPropagation();triggerUpload(\'' + itemId + '\',\'' + slot + '\')">'
      + inner
      + '<span class="label">' + slotLabel + '</span>'
      + '<input type="file" id="file-' + itemId + '-' + slot + '" accept="image/*" onchange="handlePhoto(event,\'' + itemId + '\',\'' + slot + '\')">'
      + '</div>';
  }).join('');
}

function toggleShelf(itemId) {
  openedItemId = (openedItemId === itemId) ? null : itemId;
  renderBoardItems();
  if (openedItemId) {
    setTimeout(function() {
      var shelf = document.getElementById('shelf-' + itemId);
      if (shelf) shelf.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
  }
}

function renderBoardItems() {
  renderFilterTabs();
  var list = document.getElementById('itemsList');
  var empty = document.getElementById('emptyState');
  if (boardItems.length === 0) { list.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  var filtered = activeFilter === 'All' ? boardItems : boardItems.filter(function(i){ return i.category === activeFilter; });
  if (filtered.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:36px;color:var(--text-light);font-size:13px">No items in this category</div>';
    return;
  }

  var html = '<div class="tile-grid">';
  filtered.forEach(function(item) {
    var photos = item.inspiration_photos || [];
    var frontPhoto = photos.filter(function(p){ return p.slot === 'front'; })[0];
    var isOpen = openedItemId === item.id;

    html += '<div class="item-tile ' + (isOpen ? 'active' : '') + '" onclick="toggleShelf(\'' + item.id + '\')">'
      + '<div class="tile-thumb">' + (frontPhoto ? '<img src="' + photoUrl(frontPhoto.storage_path) + '" alt="' + item.category + '">' : '<div class="placeholder"><span class="plus">+</span>No photo yet</div>') + '</div>'
      + '<div class="tile-info"><span class="item-category">' + item.category + ((item.quantity||1)>1 ? ' <span style="font-weight:700;margin-left:2px">×' + item.quantity + '</span>' : '') + '</span>'
      + renderTileSwatches(item)
      + '<span class="tile-arrow">▾</span></div>'
      + '</div>';

    if (isOpen) {
      var photoMap = {};
      photos.forEach(function(p){ photoMap[p.slot] = p; });
      html += '<div class="item-shelf" id="shelf-' + item.id + '">'
        + '<div class="shelf-header"><span class="item-category">' + item.category + '</span>'
        + '<div class="shelf-actions">'
        + '<button class="icon-btn" onclick="event.stopPropagation();toggleShelf(\'' + item.id + '\')" title="Close">✕</button>'
        + '<button class="icon-btn delete" onclick="event.stopPropagation();deleteItem(\'' + item.id + '\')" title="Delete">🗑</button>'
        + '</div></div>'
        + '<div class="photo-grid">' + renderPhotoSlots(item.id, photoMap) + '</div>'
        + '<div class="prompts-section">'
        + '<div class="form-group full"><label>What do you love about this piece?</label><textarea data-field="prompt_love" oninput="autoSave(\'' + item.id + '\',this)">' + (item.prompt_love || '') + '</textarea></div>'
        + '<div class="form-group full"><label>What fabric/material are you after?</label><textarea data-field="prompt_colour_fabric" oninput="autoSave(\'' + item.id + '\',this)" placeholder="e.g. Silk, linen, cotton…">' + (item.prompt_colour_fabric || '') + '</textarea></div>'
        + '<div class="form-group"><label>Occasion or use?</label><select data-field="prompt_occasion" onchange="handleOccasion(\'' + item.id + '\',this)"><option value="">Select…</option>'
        + ['Casual','Work','Event','Travel','Wedding'].map(function(o){ return '<option ' + (item.prompt_occasion===o?'selected':'') + '>' + o + '</option>'; }).join('')
        + '<option ' + (item.prompt_occasion && ['Casual','Work','Event','Travel','Wedding',''].indexOf(item.prompt_occasion)===-1 ? 'selected' : '') + ' value="__other">Other</option></select>'
        + (item.prompt_occasion && ['Casual','Work','Event','Travel','Wedding',''].indexOf(item.prompt_occasion)===-1 ? '<input type="text" style="margin-top:8px" value="' + item.prompt_occasion + '" data-field="prompt_occasion" oninput="autoSave(\'' + item.id + '\',this)" placeholder="Describe the occasion…">' : '')
        + '</div>'
        + '<div class="form-group"><label>Exact replica or inspired by it?</label><select data-field="prompt_exact_or_inspired" onchange="autoSave(\'' + item.id + '\',this)"><option value="">Select…</option>'
        + ['Exact replica','Inspired by it','Not sure yet'].map(function(o){ return '<option ' + (item.prompt_exact_or_inspired===o?'selected':'') + '>' + o + '</option>'; }).join('') + '</select></div>'
        + '<div class="form-group full"><label>What fit do you prefer?</label><textarea data-field="prompt_fit" oninput="autoSave(\'' + item.id + '\',this)" placeholder="e.g. Slim through the chest, relaxed in the body…">' + (item.prompt_fit || '') + '</textarea></div>'
        + '<div class="form-group full"><label>Anything you\'d change about this piece?</label><textarea data-field="prompt_changes" oninput="autoSave(\'' + item.id + '\',this)">' + (item.prompt_changes || '') + '</textarea></div>'
        + '<div class="form-group"><label>How important is this piece?</label><select data-field="prompt_priority" onchange="autoSave(\'' + item.id + '\',this)"><option value="">Select…</option>'
        + ['Must-have','Nice-to-have','Just browsing'].map(function(o){ return '<option ' + (item.prompt_priority===o?'selected':'') + '>' + o + '</option>'; }).join('') + '</select></div>'
        + '<div class="form-group"><label>Reference link (optional)</label><input type="url" data-field="prompt_source_url" value="' + (item.prompt_source_url || '') + '" oninput="autoSave(\'' + item.id + '\',this)" placeholder="https://…"></div>'
        + '</div>'
        + '<div class="qty-colour-section"><div class="qc-title">How many do you want made &amp; in what colours?</div>'
        + '<div class="qc-qty-row"><label>Quantity</label><div class="qc-stepper"><button onclick="event.stopPropagation();changeQty(\'' + item.id + '\',-1)">−</button><span id="qty-display-' + item.id + '">' + (item.quantity || 1) + '</span><button onclick="event.stopPropagation();changeQty(\'' + item.id + '\',1)">+</button></div></div>'
        + '<div id="colour-units-' + item.id + '">' + renderColourUnits(item) + '</div>'
        + '<div class="qc-hint">Tap each circle to pick a colour</div></div>'
        + '</div>';
    }
  });
  html += '</div>';
  list.innerHTML = html;
}

async function addItem() {
  var cat = document.getElementById('newCategory').value;
  if (!cat) { showToast('Please select a category first', true); return; }
  try {
    var created = await sb('inspiration_items', { method: 'POST', body: JSON.stringify({ client_id: currentClient.id, category: cat, sort_order: boardItems.length }), prefer: 'return=representation' });
    document.getElementById('newCategory').value = '';
    openedItemId = created[0].id;
    await loadItems();
    setTimeout(function() {
      var shelf = document.getElementById('shelf-' + created[0].id);
      if (shelf) shelf.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  } catch (e) {
    showToast('Failed to add item', true);
  }
}

async function deleteItem(itemId) {
  if (!confirm('Delete this item and all its photos?')) return;
  try {
    var item = boardItems.filter(function(i){ return i.id === itemId; })[0];
    if (item && item.inspiration_photos) {
      for (var i = 0; i < item.inspiration_photos.length; i++) {
        await deletePhoto(item.inspiration_photos[i].storage_path).catch(function(){});
      }
    }
    await sb('inspiration_photos?item_id=eq.' + itemId, { method: 'DELETE' });
    await sb('inspiration_admin_notes?item_id=eq.' + itemId, { method: 'DELETE' });
    await sb('inspiration_item_colours?item_id=eq.' + itemId, { method: 'DELETE' });
    await sb('inspiration_items?id=eq.' + itemId, { method: 'DELETE' });
    if (openedItemId === itemId) openedItemId = null;
    await loadItems();
    showToast('Item deleted');
  } catch (e) {
    showToast('Failed to delete', true);
  }
}

function autoSave(itemId, el) {
  var field = el.dataset.field;
  var value = el.value;
  var key = itemId + '-' + field;
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(async function() {
    try {
      var body = {}; body[field] = value; body.updated_at = new Date().toISOString();
      await sb('inspiration_items?id=eq.' + itemId, { method: 'PATCH', body: JSON.stringify(body) });
      var item = boardItems.filter(function(i){ return i.id === itemId; })[0];
      if (item) item[field] = value;
      flashSaved();
    } catch (e) {
      showToast('Save failed — please try again', true);
    }
  }, 600);
}

function handleOccasion(itemId, el) {
  if (el.value === '__other') {
    var item = boardItems.filter(function(i){ return i.id === itemId; })[0];
    if (item) item.prompt_occasion = '';
    renderBoardItems();
    setTimeout(function() {
      var shelf = document.getElementById('shelf-' + itemId);
      if (shelf) { var inp = shelf.querySelector('input[data-field="prompt_occasion"]'); if (inp) inp.focus(); }
    }, 50);
  } else {
    autoSave(itemId, el);
  }
}

function triggerUpload(itemId, slot) { document.getElementById('file-' + itemId + '-' + slot).click(); }

async function handlePhoto(e, itemId, slot) {
  var file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { showToast('Photo must be under 5MB', true); return; }
  var item = boardItems.filter(function(i){ return i.id === itemId; })[0];
  var existing = ((item && item.inspiration_photos) || []).filter(function(p){ return p.slot === slot; })[0];
  try {
    if (existing) {
      await deletePhoto(existing.storage_path).catch(function(){});
      await sb('inspiration_photos?id=eq.' + existing.id, { method: 'DELETE' });
    }
    var path = await uploadPhoto(file, currentClient.id, itemId, slot);
    await sb('inspiration_photos', { method: 'POST', body: JSON.stringify({ item_id: itemId, slot: slot, storage_path: path }) });
    await loadItems();
    flashSaved();
  } catch (e) {
    showToast('Photo upload failed', true);
  }
}

async function removePhoto(itemId, photoId, path) {
  try {
    await deletePhoto(path).catch(function(){});
    await sb('inspiration_photos?id=eq.' + photoId, { method: 'DELETE' });
    await loadItems();
    flashSaved();
  } catch (e) {
    showToast('Failed to remove photo', true);
  }
}

function renderColourUnits(item) {
  var qty = item.quantity || 1;
  var colours = item.inspiration_item_colours || [];
  var html = '';
  for (var u = 1; u <= qty; u++) {
    var c = colours.filter(function(x){ return x.unit_number === u; })[0] || {};
    var unitLabel = qty > 1 ? 'Unit ' + u : 'Colours';
    html += '<div class="colour-unit"><div class="colour-unit-num">' + unitLabel + '</div>'
      + '<div class="colour-pick-group"><span class="colour-pick-label">Primary</span>' + renderColourCircle(item.id, u, 'primary_colour', c.primary_colour) + '</div>'
      + '<div class="colour-pick-group"><span class="colour-pick-label">Backup</span>' + renderColourCircle(item.id, u, 'backup_colour', c.backup_colour) + '</div>'
      + '</div>';
  }
  return html;
}

function renderColourCircle(itemId, unitNum, colField, val) {
  var bg = val ? 'background:' + val + ';' : '';
  return '<div class="colour-circle" style="' + bg + '"><input type="color" value="' + (val || '#cccccc') + '" onchange="saveColour(\'' + itemId + '\',' + unitNum + ',\'' + colField + '\',this.value)"></div>';
}

function renderTileSwatches(item) {
  var colours = item.inspiration_item_colours || [];
  if (colours.length === 0) return '';
  var dots = '';
  colours.slice().sort(function(a,b){ return a.unit_number - b.unit_number; }).forEach(function(c) {
    if (c.primary_colour) dots += '<div class="tile-swatch" style="background:' + c.primary_colour + '"></div>';
    if (c.backup_colour) dots += '<div class="tile-swatch" style="background:' + c.backup_colour + ';opacity:0.6"></div>';
  });
  if (!dots) return '';
  return '<div class="tile-swatches">' + dots + '</div>';
}

async function changeQty(itemId, delta) {
  var item = boardItems.filter(function(i){ return i.id === itemId; })[0];
  if (!item) return;
  var qty = (item.quantity || 1) + delta;
  if (qty < 1) qty = 1;
  if (qty > 10) qty = 10;
  try {
    await sb('inspiration_items?id=eq.' + itemId, { method: 'PATCH', body: JSON.stringify({ quantity: qty, updated_at: new Date().toISOString() }) });
    item.quantity = qty;
    var colours = item.inspiration_item_colours || [];
    var toDelete = colours.filter(function(c){ return c.unit_number > qty; });
    for (var i = 0; i < toDelete.length; i++) { await sb('inspiration_item_colours?id=eq.' + toDelete[i].id, { method: 'DELETE' }); }
    item.inspiration_item_colours = colours.filter(function(c){ return c.unit_number <= qty; });
    flashSaved();
    renderBoardItems();
  } catch(e) {
    showToast('Failed to update quantity', true);
  }
}

async function saveColour(itemId, unitNum, colField, value) {
  var item = boardItems.filter(function(i){ return i.id === itemId; })[0];
  if (!item) return;
  var colours = item.inspiration_item_colours || [];
  var existing = colours.filter(function(c){ return c.unit_number === unitNum; })[0];
  try {
    if (existing) {
      var body = {}; body[colField] = value;
      await sb('inspiration_item_colours?id=eq.' + existing.id, { method: 'PATCH', body: JSON.stringify(body) });
      existing[colField] = value;
    } else {
      var body2 = { item_id: itemId, unit_number: unitNum }; body2[colField] = value;
      var res = await sb('inspiration_item_colours', { method: 'POST', body: JSON.stringify(body2), prefer: 'return=representation' });
      if (!item.inspiration_item_colours) item.inspiration_item_colours = [];
      item.inspiration_item_colours.push(Array.isArray(res) ? res[0] : res);
    }
    flashSaved();
    renderBoardItems();
  } catch(e) {
    showToast('Failed to save colour', true);
  }
}

function navIcon(icon, size) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:' + size + 'px;height:' + size + 'px;flex-shrink:0">' + icon + '</svg>';
}

function sidebarHTML(clientName) {
  var items = VT_NAV.map(function(item, i) {
    return '<div class="nitem' + (i === 0 ? ' on' : '') + '" data-tab="' + item.id + '" onclick="setTab(\'' + item.id + '\')">' + navIcon(item.icon, 14) + '<span class="nav-lbl">' + item.lbl + '</span></div>';
  }).join('');
  return '<aside class="sidebar" id="app-sidebar">'
    + '<button id="sb-toggle-btn" onclick="toggleSidebar()" title="Collapse sidebar">&#8249;</button>'
    + '<div class="slogo">Your <span>SZN</span></div>'
    + '<div class="suser"><div class="sulab">Logged in as</div><div class="suname">' + clientName + '</div></div>'
    + '<nav class="snav">' + items + '</nav>'
    + '<a class="sout" href="index.html">← Back to Portal</a>'
    + '</aside>';
}

function bottomTabsHTML() {
  var items = VT_NAV.map(function(item, i) {
    return '<button class="bt-item' + (i === 0 ? ' on' : '') + '" data-tab="' + item.id + '" onclick="setTab(\'' + item.id + '\')">' + navIcon(item.icon, 18) + '<span>' + item.shortLbl + '</span></button>';
  }).join('');
  return '<nav class="bottom-tabs">' + items + '</nav>';
}

function toggleSidebar() {
  document.body.classList.toggle('sb-collapsed');
  var btn = document.getElementById('sb-toggle-btn');
  btn.innerHTML = document.body.classList.contains('sb-collapsed') ? '&#8250;' : '&#8249;';
}

function setTab(tab) {
  document.querySelectorAll('.nitem, .bt-item').forEach(function(b) { b.classList.toggle('on', b.getAttribute('data-tab') === tab); });
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.toggle('on', p.id === 'panel-' + tab); });
  if (tab === 'tailoring') initTailoringBoard();
  if (tab === 'packing') loadPackingPanel();
  if (tab === 'budget') loadBudgetPanel();
}

function showLoginRequired() {
  document.getElementById('app-root').innerHTML =
    '<div class="center-box"><div class="msg-card">'
    + '<div class="msg-title">Please Log In</div>'
    + '<div class="msg-desc">Head back to the Client Portal and enter your name &amp; email on the Vietnam Tailoring Tour card to view your dashboard.</div>'
    + '<a class="msg-link" href="index.html">← Back to Client Portal</a>'
    + '</div></div>';
}

function showNotFound() {
  document.getElementById('app-root').innerHTML =
    '<div class="center-box"><div class="msg-card">'
    + '<div class="msg-title">We Couldn’t Find Your Dashboard</div>'
    + '<div class="msg-desc">Please contact your tour coordinator, or try logging in again.</div>'
    + '<a class="msg-link" href="index.html">← Back to Client Portal</a>'
    + '</div></div>';
}

/* Client/itinerary/recommendations now come from /api/vietnam-dashboard, which
   verifies the session email server-side before returning anything — the
   browser no longer has direct read access to these tables (anon access was
   revoked). A cid alone in the URL is not enough to see someone's data. */
function init() {
  var cid = qs('cid');
  var nameParam = qs('name');
  var email = '';
  try { email = sessionStorage.getItem('vt_email') || ''; } catch (e) {}

  if (!cid || !email) { showLoginRequired(); return; }

  document.getElementById('app-root').innerHTML = '<div class="center-box"><div class="empty">Loading your dashboard…</div></div>';

  fetch('/api/vietnam-dashboard', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cid: cid, email: email })
  })
    .then(function(r) { return r.json().then(function(data) { return { status: r.status, data: data }; }); })
    .then(function(res) {
      if (!res.data || !res.data.ok) { showNotFound(); return; }
      dashClient = Object.assign({}, res.data.client, { email: email });
      recsData = res.data.recommendations || [];
      var displayName = nameParam || dashClient.name;
      document.getElementById('app-root').innerHTML =
        sidebarHTML(displayName)
        + '<div class="main">'
        + '<div class="ph"><div class="ptitle">Vietnam Tailoring Tour</div><div class="psub">Your personal trip dashboard</div></div>'
        + renderCountdownBanner(res.data.itinerary)
        + '<div class="tab-panel on" id="panel-itinerary">' + renderItinerary(res.data.itinerary) + '</div>'
        + '<div class="tab-panel" id="panel-packing">' + renderPackingPanel() + '</div>'
        + '<div class="tab-panel" id="panel-recs">' + renderRecommendationsPanel() + '</div>'
        + '<div class="tab-panel" id="panel-budget">' + renderBudgetPanel() + '</div>'
        + '<div class="tab-panel" id="panel-tailoring">' + tailoringPanelHTML() + '</div>'
        + '<div class="footer" style="text-align:left;padding:24px 0 0">Questions? Email <a href="mailto:hello@yourszn.com.au" style="color:var(--muted)">hello@yourszn.com.au</a></div>'
        + '</div>'
        + bottomTabsHTML();
    })
    .catch(function() {
      document.getElementById('app-root').innerHTML = '<div class="center-box"><div class="empty">Something went wrong loading your dashboard. Please try again.</div></div>';
    });
}

init();
